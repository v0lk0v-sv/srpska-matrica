  // Только когда слова те же, а отвергнут порядок, и только если прогресс не сбросили с тех пор.
  const ex = cur; if (!ex || !ex.done || ex.ok || !ex.snap || ex.snap.rs !== S.resetAt || !sameWords(ex, ex.ans) || tooSoon(ex.checkedAt)) return;
  const put = (bucket, key, val) => { if (val) bucket[key] = val; else delete bucket[key]; };
  put(S.cells, ex.snap.k, ex.snap.c); put(S.verbs, ex.snap.vk, ex.snap.v);
  ex.ok = true; ex.overridden = true;
  commit(ex, true); renderCard();
}

// ---------- действия ----------
function place(id) {
  const ex = cur; if (!ex || ex.done || !ex.tiles || !ex.tiles[id] || tooSoon(ex.createdAt)) return;
  if (ex.kind === 'conj') {   // плитка встаёт в выбранную пустую строку, иначе — в первую пустую
    const i = ex.target != null && ex.fill[ex.target] === null ? ex.target : ex.fill.indexOf(null);
    if (i < 0 || ex.fill.includes(id)) return;
    ex.fill[i] = id; ex.target = null;
  } else { if (ex.placed.includes(id)) return; ex.placed.push(id); }
  renderCard();
  kfocus('#card .pool button.tile');
}
function setTarget(i) { const ex = cur; if (!ex || ex.kind !== 'conj' || ex.done || ex.fill[i] !== null) return; ex.target = i; renderCard(); kfocus('#card .pool button.tile'); }
function unplace(id) { const ex = cur; if (!ex || ex.done) return; ex.placed = ex.placed.filter(x => x !== id); renderCard(); }
function unfillRow(i) { const ex = cur; if (!ex || ex.kind !== 'conj' || ex.done) return; ex.fill[i] = null; renderCard(); }
function clearPlaced() {
  const ex = cur; if (!ex || ex.done) return;
  if (ex.kind === 'conj') ex.fill = ex.fill.map(() => null); else if (ex.placed) ex.placed = [];
  renderCard();
}
function checkConj() {
  const ex = cur; if (ex.fill.includes(null)) return;
  ex.res = ex.rows.map((r, i) => {
    const got = ex.tiles[ex.fill[i]].t;
    if (got.toLowerCase() === r.form.toLowerCase()) return {ok:true};
    const d = ex.distract.find(x => x.t === got);
    if (d) return {ok:false, why: d.row === i ? d.why : ''};
    const who = ex.rows.filter(q => q.form === got).map(q => P[q.p]).join(' / ');
    return {ok:false, why: `«${got}» — это форма для «${who}».`};
  });
  Object.assign(ex, {done:true, checkedAt: Date.now(), ok: ex.res.every(x => x.ok)});
  say(ex.ok ? 'Верно, все шесть форм.' : `Верно ${ex.res.filter(x => x.ok).length} из ${ex.rows.length}. Правильные формы: ` + ex.rows.filter((r, i) => !ex.res[i].ok).map(r => disp(r.form)).join(', '));
  ex.rows.forEach((r, i) => bump(S.cells, lk(`${ex.t}.${ex.f}.${GROUP[r.p]}`), ex.res[i].ok));   // каждая строка — своя клетка матрицы
  bump(S.verbs, lk(ex.v.id), ex.ok);
  persist(); renderSide(); renderCard(); revealFb();
}
function checkPoss() {
  const ex = cur; if (!ex.placed.length) return;
  ex.ans = ex.placed.map(id => ex.tiles[id].t);
  Object.assign(ex, diagnosePoss(ex, ex.ans), {done:true, checkedAt: Date.now()});
  say((ex.ok ? 'Верно. ' : 'Неверно. Правильно: ') + ex.canon.map(disp).join(' ') + (ex.ok ? '' : '. ' + plain(ex.why)));
  bump(S.poss, lk(ex.key), ex.ok); persist(); renderSide(); renderCard(); revealFb();
}
function check() {
  if (cur && cur.kind === 'conj' && !cur.done) return checkConj();
  if (cur && cur.kind === 'poss' && !cur.done) return checkPoss();
  const ex = cur; if (!ex || ex.kind === 'clitic' || ex.done || !ex.placed.length) return;
  ex.ans = ex.placed.map(id => ex.tiles[id].t);
  Object.assign(ex, diagnose(ex, ex.ans), {done:true, checkedAt: Date.now()});
  say((ex.ok ? 'Верно. ' : 'Неверно. Правильно: ') + sentence(ex.canon, ex.cell.f === 'q') + (ex.ok ? '' : ' ' + plain(ex.why)));
  commit(ex, ex.ok);
  renderCard(); revealFb();
}
function chooseSlot(s) {
  const ex = cur; if (!ex || ex.kind !== 'clitic' || ex.done || s > ex.words.length || tooSoon(ex.createdAt)) return;
  Object.assign(ex, {chosen:s, done:true, ok: s === ex.it.at || s === ex.it.alt, checkedAt: Date.now()});
  say(ex.ok ? 'Верно.' : 'Неверно.');
  commit(ex, ex.ok); renderCard(); revealFb();
}
function chooseGen(n, g) {
  const ex = cur; if (!ex || ex.kind !== 'rod' || ex.done || tooSoon(ex.createdAt)) return;
  // Проверяем само слово: «ona» — и «она» (ж. р. ед. ч.), и «они» (ср. р. мн. ч.), строка не важна.
  Object.assign(ex, {chosen:{n, g}, done:true, ok: PRON[n][g] === PRON[ex.it.n][ex.it.g], checkedAt: Date.now()});
  say((ex.ok ? 'Верно: ' : 'Неверно. Правильно: ') + disp(PRON[ex.it.n][ex.it.g]));
  bump(S.gen, lk(ex.it.w), ex.ok); persist(); renderSide(); renderCard(); revealFb();
}
function next() {
  if (cur && tooSoon(cur.checkedAt)) return;   // двойное касание «Проверить» не проскакивает разбор
  newEx(); exCache[cacheKey()] = cur; renderCard();
  kfocus('#card .pool button.tile, #card .slot, #card .gtile');
}

function setLesson(n) {
  if (S.lesson === n) return;
  S.lesson = n; pendingFocus = null;
  if (S.focus && !LESSONS[n - 1].tenses.includes(S.focus.split('.')[0])) S.focus = null;
  if (S.mode === 'clitic' && !LESSONS[n - 1].clitics) S.mode = 'conj';
  persist(true); showEx(); renderAll();
}
function setMode(m) { if (S.mode === m) return; S.mode = m; pendingFocus = null; persist(true); showEx(); renderAll(); }
// Фильтр по клетке работает в «Сборке», «Трансформациях» и (для утверждения и отрицания) в «Спряжении».
// Из другого раздела не переключаем молча — спрашиваем.
let pendingFocus = null;
const focusFits = key => !['clitic', 'rod', 'poss'].includes(S.mode) && !(S.mode === 'conj' && !conjOK(...key.split('.')));
function applyFocus(key) {
  if (key && !focusFits(key)) { pendingFocus = key; return renderModes(); }
  pendingFocus = null; S.focus = key; persist(true); showEx(); renderAll();
}
function toggleFocus(key) { applyFocus(key && S.focus !== key ? key : null); }
function setGender(g) {
  if (S.gender === g) return;
  S.gender = g; persist(true);
  for (const k of Object.keys(exCache)) if (needsGender(exCache[k])) delete exCache[k];
  if (needsGender(cur)) showEx();
  renderAll();
}
function setScript(s) { if (S.script === s) return; S.script = s; persist(true); renderAll(); }

// ---------- отрисовка ----------
function renderAll() { renderModes(); renderCard(); renderSide(); }

// «[Biti] и прошедшее»: в квадратных скобках — сербское слово.
const mixHTML = s => s.split(/(\[[^\]]+\])/).map(x => x.startsWith('[') ? sr(x.slice(1, -1)) : esc(x)).join('');
// Готовность урока — средняя закреплённость всего, что в нём открыто, по всем разделам.
function readiness(n) {
  const L = LESSONS[n - 1], avg = (keys, bucket) => keys.length ? keys.reduce((a, k) => a + (bucket[`${n}.${k}`] ? bucket[`${n}.${k}`].box / 4 : 0), 0) / keys.length : null;
  const parts = readinessParts(n).map(x => x.v);
  return parts.reduce((a, b) => a + b, 0) / parts.length;
}
function readinessParts(n) {
  const L = LESSONS[n - 1], avg = (keys, bucket) => keys.length ? keys.reduce((a, k) => a + (bucket[`${n}.${k}`] ? bucket[`${n}.${k}`].box / 4 : 0), 0) / keys.length : null;
  return [
    {mode:'build', name:'матрица времён', v: avg(L.tenses.flatMap(t => FORMS.flatMap(f => GROUPS.map(g => `${t}.${f}.${g}`))), S.cells)},
    {mode:'conj', name:'глаголы урока', v: avg(VERBS.filter(x => x.l <= n).map(x => x.id), S.verbs)},
    {mode:'clitic', name:'«Энклитики»', v: L.clitics ? avg(CLIT.filter(c => c.l <= n).map(c => c.id), S.clit) : null},
    {mode:'rod', name:'«Род»', v: avg(GEN.filter(x => nounOpen(x.n, x.g, n)).map(x => x.w), S.gen)},
    {mode:'poss', name:'«Чей»', v: avg(possCombos(n).map(c => c.k), S.poss)},
  ].filter(x => x.v !== null);
}
function renderLessons() {
  $('#lessons').innerHTML = LESSONS.map(L =>
    `<button type="button" data-lesson="${L.n}" aria-current="${S.lesson === L.n}"><span class="ln">Урок ${L.n} · ${Math.round(readiness(L.n) * 100)}%</span><span class="lt">${mixHTML(L.title)}</span></button>`).join('');
}
function renderModes() {
  const L = LESSONS[S.lesson - 1];
  $('#modes').innerHTML = MODES.filter(m => m.id !== 'clitic' || L.clitics)
    .map(m => `<button type="button" role="tab" data-mode="${m.id}" aria-controls="card" aria-selected="${S.mode === m.id}">${m.name}</button>`).join('');
  const [t, f, g] = (S.focus || '').split('.'), r = readiness(S.lesson);
  const weakest = readinessParts(S.lesson).filter(x => x.v < .75).sort((a, b) => a.v - b.v)[0];
  const nextHint = S.lesson < 3 && r >= .75 && readinessParts(S.lesson).every(x => x.v >= .5)
    ? `<div class="focusbar"><span>Урок ${S.lesson} закреплён на ${Math.round(r * 100)}% — можно переходить дальше.</span><button type="button" class="link" data-lesson="${S.lesson + 1}">К уроку ${S.lesson + 1}</button></div>`
    : weakest && r > 0 && weakest.mode !== S.mode ? `<div class="focusbar"><span>Слабее всего в этом уроке: ${weakest.name} — ${Math.round(weakest.v * 100)}%.</span><button type="button" class="link" data-mode="${weakest.mode}">Потренировать</button></div>` : '';
  const pend = pendingFocus
    ? `<div class="focusbar"><span>Тренировка одной клетки работает в «Сборке» и «Трансформациях».</span><button type="button" class="link" id="gofocus">Перейти в «Сборку»</button><button type="button" class="link" id="nofocus">Отмена</button></div>` : '';
  $('#focusbar').innerHTML = nextHint + pend + (S.focus && !['clitic', 'rod', 'poss'].includes(S.mode)
    ? `<div class="focusbar"><span class="chip to">Только: ${T_RU[t]} · ${F_RU[f]}${g ? ' · ' + GROUP_RU[g] : ''}</span><button type="button" class="link" id="unfocus">Вся матрица</button></div>` : '');
}

function renderCard() {
  const card = $('#card'), mode = MODES.find(m => m.id === S.mode);
  const fresh = !S.introSeen && ['cells', 'clit', 'gen', 'poss'].every(k => !Object.keys(S[k]).length);
  const intro = fresh
    ? `<div class="intro"><p><b>Тренажёр сербского глагола для русскоязычных.</b> Собирайте ответы из плиток — приложение объяснит каждую ошибку и чаще будет давать то, что пока не получается.</p><p>Начните с урока 1 и раздела «Спряжение». Правило к уроку — в шпаргалке.</p><div class="actions"><button type="button" class="btn sm primary" id="intro-ok">Понятно</button><button type="button" class="btn sm" id="rule">Открыть правило</button></div></div>` : '';
  const ask = S.gender === null && needsGender(cur)
    ? `<div class="ask"><p>В прошедшем времени сербский различает род (${sr('radio / radila')}). О себе вы говорите в роде:</p><div class="actions"><button type="button" class="btn sm" data-gender="m">мужском</button><button type="button" class="btn sm" data-gender="f">женском</button></div></div>`
    : '';
  const scope = ['rod', 'poss'].includes(S.mode)
    ? [' В уроке 1 — единственное число; множественное — в уроке 2, вместе с прошедшим временем.', ' Средний род множественного числа (' + sr('pisma, sela') + ') — в уроке 3.', ''][S.lesson - 1] : '';
  const lead = intro + ask + `<div class="leadrow"><p class="lead">${mode.lead}${scope}</p><button type="button" class="link" id="rule">Правило</button></div>`;
  if (S.mode === 'clitic') return renderClit(card, lead);
  if (S.mode === 'conj') return renderConj(card, lead);
  if (S.mode === 'rod') return renderGen(card, lead);
  if (S.mode === 'poss') return renderPoss(card, lead);
  renderTiles(card, lead);
}

const poolHTML = (ex, used) => `<div class="pool" role="group" aria-label="Слова">` + ex.tiles.map(tl => used.has(tl.id)
  ? `<span class="tile ghost" aria-hidden="true">${esc(disp(tl.t))}</span>`
  : `<button type="button" class="tile" data-id="${tl.id}" lang="${srLang()}"${ex.done ? ' disabled' : ''}>${esc(disp(tl.t))}</button>`).join('') + '</div>';
const HINT = '<span class="placeholder">Нажимайте слова по порядку. Слово в ответе убирается нажатием.</span>';
const verdict = (ok, text) => `<span class="verdict"><span lang="${srLang()}">${esc(disp(text || (ok ? 'Tačno!' : 'Netačno.')))}</span><span class="vru">${ok ? 'верно' : 'неверно'}</span></span>`;
const placedBtn = (attr, id, text) => `<button type="button" class="tile placed" ${attr}="${id}" lang="${srLang()}" aria-label="Убрать «${esc(disp(text))}»"${cur.done ? ' disabled' : ''}>${esc(disp(text))}</button>`;

function renderTiles(card, lead) {
  const ex = cur, q = ex.cell.f === 'q';
  // Род «я» из настроек показываем там, где задание само его не выдаёт.
  const hidden = ex.cell.p <= 1 && ex.cell.t === 'past' &&
    ((ex.kind === 'build' && ex.v.ruSpecial === 'imati') || (ex.kind === 'transform' && ex.src.t !== 'past'));
  const gchip = hidden ? `<span class="chip to">${ex.cell.p ? 'ты' : 'я'} — ${ex.cell.g ? 'женский' : 'мужской'} род</span>` : '';
  let head;
  if (ex.kind === 'build') {
    head = `<div class="meta"><span class="chip">${T_RU[ex.cell.t]}</span><span class="chip">${F_RU[ex.cell.f]}</span>${gchip}</div><p class="prompt" lang="ru">${esc(ruFor(ex.v, ex.cell))}</p>`;
  } else {
    const to = [];
    if (ex.src.t !== ex.cell.t) to.push(T_RU[ex.cell.t]);
    if (ex.src.f !== ex.cell.f) to.push(F_RU[ex.cell.f]);
    head = `<div class="meta"><span class="chip">измените на</span>${to.map(x => `<span class="chip to">→ ${x}</span>`).join('')}${gchip}</div><p class="prompt" lang="${srLang()}">${esc(sentence(canonicalFor(ex.v, ex.src), ex.src.f === 'q'))}</p><p class="gloss" lang="ru">${esc(ruFor(ex.v, ex.src))}</p>`;
  }
  const ansTiles = ex.placed.length
    ? ex.placed.map((id, i) => placedBtn('data-un', id, i === 0 ? cap(ex.tiles[id].t) : ex.tiles[id].t)).join('') + (ex.done ? `<span class="punct">${q ? '?' : '.'}</span>` : '')
    : HINT;
  let actions, fb = '';
  if (!ex.done) actions = `<button type="button" class="btn primary" id="check"${ex.placed.length ? '' : ' disabled'}>Проверить</button><button type="button" class="btn" id="clear"${ex.placed.length ? '' : ' disabled'}>Стереть</button>`;
  else {
    actions = `<button type="button" class="btn primary" id="next">Дальше</button>`;
    const canon = `<span class="sent" lang="${srLang()}">${esc(sentence(ex.canon, q))}</span>`;
    if (ex.ok) {
      const same = eqT(ex.ans, ex.canon);
      fb = `<div class="fb ok" tabindex="-1">${ex.overridden ? `<span class="verdict">Засчитано</span>` : verdict(true)}${same ? '' : `<span>Основной вариант: ${canon}</span>`}</div>`;
    } else {
      fb = `<div class="fb bad" tabindex="-1">${verdict(false)}<span><s lang="${srLang()}">${esc(sentence(ex.ans, q))}</s> → ${canon}</span><p class="why">${whyHTML(ex.why)}</p>${sameWords(ex, ex.ans) ? '<span><button type="button" class="link" id="override">Мой порядок слов тоже верный — засчитать</button></span>' : ''}</div>`;
    }
  }
  card.innerHTML = lead + head +
    `<div class="answer${ex.done ? (ex.ok ? ' ok' : ' bad') : ''}" role="group" aria-label="Ваш ответ">${ansTiles}</div>${ex.done ? '' : poolHTML(ex, new Set(ex.placed))}${fb}<div class="actions">${actions}</div>`;
}

function renderConj(card, lead) {
  const ex = cur, next = ex.target != null ? ex.target : ex.fill.indexOf(null), used = new Set(ex.fill.filter(x => x !== null));
  const who = r => {
    if (ex.t !== 'past') return esc(disp(r.p === 2 ? 'on, ona, ono' : r.p === 6 ? (S.lesson >= 3 ? 'oni, one, ona' : 'oni, one') : P[r.p]));
    const mark = r.p <= 1 ? (r.g ? ' (ж)' : ' (м)') : (r.p === 4 || r.p === 5) && r.g === 4 ? ' (ж)' : '';
    return esc(disp(P[r.p])) + mark;
  };
  // Парадигма как в сербских грамматиках: jednina слева (ja, ti, on), množina справа (mi, vi, oni).
  const cell = (r, i) => {
    const id = ex.fill[i], res = ex.done ? ex.res[i] : null;
    const slot = id === null
      ? `<button type="button" class="cslot${i === next ? ' next' : ''}${ex.target === i ? ' target' : ''}" data-target="${i}" aria-label="${esc(disp(P[r.p]))}: пусто — сюда встанет следующая плитка"${ex.done ? ' disabled' : ''}></button>`
      : placedBtn('data-row', i, ex.tiles[id].t);
    return `<div class="ccell${res ? (res.ok ? ' ok' : ' bad') : ''}"><span class="who" lang="${srLang()}">${who(r)}</span>${slot}</div>`;
  };
  const cells = ex.rows.map(cell);
  const grid = `<div class="paradigm"><span class="colh">${sr('jednina')} · ед. ч.</span>${cells.slice(0, 3).join('')}<span class="colh">${sr('množina')} · мн. ч.</span>${cells.slice(3).join('')}</div>`;
  const notes = ex.done && !ex.ok ? `<ul class="cnotes">${ex.rows.map((r, i) => ex.res[i].ok ? '' :
    `<li><span class="who" lang="${srLang()}">${who(r)}</span> <span class="sent" lang="${srLang()}">${esc(disp(r.form))}</span>${ex.res[i].why ? `<span>${whyHTML(ex.res[i].why)}</span>` : ''}</li>`).join('')}</ul>` : '';
  const actions = ex.done
    ? `<button type="button" class="btn primary" id="next">Дальше</button>`
    : `<button type="button" class="btn primary" id="check"${next < 0 ? '' : ' disabled'}>Проверить</button><button type="button" class="btn" id="clear"${used.size ? '' : ' disabled'}>Стереть</button>`;
  const right = ex.done ? ex.res.filter(x => x.ok).length : 0;
  const fb = !ex.done ? '' : ex.ok
    ? `<div class="fb ok" tabindex="-1">${verdict(true)}<span>Все шесть форм верны.</span></div>`
    : `<div class="fb bad" tabindex="-1">${verdict(false)}<span>Верно ${right} из ${ex.rows.length}. Правильные формы:</span>${notes}</div>`;
  card.innerHTML = lead + `<div class="meta"><span class="chip">${T_RU[ex.t]}</span><span class="chip">${F_RU[ex.f]}</span></div>` +
    `<p class="prompt"><span lang="${srLang()}">${esc(disp(ex.v.inf))}</span> <span class="trn" lang="ru">— ${esc(TR[ex.v.id] || ex.v.ru.inf)}</span></p>` +
    grid + (ex.done ? '' : poolHTML(ex, used)) + fb + `<div class="actions">${actions}</div>`;
}

function renderPoss(card, lead) {
  const ex = cur;
  const ans = ex.placed.length
    ? ex.placed.map((id, i) => placedBtn('data-un', id, i === 0 ? cap(ex.tiles[id].t) : ex.tiles[id].t)).join('')
    : HINT;
  const right = `<span class="sent" lang="${srLang()}">${esc(ex.canon.map(disp).join(' '))}</span>`;
  const fb = !ex.done ? '' : ex.ok
    ? `<div class="fb ok" tabindex="-1">${verdict(true)}${right}</div>`
    : `<div class="fb bad" tabindex="-1">${verdict(false)}<span><s lang="${srLang()}">${esc(ex.ans.map(disp).join(' '))}</s> → ${right}</span><p class="why">${whyHTML(ex.why)}</p></div>`;
  const actions = ex.done
    ? `<button type="button" class="btn primary" id="next">Дальше</button>`
    : `<button type="button" class="btn primary" id="check"${ex.placed.length ? '' : ' disabled'}>Проверить</button><button type="button" class="btn" id="clear"${ex.placed.length ? '' : ' disabled'}>Стереть</button>`;
  card.innerHTML = lead + `<div class="meta"><span class="chip">чей</span></div><p class="prompt" lang="ru">${esc(cap(ex.ru))}</p>` +
    `<div class="answer${ex.done ? (ex.ok ? ' ok' : ' bad') : ''}" role="group" aria-label="Ваш ответ">${ans}</div>${ex.done ? '' : poolHTML(ex, new Set(ex.placed))}${fb}<div class="actions">${actions}</div>`;
}

function renderGen(card, lead) {
  const ex = cur, it = ex.it, ch = ex.chosen, G = {m:'мужской', f:'женский', n:'средний'};
  const tile = (n, g) => {
    const cls = !ex.done ? '' : n === it.n && g === it.g || (ex.ok && ch.n === n && ch.g === g) ? ' right' : ch.n === n && ch.g === g ? ' wrong' : '';
    return `<button type="button" class="tile gtile${cls}" data-gen="${n}.${g}" lang="${srLang()}" aria-label="${esc(disp(PRON[n][g]))} — ${n === 'sg' ? 'ед. ч.' : 'мн. ч.'}"${ex.done ? ' disabled' : ''}>${esc(disp(PRON[n][g]))}</button>`;
  };
  // Показываем только открытое в уроке: в уроке 1 — одна строка, в уроке 2 — без среднего рода мн. ч.
  const row = (n, label) => {
    const gs = ['m', 'f', 'n'].filter(g => nounOpen(n, g, S.lesson));
    return gs.length ? `<div class="grow"><span class="colh">${sr(label)} · ${n === 'sg' ? 'ед. ч.' : 'мн. ч.'}</span><div class="gtiles">${gs.map(g => tile(n, g)).join('')}</div></div>` : '';
  };
  let fb = '';
  if (ex.done) {
    // Пример согласования в прошедшем — с урока 2, когда уже есть «biti» и прошедшее время.
    const example = S.lesson >= 2 ? `<span>Например: <span class="sent" lang="${srLang()}">${esc(sentence([PRON[it.n][it.g], it.n === 'sg' ? 'je' : 'su', BITI_L[it.n][it.g], 'ovde'], false))}</span></span>` : '';
    const numWrong = ch.n !== it.n;
    const numMsg = `«${it.w}» — ${it.n === 'pl' ? 'множественное' : 'единственное'} число.`;
    const why = (numWrong ? numMsg + ' ' : '') + (it.why || `«${it.w}» — ${G[it.g]} род.`);
    const same = ex.ok && numWrong ? `<p class="why">${whyHTML(`«${PRON[it.n][it.g]}» — это и «она» (ж. р. ед. ч.), и «они» (ср. р. мн. ч.). Здесь — ${it.n === 'pl' ? 'мн. ч.' : 'ед. ч.'}`)}</p>` : '';
    fb = ex.ok
      ? `<div class="fb ok" tabindex="-1">${verdict(true)}${same}${it.why ? `<p class="why">${whyHTML(it.why)}</p>` : ''}${example}</div>`
      : `<div class="fb bad" tabindex="-1">${verdict(false)}<p class="why">${whyHTML(why)}</p>${example}</div>`;
  }
  card.innerHTML = lead + `<div class="meta"><span class="chip">каким местоимением заменить</span></div>` +
    `<p class="prompt"><span lang="${srLang()}">${esc(disp(it.w))}</span> <span class="trn" lang="ru">— ${esc(it.ru)}</span></p>` +
    `<div class="gpick">${row('sg', 'jednina')}${row('pl', 'množina')}</div>` +
    fb + (ex.done ? `<div class="actions"><button type="button" class="btn primary" id="next">Дальше</button></div>` : '');
}

function renderClit(card, lead) {
  const ex = cur, it = ex.it, k = it.k;
  let row = '';
  const slot = i => {
    if (!ex.done) return `<button type="button" class="slot" data-slot="${i}" aria-label="Поставить «${esc(disp(k))}» ${i === 0 ? 'в начало' : `после «${esc(disp(ex.words[i - 1]))}»`}"></button>`;
    return i === ex.chosen ? `<span class="ins ${ex.ok ? 'ok' : 'bad'}" lang="${srLang()}">${esc(disp(k))}</span>` : '<span class="gap"></span>';
  };
  ex.words.forEach((wd, i) => { row += slot(i) + `<span class="w" lang="${srLang()}">${esc(disp(wd))}</span>`; });
  row += slot(ex.words.length) + `<span class="w punct">${it.q ? '?' : '.'}</span>`;
  const build = s => { const t = ex.words.slice(); t[0] = t[0][0].toLowerCase() + t[0].slice(1); t.splice(s, 0, k); return sentence(t, it.q); };
  let fb = '', actions = '';
  if (ex.done) {
    actions = `<button type="button" class="btn primary" id="next">Дальше</button>`;
    const right = `<span class="sent" lang="${srLang()}">${esc(build(it.at))}</span>`;
    // «Moja je sestra…» — разрыв группы допустим, но звучит книжно; основной вариант — после всей группы.
    const alt = ex.chosen === it.alt ? `<p class="why">${whyHTML(`Так тоже можно — это книжнее. В разговоре чаще после всей группы: «${ex.words.slice(0, it.at).join(' ')}».`)}</p>` : '';
    if (ex.ok) fb = `<div class="fb ok" tabindex="-1">${verdict(true)}${right}${alt}</div>`;
    else {
      const first = ex.words.slice(0, it.at).join(' ');
      const why = ex.chosen === 0 ? `«${k}» — энклитика: с неё фраза не начинается.`
        : ex.chosen < it.at ? `«${first}» — одно целое, энклитика встаёт после него.`
        : `Энклитика стоит на втором месте — сразу после «${first}».`;
      fb = `<div class="fb bad" tabindex="-1">${verdict(false)}${right}<p class="why">${whyHTML(why)}</p></div>`;
    }
  }
  card.innerHTML = lead + `<div class="meta"><span class="chip">куда поставить</span><span class="chip to" lang="${srLang()}">${esc(disp(k))}</span></div><p class="prompt" lang="ru">${esc(ex.ru)}</p><div class="slots">${row}</div>${fb}${actions ? `<div class="actions">${actions}</div>` : ''}`;
}

function mastery(t, f) { let s = 0; for (const g of GROUPS) { const r = S.cells[lk(`${t}.${f}.${g}`)]; s += r ? r.box / 4 : 0; } return s / GROUPS.length; }
const firstLesson = t => LESSONS.find(L => L.tenses.includes(t)).n;
const heatCell = (m, extra, label) => { const p = Math.round(m * 100); return `<button type="button" class="cell${extra}" style="--p:${p}%" aria-label="${label}: ${p}%"><span class="num">${p}%</span></button>`; };
function renderSide() {
  renderLessons();   // проценты уроков меняются с каждым ответом
  const L = LESSONS[S.lesson - 1], mode = S.mode, box = r => r ? r.box / 4 : 0;
  let title = 'Матрица', hint = 'Процент — насколько клетка закреплена в этом уроке. Нажмите на клетку, чтобы тренировать только её.', h = '', weak = [];
  if (mode === 'rod' || mode === 'poss') {
    title = mode === 'rod' ? 'Род: закреплённость' : 'Чей: закреплённость';
    hint = 'По числу и роду слова, только в этом уроке.';
    const items = mode === 'rod' ? GEN.map(x => ({k: x.w, n: x.n, g: x.g, label: `«${x.w}» — ${x.ru}`})) : possCombos(S.lesson).map(c => ({k: c.k, n: c.n, g: c.g, label: `${OWNER_RU[c.o]} + ${G_GEN[c.g].replace('ого', 'ий')} род, ${c.n === 'sg' ? 'ед.' : 'мн.'} ч.`}));
    const bucket = mode === 'rod' ? S.gen : S.poss;
    h = `<table class="heat"><thead><tr><th></th><th scope="col">м. р.</th><th scope="col">ж. р.</th><th scope="col">ср. р.</th></tr></thead><tbody>`;
    for (const n of ['sg', 'pl']) {
      h += `<tr><th scope="row">${n === 'sg' ? 'ед. ч.' : 'мн. ч.'}</th>`;
      for (const g of ['m', 'f', 'n']) {
        const its = items.filter(x => x.n === n && x.g === g);
        if (!nounOpen(n, g, S.lesson) || !its.length) { h += `<td><span class="cell locked">${its.length ? 'урок ' + (n === 'pl' && g === 'n' ? 3 : 2) : '—'}</span></td>`; continue; }
        h += `<td>${heatCell(its.reduce((a, x) => a + box(bucket[lk(x.k)]), 0) / its.length, ' static', `${n}, ${g}`)}</td>`;
      }
      h += '</tr>';
    }
    h += '</tbody></table>';
    weak = items.filter(x => nounOpen(x.n, x.g, S.lesson)).map(x => [x.label, bucket[lk(x.k)]]);
  } else if (mode === 'clitic') {
    title = 'Энклитики: закреплённость';
    const its = CLIT.filter(c => c.l <= S.lesson), done = its.filter(c => box(S.clit[lk(c.id)]) >= .75).length;
    h = `<p class="pbar-l">Закреплено ${done} из ${its.length} примеров урока</p><div class="pbar"><span style="width:${Math.round(done / its.length * 100)}%"></span></div>`;
    hint = 'Пример закреплён после трёх верных ответов подряд.';
    weak = its.map(c => [gsel(c.ru), S.clit[lk(c.id)]]);
  } else {
    h = `<table class="heat"><thead><tr><th></th>${FORMS.map(f => `<th scope="col">${F_SHORT[f]}</th>`).join('')}</tr></thead><tbody>`;
    for (const t of TENSES) {
      h += `<tr><th scope="row">${T_RU[t]}</th>`;
      for (const f of FORMS) {
        if (!L.tenses.includes(t)) { h += `<td><span class="cell locked" aria-label="откроется в уроке ${firstLesson(t)}">урок ${firstLesson(t)}</span></td>`; continue; }
        const sel = !!S.focus && S.focus.startsWith(`${t}.${f}`);
        h += `<td>${heatCell(mastery(t, f), sel ? ' sel' : '', `${T_RU[t]}, ${F_RU[f]}`).replace('<button ', `<button data-focus="${t}.${f}" aria-pressed="${sel}" `)}</td>`;
      }
      h += '</tr>';
    }
    h += '</tbody></table>';
    const pre = S.lesson + '.';
    weak = Object.entries(S.cells).filter(([k]) => k.startsWith(pre)).map(([k, r]) => { const [, t, f, g] = k.split('.'); return [`${T_RU[t]} · ${F_RU[f]} · ${GROUP_RU[g]}`, r, `${t}.${f}.${g}`]; });
  }
  $('#heatTitle').textContent = title;
  $('#heat').innerHTML = h;
  $('#heatHint').textContent = hint;
  // Слабые места — только то, что сейчас не закреплено (box < 2) и где уже были ошибки.
  const rows = weak.filter(([, r]) => r && r.wrong > 0 && r.box < 2).sort((a, b) => a[1].box - b[1].box || b[1].wrong - a[1].wrong).slice(0, 4);
  const errs = n => `${n} ${n % 10 === 1 && n % 100 !== 11 ? 'ошибка' : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? 'ошибки' : 'ошибок'}`;
  $('#weak').innerHTML = rows.length
    ? rows.map(([label, r, focus]) => focus
      ? `<li><button type="button" data-setfocus="${focus}"><span>${esc(label)}</span><span class="cnt">${errs(r.wrong)}</span></button></li>`
      : `<li class="wrow"><span lang="${srLang()}">${whyHTML(label)}</span><span class="cnt">${errs(r.wrong)}</span></li>`).join('')
    : '<li class="empty">Сейчас слабых мест нет. То, где вы ошибаетесь, появится здесь и будет выпадать чаще.</li>';
  $('#program').innerHTML = PROGRAM.map((x, i) => `<li${i < 3 ? ' class="here"' : ''}>${mixHTML(x)}${i < 3 ? ' <span class="chip to">в приложении</span>' : ''}</li>`).join('');

  document.querySelectorAll('[data-gender]').forEach(b => b.setAttribute('aria-pressed', b.dataset.gender === S.gender));
  document.querySelectorAll('[data-script]').forEach(b => b.setAttribute('aria-pressed', b.dataset.script === S.script));
  $('#resetrow').innerHTML = confirmReset
    ? '<span class="confirm">Удалить весь прогресс? <button type="button" class="btn" id="reset-yes">Да, сбросить</button><button type="button" class="link" id="reset-no">Отмена</button></span>'
    : '<button type="button" class="link" id="reset">Сбросить прогресс</button>';
  $('#sheet').innerHTML = sheetHTML();
  $('#sync').textContent = syncMode === 'cloud' ? 'Прогресс сохраняется в вашем аккаунте и доступен на других устройствах.' : 'Прогресс хранится в этом браузере. На iPhone он надёжнее, если добавить сайт на экран «Домой».';
}

// Программа курса: уроки 1–3 — в приложении, остальные — план.
const PROGRAM = [
  'Алфавит, настоящее время, род существительных, «чей» ([moj, tvoj, njegov…])', '[Biti] и прошедшее время, энклитики, множественное число и род', '[Hteti] и [hoću da…], будущее время, [imati]',
  '[Moći, morati, treba da]; вопросительные слова', 'Прилагательные, [ovaj / taj / onaj], [svoj], звательный падеж',
  'Винительный и местный падежи, [ga / je / ih] и их место: [Video sam ga]', 'Родительный падеж ([kod] = «у»)', 'Числа, время, даты, цены',
  'Дательный падеж, [sviđa mi se], порядок энклитик', 'Возвратные глаголы, творительный падеж', 'Вид глагола',
  'Повелительное наклонение, этикет', 'Условное наклонение', 'Придаточные с [da]', '[Koji], сравнительная степень', 'Повторение, иекавский вариант',
];
function sheetHTML() {
  if (S.lesson === 1) {
    const rows = [['ja','čitam','radim','pišem'],['ti','čitaš','radiš','pišeš'],['on, ona, ono','čita','radi','piše'],['mi','čitamo','radimo','pišemo'],['vi','čitate','radite','pišete'],['oni, one','čitaju','rade','pišu']];
    return `<p>Отбросьте <b>${sr('-m')}</b> у формы «${sr('ja')}» — получится основа. Форма «${sr('oni')}» запоминается отдельно.</p>
      <table class="conj"><thead><tr><th></th><th>${sr('-am')}</th><th>${sr('-im')}</th><th>${sr('-em')}</th></tr></thead><tbody>${rows.map(r => `<tr><th>${sr(r[0])}</th>${r.slice(1).map(x => `<td>${sr(x)}</td>`).join('')}</tr>`).join('')}</tbody></table>
      <p>Вопрос: ${sr('da li')} + глагол. Отрицание: ${sr('ne')} + глагол, раздельно.</p>
      <p><b>Род</b> — по окончанию: на согласный обычно мужской (${sr('grad, pas, stan')}), на ${sr('-a')} — женский (${sr('kuća, knjiga')}), на ${sr('-o / -e')} — средний (${sr('selo, pismo, dete')}). Исключения: ${sr('noć, stvar, reč')} — женский; ${sr('auto, radio')} — мужской.</p>
      <p><b>Род не как в русском</b>: ${sr('kuća')} (дом) — ж., ${sr('pas')} (собака) и ${sr('stan')} (квартира) — м., ${sr('dete')} (ребёнок) — ср., ${sr('reč')} (слово) — ж.</p>
      <p><b>Чей</b>: ${sr('moj, tvoj, njegov, njen, naš, vaš, njihov')} меняются по роду слова: ${sr('moj stan, moja kuća, moje dete')}. И «его, её, их» тоже: ${sr('njegova kuća')} — его дом.</p>
      <p><b>Ложные друзья</b>: ${sr('život')} — жизнь, ${sr('divan')} — чудесный, ${sr('stan')} — квартира, ${sr('pitati')} — спрашивать, ${sr('slovo')} — буква (а «слово» — ${sr('reč')}).</p>
      <p class="muted">Глаголы: ${VERBS.filter(v => v.l === 1).map(v => sr(v.inf)).join(', ')}. Вопросы: ${sr('šta')} — что, ${sr('gde')} — где. Готовые фразы: ${sr('zovem se…')} — меня зовут…, ${sr('izvinite')} — извините, ${sr('koliko košta?')} — сколько стоит?, ${sr('kod kuće')} — дома, ${sr('u Beogradu')} — в Белграде, ${sr('kući')} — домой, ${sr('knjigu')} — книгу. Числа: ${sr('jedan, dva, tri, četiri, pet, šest, sedam, osam, devet, deset')}.</p>`;
  }
  if (S.lesson === 2) return `<p><b>${sr('biti')}</b> в настоящем: ${sr('sam, si, je, smo, ste, su')} — энклитики: ${sr('Kod kuće sam')} или ${sr('Ja sam kod kuće')}, но не «${sr('Sam kod kuće')}». Отрицание слитно: ${sr('nisam, nisi, nije, nismo, niste, nisu')}.</p>
      <p><b>Прошедшее</b> = ${sr('biti')} + форма на ${sr('-o / -la / -lo / -li / -le')}: ${sr('Radio sam.')} · ${sr('Da li si radio?')} · ${sr('Nisam radio.')}</p>
      <p>Род в прошедшем: ${sr('on je radio, ona je radila, ono je radilo')}. Во множественном: ${sr('-li')} — мужчины или смешанная группа, ${sr('-le')} — только женщины: ${sr('one su radile')}. ${sr('Dete')} — среднего рода: ${sr('dete je radilo')}.</p>
      <p><b>Энклитики</b> ${sr('sam, si, je, smo, ste, su')} никогда не начинают фразу и встают после первого слова или первого сочетания: ${sr('Juče sam radio')}, ${sr('Da li si radio?')}, ${sr('Kod kuće sam radio')}.</p>
      <p><b>Множественное число</b>: м. р. — ${sr('-i')} (${sr('prijatelji')}; короткие слова — ${sr('-ovi')}: ${sr('gradovi, stanovi')}), ж. р. — ${sr('-e')} (${sr('knjige, kuće')}), ср. р. — ${sr('-a')} (${sr('pisma, sela')}). Запомнить: ${sr('pas → psi, čovek → ljudi, dete → deca')}.</p>
      <p>«Чей» во множественном: ${sr('moji prijatelji')} (м.), ${sr('moje knjige')} (ж.).</p>
      <p><b>Ложные друзья</b>: ${sr('ponos')} — гордость, ${sr('hitno')} — срочно, ${sr('zapravo')} — на самом деле, ${sr('odmor')} — отдых и отпуск.</p>
      <p class="muted">Новые слова: ${sr('juče')} — вчера, ${sr('bio / bila / bilo')} — был / была / было.</p>`;
  return `<p><b>${sr('hteti')}</b>: ${sr('hoću, hoćeš, hoće, hoćemo, hoćete, hoće')} → ${sr('neću')} — «не хочу». Что хочу сделать — ${sr('da')} + настоящее время: ${sr('Hoću da radim')}, ${sr('Neću da idem')}. Так чаще, чем с инфинитивом (${sr('hoću raditi')}).</p>
      <p><b>Будущее</b> — из краткой формы ${sr('hteti')}: ${sr('ću, ćeš, će, ćemo, ćete, će')} + инфинитив. ${sr('Radiću')} — одним словом, если глагол первый; после другого слова — ${sr('Ja ću raditi')}; на ${sr('-ći')} всегда раздельно: ${sr('ići ću')}. Отрицание — ${sr('neću raditi')}: ${sr('neću')} значит и «не хочу», и «не буду».</p>
      <p><b>${sr('imati')}</b> → ${sr('nemam, nemaš, nema…')} ${sr('Imam psa')} — у меня есть собака.</p>
      <p>Средний род во множественном: ${sr('pisma, sela')} → ${sr('ona')}: ${sr('naša pisma')}. ${sr('Deca')} (дети) — собирательное: ${sr('moja deca, deca su bila')}.</p>
      <p><b>Ложные друзья</b>: ${sr('kosa')} — волосы, ${sr('grad')} — город (не «град»), ${sr('sto')} — и «стол», и «сто», ${sr('večera')} — ужин.</p>
      <p class="muted">Новые слова: ${sr('sutra')} — завтра. Готовые фразы: ${sr('psa')} — собаку, ${sr('vremena')} — времени, ${sr('kafu')} — кофе, ${sr('pivo')} — пиво.</p>`;
}

// ---------- события ----------
if (!('popover' in HTMLElement.prototype)) {
  const m = $('#settings'); m.hidden = true;
  $('.gear').addEventListener('click', () => { m.hidden = !m.hidden; });
  m.querySelector('.x').addEventListener('click', () => { m.hidden = true; });
}
let menuClosedAt = 0;
$('#settings').addEventListener('beforetoggle', e => { if (e.newState === 'closed') menuClosedAt = Date.now(); });
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  if (tooSoon(menuClosedAt) && !b.closest('#settings, .gear')) return;
  const d = b.dataset;
  if ((d.focus || d.setfocus) && b.closest('.side')) {   // матрица под карточкой: на телефоне показываем, что упражнение сменилось
    if (d.setfocus) applyFocus(d.setfocus); else toggleFocus(d.focus);
    const top = $('#card').getBoundingClientRect().top;
    if (top < 0 || top > innerHeight * 0.6) $('#card').scrollIntoView({behavior: reduced() ? 'auto' : 'smooth', block: 'start'});
    return;
  }
  if (d.target !== undefined) return setTarget(+d.target);
  if (d.lesson) return setLesson(+d.lesson);
  if (d.mode) return setMode(d.mode);
  if (d.row !== undefined) return unfillRow(+d.row);
  if (d.id !== undefined) return place(+d.id);
  if (d.un !== undefined) return unplace(+d.un);
  if (d.slot !== undefined) return chooseSlot(+d.slot);
  if (d.focus) return toggleFocus(d.focus);
  if (d.gen) return chooseGen(...d.gen.split('.'));
  if (d.gender) return setGender(d.gender);
  if (d.script) return setScript(d.script);
  switch (b.id) {
    case 'check': return check();
    case 'clear': return clearPlaced();
    case 'next': return next();
    case 'override': return override();
    case 'unfocus': return toggleFocus(null);
    case 'gofocus': { const k = pendingFocus; pendingFocus = null; S.mode = 'build'; S.focus = k; persist(true); showEx(); return renderAll(); }
    case 'nofocus': pendingFocus = null; return renderModes();
    case 'intro-ok': S.introSeen = true; persist(true); return renderCard();
    case 'rule': { const det = $('#sheet').closest('details'); det.open = true; return det.scrollIntoView({behavior: reduced() ? 'auto' : 'smooth', block: 'start'}); }
    case 'reset': confirmReset = true; return renderSide();
    case 'reset-no': confirmReset = false; return renderSide();
    case 'reset-yes': {
      // resetAt отсекает старые записи и на других устройствах — иначе слияние вернуло бы их обратно.
      S = Object.assign(DEFAULT(), settingsOf(S), {owner: S.owner, resetAt: Math.max(Date.now(), S.resetAt + 1)});   // и при отстающих часах
      confirmReset = false; for (const k of Object.keys(exCache)) delete exCache[k]; persist(); showEx(); return renderAll();
    }
  }
});

// ---------- сохранение: браузер сразу, аккаунт и другие вкладки — слиянием ----------
const settingsOf = s => ({lesson:s.lesson, mode:s.mode, gender:s.gender, script:s.script, focus:s.focus, introSeen:s.introSeen, settingsAt:s.settingsAt});
const visible = s => [s.lesson, s.mode, s.gender, s.script, s.focus].join('|');
// Сравнение по содержимому, а не по часам: у разных устройств часы расходятся. Порядок ключей не важен.
const statsKey = s => JSON.stringify([s.cells, s.verbs, s.clit, s.gen, s.poss].map(o => Object.keys(o).sort().map(k => [k, o[k].box, o[k].seen, o[k].wrong, o[k].rs]))) + s.resetAt;
const sameState = (a, b) => statsKey(a) === statsKey(b) && visible(a) === visible(b) && a.settingsAt === b.settingsAt;
let persistAsked = false;
function persist(settings) {
  if (!persistAsked && navigator.storage && navigator.storage.persist) { persistAsked = true; navigator.storage.persist().catch(() => {}); }
  const now = Date.now();
  S.updatedAt = now;
  if (settings) S.settingsAt = now;
  saveLocal(); dirty = true; scheduleRemote(3000);
}
// Слияние двух копий прогресса. По каждой клетке берём запись, где больше ответов; настройки — более свежие.
// Сброс — это «эпоха» resetAt: запись, созданная в старой эпохе (rs меньше), отбрасывается, какие бы ни были часы.
// ponytail: ответы, данные параллельно в одну и ту же клетку на двух устройствах, сольются в одну запись
// (выиграет та, где их больше) — нужен CRDT со счётчиками по устройствам, если это станет заметно.
function mergeState(a, b) {
  const resetAt = Math.max(a.resetAt, b.resetAt);
  // Сначала отбрасываем записи до сброса, потом выбираем. Выбор однозначный (больше ответов, потом позже, потом
  // больше закреплено, потом больше ошибок) — два устройства приходят к одной записи и не переписывают друг друга.
  const better = (x, y) => y.seen !== x.seen ? y.seen > x.seen : y.at !== x.at ? y.at > x.at : y.box !== x.box ? y.box > x.box : y.wrong > x.wrong;
  const bucket = (x, y) => {
    const out = {};
    for (const k of new Set([...Object.keys(x), ...Object.keys(y)])) {
      const rs = [x[k], y[k]].filter(r => r && r.rs >= resetAt);
      if (rs.length) out[k] = rs.length === 2 && better(rs[0], rs[1]) ? rs[1] : rs[0];
    }
    return out;
  };
  return Object.assign({}, a, settingsOf(b.settingsAt > a.settingsAt ? b : a), {
    cells: bucket(a.cells, b.cells), verbs: bucket(a.verbs, b.verbs), clit: bucket(a.clit, b.clit), gen: bucket(a.gen, b.gen), poss: bucket(a.poss, b.poss), resetAt,
    updatedAt: Math.max(a.updatedAt, b.updatedAt),
  });
}
// Принять слитое состояние. Если сменились урок, режим, род или фокус — текущее упражнение больше не годится.
function adopt(next) {
  const was = S;
  S = next;
  if ([was.lesson, was.mode, was.gender, was.focus].join('|') !== [S.lesson, S.mode, S.gender, S.focus].join('|')) { showEx(); renderAll(); }
  else if (was.script !== S.script) renderAll();
  else { renderModes(); renderSide(); }   // подсказка «слабее всего» зависит от ответов
}

function scheduleRemote(ms) { if (!remoteRef) return; clearTimeout(saveTimer); saveTimer = setTimeout(() => { saveTimer = 0; flushNow(); }, ms); }
const FATAL = ['invalid_argument', 'revoked', 'not_granted', 'capability_disabled', 'capability_removed', 'quota_exceeded', 'transform_error'];
let unsubscribe = null;
function goLocal() { remoteRef = null; syncMode = 'local'; if (unsubscribe) { unsubscribe(); unsubscribe = null; } renderSide(); }
// С другого устройства или вкладки на лету берём ответы, род и письмо; урок, раздел и фильтр остаются свои —
// иначе начатое здесь упражнение выбрасывалось бы из-за чужого переключения.
const keepLocal = (m, local) => Object.assign(m, {lesson: local.lesson, mode: local.mode, focus: local.focus});
// Одна запись за раз: прочитать документ, влить чужие ответы, записать — только если есть что добавить.
async function flushNow() {
  if (!remoteRef || !dirty || writing) return;
  const ref = remoteRef;
  writing = true; dirty = false;
  try {
    const snap = await ref.get();
    const raw = snap.exists ? snap.data() : null;
    if (raw && raw.v !== 1) return goLocal();   // документ более новой версии приложения — не перезаписываем
    const r = raw ? normalize(raw) : null;
    if (r) { adopt(mergeState(S, r)); saveLocal(); }
    if (r && sameState(S, r)) return;
    await ref.set(JSON.parse(JSON.stringify(S)));
    retry = 0;
  } catch (err) {
    dirty = true;
    if (err && FATAL.includes(err.code)) goLocal();
    else { retry = Math.min(retry + 1, 5); scheduleRemote(2000 * 2 ** retry); }   // неизвестный код = временный сбой
  } finally {
    writing = false;
    if (dirty && remoteRef && !saveTimer) scheduleRemote(3000);
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && dirty) { clearTimeout(saveTimer); saveTimer = 0; flushNow(); }
});
// Другая вкладка этого браузера сохранила прогресс — вливаем его, чтобы вкладки не затирали друг друга.
window.addEventListener('storage', e => {
  if (e.key !== LS_KEY || !e.newValue) return;
  let other; try { other = normalize(JSON.parse(e.newValue)); } catch (err) { return; }
  const merged = keepLocal(mergeState(S, other), S);
  if (sameState(merged, S)) return;
  adopt(merged);
  if (!sameState(S, other)) saveLocal();   // у нас было то, чего нет у соседки, — пусть она тоже узнает
});

function subscribe(ref) {
  unsubscribe = ref.onSnapshot(s => {   // ответы и настройки с другого устройства, пока страница открыта
    if (!s.exists || s.metadata.hasPendingWrites) return;
    const raw = s.data();
    if (!raw || raw.v !== 1) return;
    const r = normalize(raw), merged = keepLocal(mergeState(S, r), S);
    if (!sameState(merged, S)) { adopt(merged); saveLocal(); }
    if (!sameState(S, r)) { dirty = true; scheduleRemote(3000); }   // в облаке нет наших ответов — дописать
  }, err => {
    if (err && err.code === 'unavailable') setTimeout(() => { if (remoteRef === ref) subscribe(ref); }, 5000);
    else goLocal();
  });
}

async function initRemote(attempt = 0) {
  if (!window.claude || typeof window.claude.use !== 'function') return;
  try {
    const [user, db] = await Promise.all([window.claude.use('user'), window.claude.use('db')]);
    if (!user || !db) return;
    const uid = await user.id();
    if (!uid) return;
    const ref = db.doc('data/users/' + uid + '/progress');
    const snap = await ref.get();
    const raw = snap.exists ? snap.data() : null;
    if (raw && raw.v !== 1) return;   // документ более новой версии приложения — работаем локально, его не трогаем
    const switched = !!S.owner && S.owner !== uid;
    let next = switched ? DEFAULT() : S;   // в этом браузере лежит прогресс другого аккаунта
    next = Object.assign({}, next, {owner: uid});
    if (raw) next = mergeState(next, normalize(raw));   // слияние, а не замена: касания до загрузки облака ничего не стирают
    adopt(next);
    if (switched) { for (const k of Object.keys(exCache)) delete exCache[k]; showEx(); renderAll(); }   // экран прежнего аккаунта не должен остаться на месте
    saveLocal();
    remoteRef = ref; syncMode = 'cloud'; renderSide();
    dirty = !raw || !sameState(S, normalize(raw));
    if (dirty) scheduleRemote(0);
    subscribe(ref);
  } catch (err) {
    if (err && FATAL.includes(err.code)) return goLocal();
    if (attempt < 5) setTimeout(() => initRemote(attempt + 1), 2000 * 2 ** attempt);   // временный сбой при запуске — повторить
  }
}

if (location.hash === '#selftest') { const r = selfTest(); console.log('selfTest:', r.cells, 'клеток,', r.errors.length, 'ошибок'); r.errors.forEach(x => console.warn(x)); }
showEx(); renderAll(); initRemote();
})();
</script>
</html>
