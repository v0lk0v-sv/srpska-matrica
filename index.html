<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Тренажёр сербского глагола: спряжение, сборка фраз из плиток, трансформации и энклитики.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%232A45A8%22/%3E%3Ctext x=%2216%22 y=%2223%22 font-family=%22Georgia,serif%22 font-size=%2220%22 font-weight=%22700%22 fill=%22white%22 text-anchor=%22middle%22%3E%D0%A1%3C/text%3E%3C/svg%3E">
<title>Srpska matrica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@500;600&family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap">
<style>
:root{
  --paper:#F1F3F6; --panel:#FFFFFF; --ink:#172131; --muted:#5E6A7D; --line:#D6DDE6; --grid:#E6EAF0;
  --accent:#2A45A8; --accent-ink:#FFFFFF; --accent-soft:#E3E8F8;
  --ok:#23703F; --ok-soft:#E1F1E6; --bad:#B8342A; --bad-soft:#FBE6E3;
  --tile:#FFFFFF; --tile-edge:#B8C2D0; --shadow:rgba(23,33,49,.16);
  --serif:"Source Serif 4","PT Serif",Georgia,serif;
  --sans:"Source Sans 3","PT Sans",system-ui,sans-serif;
  --mono:"Source Code Pro",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F141C; --panel:#161D28; --ink:#E5E9F0; --muted:#97A3B6; --line:#2B3546; --grid:#1F2735;
    --accent:#8FA5FF; --accent-ink:#0F141C; --accent-soft:#1E2848;
    --ok:#66C48F; --ok-soft:#14301F; --bad:#F2806F; --bad-soft:#3A1D1A;
    --tile:#1C2431; --tile-edge:#3B475B; --shadow:rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F141C; --panel:#161D28; --ink:#E5E9F0; --muted:#97A3B6; --line:#2B3546; --grid:#1F2735;
  --accent:#8FA5FF; --accent-ink:#0F141C; --accent-soft:#1E2848;
  --ok:#66C48F; --ok-soft:#14301F; --bad:#F2806F; --bad-soft:#3A1D1A;
  --tile:#1C2431; --tile-edge:#3B475B; --shadow:rgba(0,0,0,.5);
  color-scheme:dark;
}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1180px;margin:0 auto;padding-inline:24px;padding-block:20px 48px}

/* Шапка: название, уроки, шестерёнка. На телефоне уроки уходят второй строкой. */
.top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"brand lessons gear";align-items:center;gap:14px 20px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.brand{grid-area:brand}
.brand .name{display:block;font:700 30px/1.05 var(--serif);letter-spacing:-.01em}
.brand .alt{display:block;margin-top:6px;font:500 13px/1.3 var(--mono);color:var(--muted)}
.lessons{grid-area:lessons;justify-self:end;display:flex;gap:8px}
.lessons button{display:grid;gap:2px;text-align:left;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer}
.lessons button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.lessons .ln{font:600 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.lessons .lt{font-weight:600;line-height:1.2}
.gear{grid-area:gear;display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--muted);cursor:pointer}
.gear svg{width:22px;height:22px}

/* Меню настроек — нативный popover: закрывается касанием вне меню. */
.menu{box-sizing:border-box;position:fixed;inset:auto;top:calc(env(safe-area-inset-top, 0px) + 76px);right:max(16px, calc((100vw - 1180px) / 2 + 24px));margin:0;width:min(340px, calc(100vw - 32px));padding:16px 18px 18px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);box-shadow:0 14px 36px var(--shadow)}
.menu::backdrop{background:transparent}
.menu-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.menu-head h2{margin:0;font:600 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.x{width:44px;height:44px;border:0;border-radius:8px;background:none;color:var(--muted);font-size:22px;line-height:1;cursor:pointer}
.menu .row + .row{margin-top:14px}
.menu .sync{margin:16px 0 0;font-size:13px;color:var(--muted)}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;margin-top:22px;align-items:start}

.modes{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.modes::-webkit-scrollbar{display:none}
.modes button{flex:none;white-space:nowrap;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer}
.modes button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.focusbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-bottom:12px;font-size:14px;color:var(--muted)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:26px 30px 28px;display:flex;flex-direction:column;gap:20px;min-height:400px}
.lead{margin:0;color:var(--muted);font-size:15px}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 12px/1 var(--mono);letter-spacing:.02em;padding:6px 8px;border-radius:6px;background:var(--grid);color:var(--muted)}
.chip.to{background:var(--accent-soft);color:var(--accent)}
.prompt{margin:0;font:600 clamp(23px, 5.6vw, 30px)/1.25 var(--serif);text-wrap:balance}
.trn{font:500 clamp(17px, 4.2vw, 20px)/1.3 var(--sans);color:var(--muted)}

.answer{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:64px;padding-block:6px 12px;border-bottom:2px solid var(--line)}
.answer.ok{border-bottom-color:var(--ok)}
.answer.bad{border-bottom-color:var(--bad)}
.placeholder{color:var(--muted);font-style:italic}
.punct{font:600 24px/1 var(--serif);color:var(--muted)}
.pool{display:flex;flex-wrap:wrap;gap:10px}
.tile{min-height:48px;font:600 clamp(18px, 4.6vw, 21px)/1 var(--serif);padding:12px 16px;background:var(--tile);border:1px solid var(--tile-edge);border-bottom-width:3px;border-radius:7px;cursor:pointer;transition:transform .08s,border-color .12s}
.tile:active:not(:disabled){transform:translateY(1px)}
.tile:disabled{cursor:default}
.tile.placed{background:var(--accent-soft);border-color:var(--accent)}
.tile.ghost{color:transparent;background:transparent;border-style:dashed;border-color:var(--line);cursor:default}
.answer.ok .tile.placed{background:var(--ok-soft);border-color:var(--ok)}
.answer.bad .tile.placed{background:var(--bad-soft);border-color:var(--bad)}

.actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.btn{min-height:46px;font-weight:600;padding:10px 18px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
.link{display:inline-flex;align-items:center;min-height:44px;background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:14px;text-align:left}

.fb{border-radius:10px;padding:14px 16px;display:grid;gap:6px}
.fb.ok{background:var(--ok-soft)}
.fb.bad{background:var(--bad-soft)}
.verdict{font:700 18px/1.2 var(--serif)}
.fb.ok .verdict{color:var(--ok)}
.fb.bad .verdict{color:var(--bad)}
.sent{font:600 19px/1.35 var(--serif)}
.fb s{color:var(--bad);text-decoration-thickness:2px}
.why{margin:0}

.paradigm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:auto repeat(3,auto);grid-auto-flow:column;gap:10px 16px}
.colh{font:600 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ccell{display:grid;gap:4px;min-width:0}
.ccell .who{font:500 12px/1.2 var(--mono);color:var(--muted)}
.ccell .tile{width:100%;text-align:left}
.cslot{display:block;width:100%;height:48px;border:1.5px dashed var(--tile-edge);border-radius:7px}
.cslot.next{border-color:var(--accent);background:var(--accent-soft)}
.ccell.ok .tile.placed{background:var(--ok-soft);border-color:var(--ok)}
.ccell.bad .tile.placed{background:var(--bad-soft);border-color:var(--bad);text-decoration:line-through;text-decoration-thickness:2px}
.cnotes{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:8px;font-size:14px}
.cnotes li{display:grid;gap:2px}
.cnotes .who{font:500 12px/1.2 var(--mono);color:var(--muted)}

.slots{display:flex;flex-wrap:wrap;align-items:center;gap:8px 4px;min-height:64px}
.w{font:600 clamp(22px, 5.4vw, 26px)/1.2 var(--serif)}
.slot{display:grid;place-items:center;width:42px;height:48px;border:1.5px dashed var(--tile-edge);border-radius:6px;background:none;cursor:pointer}
.slot::before{content:"+";font:600 16px/1 var(--mono);color:var(--muted)}
.ins{font:600 clamp(22px, 5.4vw, 26px)/1.2 var(--serif);padding:2px 8px;border-radius:6px}
.ins.ok{background:var(--ok-soft);color:var(--ok)}
.ins.bad{background:var(--bad-soft);color:var(--bad)}
.gap{width:4px}

.gpick{display:grid;gap:14px}
.grow{display:grid;gap:6px}
.gtiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.gtile{text-align:center}
.gtile.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.gtile.wrong{background:var(--bad-soft);border-color:var(--bad);text-decoration:line-through;text-decoration-thickness:2px}
.ask{display:grid;gap:10px;padding:14px 16px;border-radius:10px;background:var(--accent-soft)}
.ask p{margin:0}

.side{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.panel h2,.panel summary{margin:0 0 12px;font:600 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel summary{margin:0;cursor:pointer;padding-block:4px}
details[open] summary{margin-bottom:12px}
.hint{margin:10px 0 0;font-size:13px;color:var(--muted)}
.heat{width:100%;border-collapse:separate;border-spacing:4px;table-layout:fixed}
.heat th{font:500 11px/1.2 var(--mono);color:var(--muted);text-align:center}
.heat th[scope="row"]{text-align:right;padding-right:4px;width:84px}
.cell{display:grid;place-items:center;width:100%;aspect-ratio:1.35;border:0;border-radius:6px;background:color-mix(in srgb,var(--accent) var(--p,0%),var(--grid));font:600 13px/1 var(--mono);font-variant-numeric:tabular-nums;cursor:pointer}
.cell.dk{color:var(--accent-ink)}
.cell.sel{outline:2px solid var(--ink);outline-offset:1px}
.cell.locked{background:repeating-linear-gradient(45deg,var(--grid) 0 4px,transparent 4px 8px);color:var(--muted);font:500 10px/1 var(--mono);cursor:default}
.weak{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.weak button{width:100%;min-height:40px;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:none;border:0;border-radius:6px;padding:6px 8px;cursor:pointer;font-size:14px}
.weak .cnt{font:600 13px var(--mono);color:var(--bad)}
.weak .empty{font-size:14px;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{min-height:40px;border:0;background:none;padding:6px 12px;font-size:14px;color:var(--muted);cursor:pointer}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.sheet{font-size:14px}
.sheet p{margin:0 0 8px}
.sheet .muted{color:var(--muted)}
.conj{border-collapse:collapse;margin:4px 0 10px;font:500 14px var(--serif)}
.conj th,.conj td{padding:3px 10px 3px 0;text-align:left}
.conj thead th{font:500 11px var(--mono);color:var(--muted)}
.conj tbody th{font:500 12px var(--mono);color:var(--muted)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}

/* Наведение — только там, где есть мышь: на телефоне подсветка «залипает» после касания. */
@media (hover: hover){
  .lessons button:hover,.gear:hover,.btn:hover:not(:disabled){border-color:var(--accent)}
  .modes button:hover{color:var(--ink)}
  .tile:hover:not(:disabled){transform:translateY(-1px);border-color:var(--accent)}
  .slot:hover{border-color:var(--accent);background:var(--accent-soft)}
  .weak button:hover{background:var(--grid)}
}

@media (max-width:920px){.layout{grid-template-columns:minmax(0,1fr)}}
@media (max-width:700px){
  .top{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand gear" "lessons lessons"}
  .lessons{justify-self:stretch;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
  .lessons button{padding:8px 10px}
  .lessons .lt{font-size:13px}
  .menu{top:calc(env(safe-area-inset-top, 0px) + 64px)}
}
@media (max-width:560px){
  .app{padding-inline:16px;padding-block:14px 32px}
  .brand .name{font-size:24px}
  .brand .alt{font-size:12px}
  .brand .alt .sub{display:none}
  .lessons button{padding:6px 8px}
  .lessons .ln{font-size:10px}
  .layout{margin-top:14px;gap:18px}
  .card{padding:18px 16px 20px;gap:16px;min-height:0}
  /* Вкладки сеткой 2×2: полоса с прокруткой прятала «Энклитики» за краем экрана. */
  .modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;border-bottom:0;overflow:visible}
  .modes button{margin:0;padding:10px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);text-align:center;white-space:normal}
  .modes button[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .modes button:last-child:nth-child(odd){grid-column:1 / -1}
  .actions .btn{flex:1 1 auto}
  .paradigm{gap:8px 10px}
  .tile{padding:10px 12px;min-height:44px}
  .cslot{height:44px}
  .heat th[scope="row"]{width:72px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="app" id="app" lang="ru">
  <header class="top">
    <div class="brand">
      <span class="name" lang="sr-Latn">Srpska matrica</span>
      <span class="alt"><span lang="sr-Cyrl">Српска матрица</span><span class="sub"> · тренажёр сербского глагола</span></span>
    </div>
    <nav class="lessons" id="lessons" aria-label="Урок"></nav>
    <button type="button" class="gear" popovertarget="settings" aria-label="Настройки" title="Настройки">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <div id="settings" class="menu" popover>
    <div class="menu-head"><h2>Настройки</h2><button type="button" class="x" popovertarget="settings" popovertargetaction="hide" aria-label="Закрыть">×</button></div>
    <div class="row"><span>Род для «я»</span><span class="seg"><button type="button" data-gender="m">мужской</button><button type="button" data-gender="f">женский</button></span></div>
    <div class="row"><span>Письмо</span><span class="seg"><button type="button" data-script="lat">latinica</button><button type="button" data-script="cyr">ћирилица</button></span></div>
    <div class="row" id="resetrow"><button type="button" class="link" id="reset">Сбросить прогресс</button></div>
    <p class="sync" id="sync"></p>
  </div>

  <main class="layout">
    <section>
      <div class="modes" id="modes" role="tablist" aria-label="Упражнение"></div>
      <div id="focusbar"></div>
      <article class="card" id="card"></article>
      <p class="sr" id="live" aria-live="polite"></p>
    </section>
    <aside class="side">
      <section class="panel">
        <h2>Матрица</h2>
        <div id="heat"></div>
        <p class="hint">Процент — насколько клетка закреплена. Нажмите на клетку, чтобы тренировать только её.</p>
      </section>
      <section class="panel">
        <h2>Слабые места</h2>
        <ol class="weak" id="weak"></ol>
      </section>
      <details class="panel" open>
        <summary>Шпаргалка урока</summary>
        <div class="sheet" id="sheet"></div>
      </details>
    </aside>
  </main>
</div>

<script id="engine">
/* ENGINE:BEGIN — чистые данные и логика, без DOM */
// 7 dete и 8 žene — подлежащие-существительные для фраз; 9 ono и 10 one — строки таблиц спряжения.
const P = ['ja','ti','on','ona','mi','vi','oni','dete','žene','ono','one'];
const CONJ = [0,1,2,2,3,4,5,2,5,2,5];       // лицо → индекс в таблице спряжения (3-е лицо совпадает)
const GROUP = ['ja','ti','on','on','mi','vi','oni','on','oni','on','oni'];
const GROUPS = ['ja','ti','on','mi','vi','oni'];
const AUX = ['sam','si','je','je','smo','ste','su','je','su','je','su'];
const NAUX = ['nisam','nisi','nije','nije','nismo','niste','nisu','nije','nisu','nije','nisu'];
const FUT = ['ću','ćeš','će','će','ćemo','ćete','će','će','će','će','će'];
const NFUT = ['neću','nećeš','neće','neće','nećemo','nećete','neće','neće','neće','neće','neće'];
const CLITICS = new Set([...AUX, ...FUT]);
const THIRD = new Set([2,3,6,7,8,9,10]);
const NOUN = new Set([7,8]);   // «dete», «žene» — без подлежащего фраза уже о другом, опускать нельзя
const RU_P = ['я','ты','он','она','мы','вы','они','ребёнок','женщины','оно','они'];
const RU_BUD = ['буду','будешь','будет','будет','будем','будете','будут','будет','будут','будет','будут'];
const RU_GEN = ['меня','тебя','него','неё','нас','вас','них','ребёнка','женщин','него','них'];
const RU_NET = ['меня','тебя','его','её','нас','вас','их','ребёнка','женщин','его','их'];   // «Меня нет дома»
// Род и число причастия g: 0 м, 1 ж, 2 ср (ед. ч.), 3 м или смешанная группа, 4 ж (мн. ч.).
// Русское прошедшее различает только м / ж / мн.; средний род во фразах — только у «dete», а «ребёнок» мужского.
const RU_PAST = [0, 1, 0, 2, 2];
const TENSES = ['past','pres','fut'];
const FORMS = ['aff','q','neg'];

// Задание «чей + слово»: русская фраза, ответ из двух плиток и лишние плитки с объяснениями.
// Главные ловушки (род по-русски, неизменяемое «его / её / их») есть всегда; остальное — случайно, до четырёх плиток.
// В уроке 1 множественного ещё нет, поэтому и среди лишних плиток его нет.
function possTask(owner, noun, n, lesson = 3) {
  const O = POSS[owner], g = noun.g, i = possIdx(n, g), word = noun[n], right = O.sr[i];
  const ruNoun = noun.ru[n === 'pl' ? 1 : 0];
  const ruP = typeof O.ru === 'string' ? O.ru : O.ru[n === 'pl' ? 3 : GI[noun.ruG]];
  const canon = [right, word], req = [], opt = [];
  const add = (list, t, why) => { if (!canon.includes(t) && !req.concat(opt).some(d => d.t === t)) list.push({t, why}); };
  if (typeof O.ru !== 'string' && noun.ruG !== g) {   // согласовали по русскому роду: «моя собака» → «moja pas»
    const x = O.sr[possIdx(n, noun.ruG)];
    add(req, x, `«${x}» — так было бы по-русски: «${noun.ru[0]}» ${G_GEN[noun.ruG]} рода. А «${noun.sg}» — ${G_GEN[g]}, поэтому «${right}».`);
  }
  if (typeof O.ru === 'string') add(req, O.sr[0], `По-русски ${OWNER_RU[owner]} не меняется, а по-сербски согласуется со словом: «${right} ${word}».`);
  const mix = OWNER_MIX[owner];
  add(opt, POSS[mix].sr[i], `«${POSS[mix].sr[i]}» — это ${OWNER_RU[mix]}, а здесь ${OWNER_RU[owner]}.`);
  const other = n === 'pl' ? 'sg' : 'pl';
  if (lesson >= 2 || other === 'sg') {
    if (noun[other]) add(opt, noun[other], `«${noun[other]}» — ${other === 'pl' ? 'множественное' : 'единственное'} число, а здесь «${ruNoun}».`);
    const oi = possIdx(other, g);
    add(opt, O.sr[oi], `«${O.sr[oi]}» — форма ${other === 'pl' ? 'множественного' : 'единственного'} числа, а «${word}» — ${n === 'pl' ? 'множественного' : 'единственного'}.`);
  }
  for (const h of ['m', 'f', 'n']) if (h !== g) add(opt, O.sr[possIdx(n, h)], `«${O.sr[possIdx(n, h)]}» — ${G_GEN[h]} рода, а «${noun.sg}» — ${G_GEN[g]}.`);
  return {canon, ru: `${ruP} ${ruNoun}`, distract: req.concat(shuffle(opt).slice(0, Math.max(0, 4 - req.length)))};
}
function diagnosePoss(ex, ans) {
  const low = ans.map(x => x.toLowerCase()), can = ex.canon.map(x => x.toLowerCase());
  if (low.join(' ') === can.join(' ')) return {ok:true};
  for (const d of ex.distract) if (low.includes(d.t.toLowerCase())) return {ok:false, why:d.why};
  if (low.length === 2 && low[0] === can[1] && low[1] === can[0]) return {ok:false, why:`Притяжательное ставится перед словом: «${ex.canon.join(' ')}».`};
  const miss = ex.canon.filter(x => !low.includes(x.toLowerCase()));
  return {ok:false, why: miss.length ? `Не хватает: ${miss.map(x => '«' + x + '»').join(', ')}.` : 'Лишние слова.'};
}

  'živeti': [['živem', '«živeti» спрягается на «-im», хотя инфинитив на «-eti»: «živim».'], ['živeju', '«oni» от «živeti» — «žive».']],
  voleti: [['volem', '«voleti» спрягается на «-im»: «volim».'], ['voleju', '«oni» от «voleti» — «vole».']],
  znati: [['znu', '«oni» у глаголов на «-am» оканчивается на «-aju»: «znaju».'], ['znaje', '«oni» у глаголов на «-am» оканчивается на «-aju»: «znaju».']],
  'čitati': [['čitu', '«oni» у глаголов на «-am» оканчивается на «-aju»: «čitaju».'], ['čitaje', '«oni» у глаголов на «-am» оканчивается на «-aju»: «čitaju».']],
  pisati: [['pisam', '«pisati» спрягается на «-em», и «s» переходит в «š»: «pišem».'], ['pišaju', '«oni» от «pisati» — «pišu».']],
  'ići': [['ićem', '«ići» спрягается от основы «id-»: «idem».'], ['ideju', '«oni» от «ići» — «idu».']],
  razumeti: [['razumim', '«razumeti» спрягается на «-em»: «razumem».'], ['razumu', '«oni» от «razumeti» — «razumeju».']],
  imati: [['imem', '«imati» спрягается на «-am»: «imam».'], ['imu', '«oni» от «imati» — «imaju».']],
  hteti: [['htem', 'В настоящем времени «hteti» — «hoću, hoćeš, hoće…».'], ['hoćem', '«ja» от «hteti» — «hoću», без «-m».']],
};
// Строки ja, ti, 3-е ед., mi, vi, 3-е мн. В прошедшем род виден, поэтому 3-е лицо меняется: on / ona / ono и oni / one,
// а у mi и vi иногда женский род. Средний род мн. ч. («ona su») редок — только в разделе «Род».
function conjRows(t, userG) {
  const s3 = t === 'past' ? pick([2, 3, 9]) : 2, p3 = t === 'past' ? pick([6, 6, 10]) : 6;
  return [0, 1, s3, 4, 5, p3].map(p => ({p, g: (p === 4 || p === 5) && t === 'past' && Math.random() < .3 ? 4 : gFor(p, userG)}));
}
function conjTable(v, t, f, userG, lesson) {
  const rows = conjRows(t, userG).map(({p, g}) => {
    const fo = forms(v, {t, f, p, g});
    const form = t === 'pres' ? (f === 'neg' ? fo.NV.join(' ') : fo.V)
      : t === 'past' ? (f === 'neg' ? `${fo.NA} ${fo.L}` : `${fo.L} ${fo.A}`)
      : (f === 'neg' ? `${fo.NF} ${fo.I}` : fo.FM.join(' '));
    return {p, g, form};
  });
  const have = new Set(rows.map(r => r.form.toLowerCase())), out = [];
  // row — строка, для которой придумана ошибка; объяснение показывается, только если плитку положили туда.
  const add = (x, why, row = 0) => { const k = x.toLowerCase(); if (!have.has(k) && !out.some(d => d.t.toLowerCase() === k)) out.push({t:x, why, row}); };
  const ja = rows[0], fo = forms(v, {t, f, p:0, g:ja.g}), other = v.part[1 - ja.g], otherG = ja.g ? 'мужской' : 'женский';
  if (t === 'pres' && f === 'aff') { for (const [x, why] of PRES_ERR[v.id] || []) add(x, why, /«oni»/.test(why) ? 5 : 0); add(`ne ${fo.V}`, v.presNeg ? `Такой формы нет: отрицание пишется слитно — «${fo.NV[0]}». А здесь нужно утверждение.` : `«ne ${fo.V}» — это отрицание.`); }
  if (t === 'pres' && f === 'neg') add(`ne ${fo.V}`, `Отрицание пишется слитно: не «ne ${fo.V}», а «${fo.NV[0]}».`);
  if (t === 'past' && f === 'aff') {
    add(`${fo.A} ${fo.L}`, `«${fo.A}» — энклитика: с неё фраза не начинается. Правильно: «${fo.L} ${fo.A}».`);
    add(`${other} ${fo.A}`, `«${other}» — ${otherG} род.`);
    add(`${v.part[0]} smo`, `С «smo» нужна форма множественного числа: «${v.part[3]} smo».`, 3);
  }
  if (t === 'past') {   // ошибки рода в 3-м лице
    const s3 = rows[2], p3 = rows[5], G = ['мужского', 'женского', 'среднего'];
    const third = (L, sing) => f === 'neg' ? `${sing ? 'nije' : 'nisu'} ${L}` : `${L} ${sing ? 'je' : 'su'}`;
    const a3 = s3.g === 0 ? 1 : 0;
    add(third(v.part[a3], true), `«${v.part[a3]}» — ${a3 ? 'женский' : 'мужской'} род, а «${P[s3.p]}» — ${G[s3.g]} рода.`, 2);
    add(third(v.part[p3.g === 3 ? 4 : 3], false), p3.g === 3 ? `«${v.part[4]}» — женский род, а «oni» — мужчины или смешанная группа.` : `«${v.part[3]}» — мужской род, а «one» — женский.`, 5);
  }
  if (t === 'past' && f === 'neg') { add(`ne ${fo.A} ${fo.L}`, `Отрицание пишется слитно: «${fo.NA}», а не «ne ${fo.A}».`); add(`${fo.NA} ${other}`, `«${other}» — ${otherG} род.`); }
  if (t === 'fut' && f === 'aff') {
    if (fo.FM.length === 1) {
      add(`${v.inf} ${fo.F}`, `Когда глагол стоит первым, будущее пишется одним словом: «${fo.FM[0]}».`);
      if (!v.inf.endsWith('eti')) add(`${v.inf.slice(0, -1)} ${fo.F}`, `«${v.inf.slice(0, -1)} ${fo.F}» — так пишут по-хорватски. По-сербски — «${fo.FM[0]}».`);
    } else add(`${v.inf.slice(0, -2)}${fo.F}`, `У глаголов на «-ći» будущее пишется раздельно: «${fo.FM.join(' ')}».`);
  }
  if (t === 'fut' && f === 'neg') { add(`ne ${fo.F} ${fo.I}`, `Отрицание пишется слитно: «${fo.NF}», а не «ne ${fo.F}».`); add(`${fo.NF} ${fo.L}`, `После «${fo.NF}» нужен инфинитив: «${fo.NF} ${fo.I}».`); }
  if (lesson >= 2) { if (t === 'pres') add(`${fo.L} ${fo.A}`, `«${fo.L} ${fo.A}» — это прошедшее время.`); else add(fo.V, `«${fo.V}» — это настоящее время.`); }
  return {rows, distract: shuffle(out).slice(0, 3)};
}

// Род причастия по лицу. «ti» получает случайный род — русская фраза его показывает; «mi», «vi», «oni» — мужской
// (так переводят, когда пол группы неизвестен).
const PG = [null, null, 0, 1, 3, 3, 3, 2, 4, 2, 4];
function gFor(p, userG) { return p === 0 ? userG : p === 1 ? rnd(2) : PG[p]; }
// «У тебя была собака?» не показывает род — принимаем оба.
function ambiguousG(v, cell) { return cell.p === 1 && cell.t === 'past' && v.ruSpecial === 'imati'; }

function forms(v, cell) {
  const i = cell.p, k = CONJ[i], V = v.pres[k];
  return {
    P: P[i], V, NV: v.presNeg ? [v.presNeg[k]] : ['ne', V],
    A: AUX[i], NA: NAUX[i], F: FUT[i], NF: NFUT[i], L: v.part[cell.g], I: v.inf,
    FM: v.inf.endsWith('ći') ? [v.inf, FUT[i]] : [v.inf.slice(0, -2) + FUT[i]],   // radiću, но ići ću
  };
}

// Два порядка: без местоимения и с ним. Энклитика всегда на втором месте.
function cores(v, cell) {
  const f = forms(v, cell), p = f.P, m = cell.f;
  if (cell.t === 'pres') {
    if (m === 'aff') return {noP:[f.V], withP:[p, f.V]};
    if (m === 'q') return {noP:['da li', f.V], withP: v.presClitic ? ['da li', f.V, p] : ['da li', p, f.V]};
    return {noP:f.NV, withP:[p, ...f.NV]};
  }
  if (cell.t === 'past') {
    if (m === 'aff') return {noP:[f.L, f.A], withP:[p, f.A, f.L]};
    if (m === 'q') return {noP:['da li', f.A, f.L], withP:['da li', f.A, p, f.L]};
    return {noP:[f.NA, f.L], withP:[p, f.NA, f.L]};
  }
  if (m === 'aff') return {noP:f.FM, withP:[p, f.F, f.I]};
  if (m === 'q') return {noP:['da li', f.F, f.I], withP:['da li', f.F, p, f.I]};
  return {noP:[f.NF, f.I], withP:[p, f.NF, f.I]};
}

// Типичные верные порядки — для самопроверки (проверка ответа идёт по правилам, см. orderError).
function variantsFor(v, cell) {
  const {noP, withP} = cores(v, cell), C = cell.c && cell.c.sr, out = [];
  if (NOUN.has(cell.p)) return [C ? [...withP, C] : withP];
  const add = t => { if (!CLITICS.has(t[0])) out.push(t); };
  if (!C) { add(noP); add(withP); }
  else {
    add([...noP, C]); add([...withP, C]);
    if (cell.f !== 'q') add([C, ...withP.slice(1)]);   // Kod kuće sam bio. Srpski ne govorim.
  }
  return out;
}

// Основной вариант: «я/ты/мы/вы» без местоимения, «он/она/они» — с ним.
function canonicalFor(v, cell) {
  const {noP, withP} = cores(v, cell), C = cell.c && cell.c.sr;
  let t = THIRD.has(cell.p) ? withP : noP;
  t = C ? [...t, C] : t.slice();
  if (CLITICS.has(t[0])) t = [C, ...withP.slice(1)];   // sam kod kuće → Kod kuće sam
  return t;
}

// Наборы слов верного ответа (местоимение необязательно). Порядок внутри набора свободный — его проверяет orderError.
function basesFor(v, cell, genderFree) {
  const gs = (genderFree || ambiguousG(v, cell)) && cell.g < 2 ? [0, 1]
    : (cell.p === 4 || cell.p === 5) && cell.g >= 3 ? [3, 4]   // «мы/вы работали»: русский не показывает род группы
    : [cell.g];
  const C = cell.c && cell.c.sr, p = P[cell.p], out = [];
  for (const g of gs) {
    const {noP, withP} = cores(v, Object.assign({}, cell, {g}));
    const opts = NOUN.has(cell.p) ? [withP] : [noP, withP, withP.filter(x => x !== p)];
    for (const b of opts) out.push(C ? [...b, C] : b.slice());
  }
  const seen = new Set();
  return out.filter(b => { const k = b.map(x => x.toLowerCase()).sort().join('|'); if (seen.has(k)) return false; seen.add(k); return true; });
}

function ruFor(v, cell) {
  const i = cell.p, k = CONJ[i], t = cell.t, m = cell.f, co = cell.c;
  let s;
  if (v.ruSpecial === 'imati') {
    const u = 'у ' + RU_GEN[i], was = co.g === 'f' ? 'была' : co.g === 'n' ? 'было' : 'был';
    if (t === 'pres') s = m === 'neg' ? `${u} нет ${co.gen}` : `${u} есть ${co.ru}`;
    else if (t === 'past') s = m === 'neg' ? `${u} не было ${co.gen}` : `${u} ${was} ${co.ru}`;
    else s = m === 'neg' ? `${u} не будет ${co.gen}` : `${u} будет ${co.ru}`;
  } else if (v.id === 'biti' && t === 'pres' && m === 'neg') {
    s = `${RU_NET[i]} нет ${co.ru}`;   // не «Я не дома»
  } else {
    let verb;
    if (t === 'pres') verb = v.ru.pres ? v.ru.pres[k] : '';
    else if (t === 'past') verb = (m === 'neg' && v.ru.pastNeg ? v.ru.pastNeg : v.ru.past)[RU_PAST[cell.g]];   // «не ходил», а не «не шёл»
    else verb = v.ru.fut ? v.ru.fut[k] : RU_BUD[i] + ' ' + v.ru.inf;
    if (m === 'neg') verb = ('не ' + verb).trim();
    s = [RU_P[i], verb, co ? (m === 'neg' && co.gen ? co.gen : co.ru) : ''].filter(Boolean).join(' ');   // не хотел пива
  }
  return cap(s) + (m === 'q' ? '?' : '.');
}

// Слово, которое меняется по лицам в этой клетке.
function personToken(v, cell, j) {
  const f = forms(v, Object.assign({}, cell, {p:j})), m = cell.f;
  if (cell.t === 'pres') return m === 'neg' ? f.NV[f.NV.length - 1] : f.V;
  if (cell.t === 'past') return m === 'neg' ? f.NA : f.A;
  if (m === 'aff') return THIRD.has(cell.p) ? f.F : f.FM[f.FM.length - 1];
  return m === 'neg' ? f.NF : f.F;
}

// Лишние плитки = типичные ошибки русскоязычных. why — что объяснить, если её выбрали.
function distractorsFor(v, cell, canon, lesson, genderFree) {
  const have = new Set(canon.map(x => x.toLowerCase())), req = [], opt = [];
  const add = (list, t, why) => {
    const k = t.toLowerCase();
    if (have.has(k) || req.concat(opt).some(d => d.t.toLowerCase() === k)) return false;
    list.push({t, why}); return true;
  };
  const f = forms(v, cell), t = cell.t, m = cell.f;
  if (m === 'neg') {
    const calque = (x, right) => {
      add(req, 'ne', `Здесь отрицание пишется слитно: не «ne ${x}», а «${right}».`);
      add(req, x, `Здесь нужна отрицательная форма «${right}», а не «${x}».`);
    };
    if (t === 'past') calque(f.A, f.NA);
    else if (t === 'fut') calque(f.F, f.NF);
    else if (v.presNeg) calque(f.V, f.NV[0]);
  }
  if (t === 'fut' && m === 'aff' && !THIRD.has(cell.p) && f.FM.length === 1) { add(req, f.F, null); add(req, f.I, null); }
  const mine = personToken(v, cell, cell.p);
  let persons = 0;
  for (const j of shuffle([0,1,2,4,5,6])) {
    const x = personToken(v, cell, j);
    if (x === mine) continue;
    const who = P.slice(0, 7).filter((_, q) => personToken(v, cell, q) === x).join(' / ');
    if (add(opt, x, `«${x}» — это форма для «${who}».`) && ++persons === 2) break;
  }
  if (t === 'past' && !genderFree && !ambiguousG(v, cell)) {
    const L = v.part, g = cell.g;
    if (cell.p === 7) add(opt, L[0], `«${L[0]}» — мужской род, а «dete» — среднего, хотя «ребёнок» мужского.`);
    else if (cell.p === 8) add(opt, L[3], `«${L[3]}» — мужской род, а «žene» — женского.`);
    else if (g >= 3) add(opt, L[0], `«${L[0]}» — единственное число, а здесь множественное.`);
    else add(opt, L[1 - g], `«${L[1 - g]}» — ${g === 0 ? 'женский' : 'мужской'} род.`);
  }
  if (lesson >= 2) {
    if (t === 'pres') add(opt, v.part[cell.g], `«${v.part[cell.g]}» — это прошедшее время.`);
    else add(opt, f.V, `«${f.V}» — это настоящее время.`);
  }
  if (m === 'neg') add(opt, 'da li', '«da li» делает вопрос, а здесь отрицание.');
  else add(opt, 'ne', m === 'q' ? '«ne» добавляет отрицание, а нужен просто вопрос.' : '«ne» — это отрицание.');
  const max = canon.length >= 4 ? 3 : 4;
  return req.concat(shuffle(opt).slice(0, Math.max(0, max - req.length)));
}

// Порядок слов в сербском свободный, но с жёсткими правилами. null — порядок верный.
function orderError(low, v, cell) {
  const f = forms(v, cell), lc = x => x.toLowerCase();
  if (low.indexOf('da li') > 0) return '«da li» ставится в начало вопроса.';
  const ci = low.findIndex(x => CLITICS.has(x));
  if (ci === 0) return `«${low[0]}» — энклитика: с неё фраза не начинается, её место второе.`;
  if (ci > 1) return `Энклитика «${low[ci]}» стоит на втором месте — сразу после первого слова.`;
  if (f.FM.length === 1) {   // у глаголов на -ći будущее всегда раздельное
    if (low.indexOf(lc(f.FM[0])) > 0) return `«${f.FM[0]}» одним словом бывает только в начале фразы. После другого слова — раздельно: «${f.F} ${f.I}».`;
    if (low[0] === lc(f.I) && FUT.includes(low[1])) return `Когда глагол стоит первым, будущее пишется одним словом: «${f.FM[0]}».`;
  }
  const n = low.indexOf('ne');
  if (n !== -1 && low[n + 1] !== lc(f.V)) return '«ne» ставится прямо перед глаголом.';
  const neg = low.findIndex(x => NAUX.includes(x) || NFUT.includes(x));
  const nonfin = low.findIndex(x => x === lc(v.inf) || v.part.includes(x));
  if (neg !== -1 && nonfin !== -1 && neg > nonfin) return `«${low[neg]}» стоит перед глаголом.`;
  return null;
}

// Чем набор слов ответа отличается от набора base: чего не хватает и что лишнее.
function wordDiff(base, ans) {
  const rest = base.slice(), extra = [];
  for (const x of ans) { const i = rest.findIndex(y => y.toLowerCase() === x.toLowerCase()); if (i >= 0) rest.splice(i, 1); else extra.push(x); }
  return {missing: rest, extra, score: rest.length + extra.length};
}
const sameWords = (ex, ans) => ex.bases.some(b => wordDiff(b, ans).score === 0);
function isCorrect(ex, ans) { return sameWords(ex, ans) && !orderError(ans.map(x => x.toLowerCase()), ex.v, ex.cell); }

// Почему ответ неверен. Сообщения с «…» — сербские слова, интерфейс покажет их в выбранном письме.
function diagnose(ex, ans) {
  const low = ans.map(x => x.toLowerCase());
  if (sameWords(ex, ans)) { const e = orderError(low, ex.v, ex.cell); return e ? {ok:false, why:e} : {ok:true}; }
  const q = xs => xs.map(x => '«' + x + '»').join(', ');
  const can = wordDiff(ex.canon, ans);
  if (can.missing.length === 0) return {ok:false, why:`Лишние слова: ${q(can.extra)}.`};   // «nisam ne radio» → лишнее «ne»
  for (const d of ex.distract) if (d.why && low.includes(d.t.toLowerCase())) return {ok:false, why:d.why};
  const c = ex.bases.map(b => wordDiff(b, ans)).sort((a, b) => a.score - b.score)[0];
  if (c.missing.length && c.extra.length) return {ok:false, why:`Не хватает: ${q(c.missing)}. Лишнее: ${q(c.extra)}.`};
  if (c.missing.length) return {ok:false, why:`Не хватает: ${q(c.missing)}.`};
  return {ok:false, why:`Лишние слова: ${q(c.extra)}.`};
}

const CYR = {a:'а',b:'б',c:'ц',č:'ч',ć:'ћ',d:'д',đ:'ђ',e:'е',f:'ф',g:'г',h:'х',i:'и',j:'ј',k:'к',l:'л',m:'м',n:'н',o:'о',p:'п',r:'р',s:'с',š:'ш',t:'т',u:'у',v:'в',z:'з',ž:'ж',dž:'џ',lj:'љ',nj:'њ'};
// ponytail: dž/lj/nj всегда диграфы — в словаре приложения нет слов вроде «nadživeti».
function toCyr(s) {
  return s.replace(/dž|lj|nj|[a-zčćđšž]/giu, m => { const r = CYR[m.toLowerCase()]; return !r ? m : m[0] === m[0].toLowerCase() ? r : r.toUpperCase(); });
}

// Самопроверка движка: откройте страницу с #selftest и смотрите консоль.
function selfTest() {
  const errors = []; let n = 0;
  const validG = (p, g) => p <= 1 ? g < 2 : p === 4 || p === 5 ? g >= 3 : g === PG[p];
  for (const v of VERBS) for (const t of TENSES) for (const f of FORMS) for (let p = 0; p < 9; p++) for (const c of v.comps) for (const g of [0,1,2,3,4]) {
    if ((t === 'fut' && v.noFut) || !validG(p, g) || (NOUN.has(p) && v.id === 'hteti')) continue;
    const cell = {t, f, p, g, c}, id = `${v.id} ${t}.${f} ${P[p]} g${g} ${c ? c.sr : '-'}`;
    const ex = {v, cell, canon: canonicalFor(v, cell), bases: basesFor(v, cell, false)}, ru = ruFor(v, cell);
    n++;
    if (!isCorrect(ex, ex.canon)) errors.push(id + ': основной вариант не принят');
    for (const a of variantsFor(v, cell)) if (!isCorrect(ex, a)) errors.push(id + ': не принят верный вариант ' + a.join(' '));
    for (const d of distractorsFor(v, cell, ex.canon, 3, false)) if (ex.canon.includes(d.t)) errors.push(id + ': лишняя плитка совпадает с ответом: ' + d.t);

  // Регрессии из ревью: свободный порядок слов и честные объяснения ошибок. Слова разделены «|».
  const V = id => VERBS.find(v => v.id === id), OV = comp('ovde', 'здесь'), KU = comp('kući', 'домой'), KNJ = comp('knjigu', 'книгу');
  const mk = (id, t, f, p, g, c) => { const v = V(id), cell = {t, f, p, g, c}; return {v, cell, canon: canonicalFor(v, cell), bases: basesFor(v, cell, false), distract: []}; };
  const orders = [
    [true, 'živeti', 'pres', 'aff', 2, 0, OV, 'on|ovde|živi'],
    [true, 'živeti', 'past', 'aff', 3, 1, OV, 'ona|je|ovde|živela'],
    [true, 'živeti', 'pres', 'q', 1, 0, OV, 'da li|ovde|živiš'],
    [true, 'raditi', 'pres', 'q', 2, 0, KOD, 'da li|on|kod kuće|radi'],
    [true, 'raditi', 'fut', 'aff', 0, 0, KOD, 'ja|ću|kod kuće|raditi'],
    [true, 'raditi', 'fut', 'aff', 0, 0, KOD, 'kod kuće|ću|raditi'],
    [true, 'biti', 'past', 'aff', 0, 0, KOD, 'kod kuće|sam|bio'],
    [false, 'biti', 'pres', 'aff', 0, 0, KOD, 'sam|kod kuće'],
    [false, 'raditi', 'fut', 'aff', 0, 0, null, 'raditi|ću'],
    [false, 'raditi', 'fut', 'aff', 0, 0, KOD, 'kod kuće|radiću'],
    [false, 'raditi', 'past', 'aff', 2, 0, null, 'on|radio|je'],
    [false, 'raditi', 'fut', 'aff', 2, 0, null, 'on|radiće'],
    [false, 'raditi', 'pres', 'q', 2, 0, null, 'on|da li|radi'],
    [false, 'raditi', 'past', 'neg', 0, 0, null, 'radio|nisam'],
    [true, 'čitati', 'past', 'aff', 7, 2, KNJ, 'dete|je|čitalo|knjigu'],
    [true, 'čitati', 'past', 'aff', 7, 2, KNJ, 'knjigu|je|dete|čitalo'],
    [false, 'čitati', 'past', 'aff', 7, 2, KNJ, 'dete|je|čitao|knjigu'],
    [false, 'čitati', 'past', 'aff', 7, 2, KNJ, 'čitalo|je|knjigu'],
    [true, 'raditi', 'past', 'aff', 8, 4, KOD, 'žene|su|radile|kod kuće'],
    [false, 'raditi', 'past', 'aff', 8, 4, KOD, 'žene|su|radili|kod kuće'],
    [true, 'raditi', 'past', 'aff', 4, 3, KOD, 'radile|smo|kod kuće'],
  ];
  for (const [want, ...o] of orders) if (isCorrect(mk(...o.slice(0, 6)), o[6].split('|')) !== want) errors.push(`регрессия: «${o[6]}» должно быть ${want ? 'верно' : 'неверно'}`);
  const why = (o, s) => diagnose(mk(...o), s.split('|')).why || '';
  if (/одним словом/.test(why(['ići', 'fut', 'q', 0, 0, KU], 'ići|ću|kući'))) errors.push('регрессия: «ići ću» в вопросе объясняется слитным написанием');
  if (/«on»/.test(why(['raditi', 'pres', 'q', 2, 0, null], 'radi'))) errors.push('регрессия: необязательное «on» названо недостающим');
  if (!/Лишн/.test(why(['raditi', 'fut', 'aff', 0, 0, KOD], 'radiću|ću|raditi|kod kuće'))) errors.push('регрессия: лишние слова не названы лишними');
  if (!/Лишн.*«ne»/.test(why(['raditi', 'past', 'neg', 0, 0, null], 'nisam|ne|radio'))) errors.push('регрессия: «nisam ne radio» — лишнее «ne»');
  if (ruFor(V('biti'), {t:'pres', f:'neg', p:0, g:0, c:KOD}) !== 'Меня нет дома.') errors.push('регрессия: «Меня нет дома»');
  if (ruFor(V('čitati'), {t:'past', f:'aff', p:7, g:2, c:KNJ}) !== 'Ребёнок читал книгу.') errors.push('регрессия: «Ребёнок читал книгу»');
  if (!/Не хватает: «dete»/.test(why(['čitati', 'past', 'aff', 7, 2, KNJ], 'čitalo|je|knjigu'))) errors.push('регрессия: без «dete» фраза неполная');
  const seenW = new Set();
  for (const it of GEN) { if (!PRON[it.n] || !PRON[it.n][it.g] || seenW.has(it.w)) errors.push('«Род»: неверный пример ' + it.w); seenW.add(it.w); }
  for (const o of OWNERS) {

      for (const d of tk.distract) if (tk.canon.includes(d.t) || !d.why) errors.push(id + ': плохая лишняя плитка ' + d.t);
      if (!diagnosePoss(tk, tk.canon).ok) errors.push(id + ': основной вариант не принят');

    }
  }
  { const tk = possTask('ona', NOUNS.find(x => x.sg === 'kuća'), 'sg');
    if (tk.ru !== 'её дом' || tk.canon.join(' ') !== 'njena kuća') errors.push('регрессия: «её дом» → «njena kuća»');
    if (!/не меняется/.test(diagnosePoss(tk, ['njen', 'kuća']).why || '')) errors.push('регрессия: «njen kuća» — «её» по-русски не меняется');
    const t2 = possTask('ja', NOUNS.find(x => x.sg === 'pas'), 'sg');
    if (t2.ru !== 'моя собака' || t2.canon.join(' ') !== 'moj pas' || !/по-русски/.test(diagnosePoss(t2, ['moja', 'pas']).why || '')) errors.push('регрессия: «моя собака» → «moj pas»'); }
  for (const v of VERBS.filter(v => v.presNeg)) { const d = conjTable(v, 'pres', 'aff', 0, 3).distract.find(x => x.t.startsWith('ne ')); if (d && /это отрицание/.test(d.why)) errors.push(`регрессия: «${d.t}» названо отрицанием`); }

  // Спряжение: лишние плитки не совпадают ни с одной верной формой, и их хватает.
  for (const v of VERBS) for (const t of TENSES) for (const f of ['aff', 'neg']) {
    if ((t === 'fut' && v.noFut) || (t === 'pres' && f === 'neg' && !v.presNeg)) continue;
    for (const [g, lesson] of [[0, 1], [1, 3], [0, 3], [1, 3], [0, 3], [1, 3], [0, 3], [1, 3]]) {
      if (lesson === 1 && (t !== 'pres' || v.l > 1)) continue;
      const tb = conjTable(v, t, f, g, lesson), id = `спряжение ${v.id} ${t}.${f}`;
      const fs = tb.rows.map(r => r.form.toLowerCase());

      for (const d of tb.distract) if (fs.includes(d.t.toLowerCase())) errors.push(`${id}: лишняя плитка «${d.t}» совпадает с формой`);
      if (tb.rows.some(r => !r.form || /undefined/.test(r.form))) errors.push(id + ': пустая форма');
    }
  }
  for (const [id, list] of Object.entries(PRES_ERR)) for (const [x] of list) if (VERBS.find(v => v.id === id).pres.includes(x)) errors.push(`PRES_ERR ${id}: «${x}» — настоящая форма`);

}
/* ENGINE:END */

<script>
(() => {
const $ = s => document.querySelector(s);

const MODES = [

  {id:'build', name:'Сборка', lead:'Соберите перевод из слов. Лишние слова — типичные ошибки.'},
  {id:'transform', name:'Трансформации', lead:'Измените фразу, как сказано в подсказке.'},
  {id:'clitic', name:'Энклитики', lead:'Поставьте энклитику на её место.'},
  {id:'rod', name:'Род', lead:'Каким местоимением заменить слово? Род в сербском часто не совпадает с русским.'},
  {id:'poss', name:'Чей', lead:'Соберите «чей + слово». По-сербски и «его, её, их» меняются по роду и числу слова.'},
];
// gender: null — ещё не выбран (до выбора используется мужской род).
const DEFAULT = () => ({v:1, lesson:1, mode:'conj', gender:null, script:'lat', focus:null, cells:{}, verbs:{}, clit:{}, gen:{}, poss:{},
  updatedAt:0, settingsAt:0, resetAt:0, owner:null});
// Всё, что пришло из хранилища, проверяется: битое состояние не должно ронять страницу.
function normalize(s) {
  const d = DEFAULT();
  if (!s || s.v !== 1) return d;
  const obj = x => x && typeof x === 'object' && !Array.isArray(x) ? x : {};
  const resetAt = +s.resetAt || 0;

    const out = {};

      const at = +r.at || 0, rs = 'rs' in r ? +r.rs || 0 : (at >= resetAt ? resetAt : 0);   // записи до появления rs
      out[k] = {box: Math.max(0, Math.min(4, r.box | 0)), seen: +r.seen || 0, wrong: +r.wrong || 0, at, rs};

  const focusOk = typeof s.focus === 'string' && /^(past|pres|fut)\.(aff|q|neg)$/.test(s.focus) && LESSONS[lesson - 1].tenses.includes(s.focus.split('.')[0]);

const loadLocal = () => { try { return JSON.parse(localStorage.getItem(LS_KEY)); } catch (e) { return null; } };

const disp = t => S.script === 'cyr' ? toCyr(t) : t;
const srLang = () => S.script === 'cyr' ? 'sr-Cyrl' : 'sr-Latn';
const sr = t => `<span lang="${srLang()}">${esc(disp(t))}</span>`;
const sentence = (toks, q) => cap(toks.map(disp).join(' ')) + (q ? '?' : '.');
const whyHTML = s => s.split(/(«[^»]+»)/).map(part => part.startsWith('«') ? '«' + sr(part.slice(1, -1)) + '»' : esc(part)).join('');
const gsel = s => s.replace(/\{([^|}]*)\|([^}]*)\}/g, (_, m, f) => S.gender === 'f' ? f : m);

const recW = (rec, unseen = 4) => rec ? [6, 3, 1.5, 0.7, 0.3][rec.box || 0] : unseen;

function pickCell(ok = () => true) {

    if ((!S.focus || S.focus === t + '.' + f) && ok(t, f)) cands.push({t, f, g});
  const c = wpick(cands, x => recW(S.cells[`${x.t}.${x.f}.${x.g}`]));

}
function pickVerb(t, ok = () => true) {
  const pool = VERBS.filter(v => v.l <= S.lesson && !(t === 'fut' && v.noFut) && ok(v));
  return wpick(pool, v => recW(S.verbs[v.id]) * (v.l === S.lesson ? 2 : 1));
}
function drawCell() {
  let v, cell, key, n = 0;
  do {
    cell = pickCell(); v = pickVerb(cell.t);
    // Иногда подлежащее — существительное: «dete» (средний род, хотя «ребёнок» мужского) и «žene» (ж. р. мн. ч.).
    if (v.id !== 'hteti' && Math.random() < .3) cell.p = cell.p === 2 || cell.p === 3 ? 7 : cell.p === 6 ? 8 : cell.p;
    cell.g = gFor(cell.p, S.gender === 'f' ? 1 : 0);
    cell.c = pick(v.comps) || null;
    key = [v.id, cell.t, cell.f, cell.p, cell.c && cell.c.sr].join('|');

}

  const ts = LESSONS[S.lesson - 1].tenses.filter(t => !(t === 'fut' && v.noFut)), all = [], single = [];
  for (const t of ts) for (const f of FORMS) {
    if (t === cell.t && f === cell.f) continue;

}

  const {v, cell} = drawCell();

  const distract = distractorsFor(v, cell, canon, S.lesson, genderFree);
  const tiles = shuffle(canon.concat(distract.map(d => d.t))).map((t, id) => ({t, id}));
  return {kind, v, cell, src, canon, bases: basesFor(v, cell, genderFree), distract, tiles, placed:[], done:false};
}
function makeClit() {
  const pool = CLIT.filter(c => c.l <= S.lesson && c.id !== lastKey);
  const it = wpick(pool, c => recW(S.clit[c.id]));
  lastKey = it.id;
  return {kind:'clitic', it, words: it.w.map(gsel), ru: gsel(it.ru), chosen:null, done:false};   // род фиксируется при создании
}
// «Спряжение» тренирует только клетки, у которых есть своя таблица: без вопросов (это те же формы)
// и без отрицания настоящего у обычных глаголов («ne radim» — не отдельная форма).

function makeConj() {
  if (S.focus && !conjOK(...S.focus.split('.'))) S.focus = null;
  let c, v, f, n = 0;
  do {
    c = pickCell(conjOK); f = c.f;

  } while ([v.id, c.t, f].join('|') === lastKey && ++n < 6);
  lastKey = [v.id, c.t, f].join('|');
  const tb = conjTable(v, c.t, f, S.gender === 'f' ? 1 : 0, S.lesson);
  const tiles = shuffle(tb.rows.map(r => r.form).concat(tb.distract.map(d => d.t))).map((t, id) => ({t, id}));
  return {kind:'conj', v, t:c.t, f, rows:tb.rows, distract:tb.distract, tiles, fill: tb.rows.map(() => null), done:false};
}
function makeGen() {
  const it = wpick(GEN.filter(x => x.w !== lastKey && nounOpen(x.n, x.g, S.lesson)), x => recW(S.gen[x.w]));
  lastKey = it.w;
  return {kind:'rod', it, chosen:null, done:false};
}
function makePoss() {
  const combos = [];
  for (const o of OWNERS) for (const n of ['sg', 'pl']) for (const g of ['m', 'f', 'n'])
    if (nounOpen(n, g, S.lesson) && NOUNS.some(x => x.g === g && x[n])) combos.push({o, n, g, k: `${o}.${n}.${g}`});
  let c, noun, n = 0;

function newEx() {

function bump(bucket, key, ok) {

    const d = ex.distract.find(x => x.t === got);

  ex.rows.forEach((r, i) => bump(S.cells, `${ex.t}.${ex.f}.${GROUP[r.p]}`, ex.res[i].ok));   // каждая строка — своя клетка матрицы
  bump(S.verbs, ex.v.id, ex.ok);
  persist(); renderSide(); renderCard();
}
function checkPoss() {
  const ex = cur; if (!ex.placed.length) return;
  ex.ans = ex.placed.map(id => ex.tiles[id].t);
  Object.assign(ex, diagnosePoss(ex, ex.ans), {done:true, checkedAt: Date.now()});
  say((ex.ok ? 'Верно. ' : 'Неверно. Правильно: ') + ex.canon.map(disp).join(' '));
  bump(S.poss, ex.key, ex.ok); persist(); renderSide(); renderCard();
}
function check() {
  if (cur && cur.kind === 'conj' && !cur.done) return checkConj();
  if (cur && cur.kind === 'poss' && !cur.done) return checkPoss();
  const ex = cur; if (!ex || ex.kind === 'clitic' || ex.done || !ex.placed.length) return;
  ex.ans = ex.placed.map(id => ex.tiles[id].t);
  Object.assign(ex, diagnose(ex, ex.ans), {done:true, checkedAt: Date.now()});
  say((ex.ok ? 'Верно. ' : 'Неверно. Правильно: ') + sentence(ex.canon, ex.cell.f === 'q'));
  commit(ex, ex.ok);
  renderCard();
}
function chooseSlot(s) {
  const ex = cur; if (!ex || ex.kind !== 'clitic' || ex.done || s > ex.words.length || tooSoon(ex.createdAt)) return;
  Object.assign(ex, {chosen:s, done:true, ok: s === ex.it.at, checkedAt: Date.now()});
  say(ex.ok ? 'Верно.' : 'Неверно.');
  commit(ex, ex.ok); renderCard();
}
function chooseGen(n, g) {
  const ex = cur; if (!ex || ex.kind !== 'rod' || ex.done || tooSoon(ex.createdAt)) return;
  Object.assign(ex, {chosen:{n, g}, done:true, ok: n === ex.it.n && g === ex.it.g, checkedAt: Date.now()});
  say((ex.ok ? 'Верно: ' : 'Неверно. Правильно: ') + disp(PRON[ex.it.n][ex.it.g]));
  bump(S.gen, ex.it.w, ex.ok); persist(); renderSide(); renderCard();
}
function next() {
  if (cur && tooSoon(cur.checkedAt)) return;   // двойное касание «Проверить» не проскакивает разбор
  newEx(); renderCard();
}

function setLesson(n) {
  if (S.lesson === n) return;
  S.lesson = n;
  if (S.focus && !LESSONS[n - 1].tenses.includes(S.focus.split('.')[0])) S.focus = null;
  persist(true); newEx(); renderAll();
}
function setMode(m) { if (S.mode === m) return; S.mode = m; persist(true); newEx(); renderAll(); }
function toggleFocus(key) {
  S.focus = key && S.focus !== key ? key : null;
  if (S.focus && (['clitic', 'rod', 'poss'].includes(S.mode) || (S.mode === 'conj' && !conjOK(...S.focus.split('.'))))) S.mode = 'build';
  persist(true); newEx(); renderAll();
}
function setGender(g) { if (S.gender === g) return; S.gender = g; persist(true); newEx(); renderAll(); }
function setScript(s) { if (S.script === s) return; S.script = s; persist(true); renderAll(); }

// ---------- отрисовка ----------
function renderAll() { renderLessons(); renderModes(); renderCard(); renderSide(); }

function renderLessons() {
  $('#lessons').innerHTML = LESSONS.map(L =>
    `<button type="button" data-lesson="${L.n}" aria-pressed="${S.lesson === L.n}"><span class="ln">Урок ${L.n}</span><span class="lt">${L.sr ? sr(L.title) : esc(L.title)}</span></button>`).join('');
}
function renderModes() {
  $('#modes').innerHTML = MODES.map(m => `<button type="button" role="tab" data-mode="${m.id}" aria-selected="${S.mode === m.id}">${m.name}</button>`).join('');
  const [t, f] = (S.focus || '').split('.');
  $('#focusbar').innerHTML = S.focus && !['clitic', 'rod', 'poss'].includes(S.mode)
    ? `<div class="focusbar"><span class="chip to">Только: ${T_RU[t]} · ${F_RU[f]}</span><button type="button" class="link" id="unfocus">Вся матрица</button></div>` : '';
}

function renderCard() {
  const card = $('#card'), mode = MODES.find(m => m.id === S.mode);
  const ask = S.gender === null && S.lesson >= 2
    ? `<div class="ask"><p>В прошедшем времени сербский различает род: ${sr('radio')} — он, ${sr('radila')} — она. О себе вы говорите…</p><div class="actions"><button type="button" class="btn" data-gender="m">в мужском роде</button><button type="button" class="btn" data-gender="f">в женском роде</button></div></div>`
    : '';
  const scope = ['rod', 'poss'].includes(S.mode)
    ? [' В уроке 1 — только единственное число, множественное появится в уроке 2.', ' Средний род множественного числа (' + sr('deca, pisma') + ') — в уроке 3.', ''][S.lesson - 1] : '';
  const lead = ask + `<p class="lead">${mode.lead}${scope}</p>`;
  if (S.mode === 'clitic') {
    if (!cur) { card.innerHTML = lead + `<p class="prompt">Энклитики начинаются с урока 2.</p><p>В настоящем времени их почти нет: они появляются вместе с прошедшим (${sr('radio sam')}) и будущим (${sr('ja ću raditi')}).</p><div class="actions"><button type="button" class="btn primary" id="to-l2">Перейти к уроку 2</button></div>`; return; }
    return renderClit(card, lead);
  }
  if (S.mode === 'conj') return renderConj(card, lead);
  if (S.mode === 'rod') return renderGen(card, lead);
  if (S.mode === 'poss') return renderPoss(card, lead);
  renderTiles(card, lead);
}

const poolHTML = (ex, used) => ex.tiles.map(tl => used.has(tl.id)
  ? `<span class="tile ghost" aria-hidden="true">${esc(disp(tl.t))}</span>`
  : `<button type="button" class="tile" data-id="${tl.id}" lang="${srLang()}"${ex.done ? ' disabled' : ''}>${esc(disp(tl.t))}</button>`).join('');

function renderTiles(card, lead) {
  const ex = cur, q = ex.cell.f === 'q';
  // Род «я» из настроек показываем там, где задание само его не выдаёт.
  const hidden = ex.cell.p <= 1 && ex.cell.t === 'past' &&
    ((ex.kind === 'build' && ex.v.ruSpecial === 'imati') || (ex.kind === 'transform' && ex.src.t !== 'past'));
  const gchip = hidden ? `<span class="chip to">${ex.cell.p ? 'ты' : 'я'} — ${ex.cell.g ? 'женский' : 'мужской'} род</span>` : '';
  let head;
  if (ex.kind === 'build') {
    head = `<div class="meta"><span class="chip">${T_RU[ex.cell.t]}</span><span class="chip">${F_RU[ex.cell.f]}</span>${gchip}</div><p class="prompt" lang="ru">${esc(ruFor(ex.v, ex.cell))}</p>`;
  } else {
    const to = [];
    if (ex.src.t !== ex.cell.t) to.push(T_RU[ex.cell.t]);
    if (ex.src.f !== ex.cell.f) to.push(F_RU[ex.cell.f]);
    head = `<div class="meta"><span class="chip">измените на</span>${to.map(x => `<span class="chip to">→ ${x}</span>`).join('')}${gchip}</div><p class="prompt" lang="${srLang()}">${esc(sentence(canonicalFor(ex.v, ex.src), ex.src.f === 'q'))}</p>`;
  }
  const ansTiles = ex.placed.length
    ? ex.placed.map((id, i) => `<button type="button" class="tile placed" data-un="${id}" lang="${srLang()}"${ex.done ? ' disabled' : ''}>${esc(i === 0 ? cap(disp(ex.tiles[id].t)) : disp(ex.tiles[id].t))}</button>`).join('') + (ex.done ? `<span class="punct">${q ? '?' : '.'}</span>` : '')
    : '<span class="placeholder">Нажимайте слова по порядку</span>';
  let actions, fb = '';
  if (!ex.done) actions = `<button type="button" class="btn primary" id="check"${ex.placed.length ? '' : ' disabled'}>Проверить</button><button type="button" class="btn" id="clear"${ex.placed.length ? '' : ' disabled'}>Стереть</button>`;
  else {
    actions = `<button type="button" class="btn primary" id="next">Дальше</button>`;
    const canon = `<span class="sent" lang="${srLang()}">${esc(sentence(ex.canon, q))}</span>`;
    if (ex.ok) {
      const same = eqT(ex.ans, ex.canon);
      fb = `<div class="fb ok"><span class="verdict" lang="${srLang()}">${ex.overridden ? 'Засчитано.' : esc(disp('Tačno!'))}</span>${same ? '' : `<span>Основной вариант: ${canon}</span>`}</div>`;
    } else {
      fb = `<div class="fb bad"><span class="verdict" lang="${srLang()}">${esc(disp('Netačno.'))}</span><span><s lang="${srLang()}">${esc(sentence(ex.ans, q))}</s> → ${canon}</span><p class="why">${whyHTML(ex.why)}</p><span><button type="button" class="link" id="override">Мой вариант тоже верный — засчитать</button></span></div>`;
    }
  }
  card.innerHTML = lead + head +
    `<div class="answer${ex.done ? (ex.ok ? ' ok' : ' bad') : ''}">${ansTiles}</div>${ex.done ? '' : `<div class="pool">${poolHTML(ex, new Set(ex.placed))}</div>`}<div class="actions">${actions}</div>${fb}`;
}

function renderConj(card, lead) {
  const ex = cur, next = ex.fill.indexOf(null), used = new Set(ex.fill.filter(x => x !== null));
  const who = r => {
    if (ex.t !== 'past') return esc(disp(r.p === 2 ? 'on, ona, ono' : r.p === 6 ? 'oni, one, ona' : P[r.p]));
    const mark = r.p <= 1 ? (r.g ? ' (ж)' : ' (м)') : (r.p === 4 || r.p === 5) && r.g === 4 ? ' (ж)' : '';
    return esc(disp(P[r.p])) + mark;
  };
  // Парадигма как в сербских грамматиках: jednina слева (ja, ti, on), množina справа (mi, vi, oni).
  const cell = (r, i) => {
    const id = ex.fill[i], res = ex.done ? ex.res[i] : null;
    const slot = id === null
      ? `<span class="cslot${i === next ? ' next' : ''}" aria-hidden="true"></span>`
      : `<button type="button" class="tile placed" data-row="${i}" lang="${srLang()}"${ex.done ? ' disabled' : ''}>${esc(disp(ex.tiles[id].t))}</button>`;
    return `<div class="ccell${res ? (res.ok ? ' ok' : ' bad') : ''}"><span class="who" lang="${srLang()}">${who(r)}</span>${slot}</div>`;
  };
  const cells = ex.rows.map(cell);
  const grid = `<div class="paradigm"><span class="colh">${sr('jednina')}</span>${cells.slice(0, 3).join('')}<span class="colh">${sr('množina')}</span>${cells.slice(3).join('')}</div>`;
  const notes = ex.done && !ex.ok ? `<ul class="cnotes">${ex.rows.map((r, i) => ex.res[i].ok ? '' :
    `<li><span class="who" lang="${srLang()}">${who(r)}</span> <span class="sent" lang="${srLang()}">${esc(disp(r.form))}</span>${ex.res[i].why ? `<span>${whyHTML(ex.res[i].why)}</span>` : ''}</li>`).join('')}</ul>` : '';
  const actions = ex.done
    ? `<button type="button" class="btn primary" id="next">Дальше</button>`
    : `<button type="button" class="btn primary" id="check"${next < 0 ? '' : ' disabled'}>Проверить</button><button type="button" class="btn" id="clear"${used.size ? '' : ' disabled'}>Стереть</button>`;
  const right = ex.done ? ex.res.filter(x => x.ok).length : 0;
  const fb = !ex.done ? '' : ex.ok
    ? `<div class="fb ok"><span class="verdict" lang="${srLang()}">${esc(disp('Tačno!'))}</span><span>Все шесть форм верны.</span></div>`
    : `<div class="fb bad"><span class="verdict" lang="${srLang()}">${esc(disp('Netačno.'))}</span><span>Верно ${right} из ${ex.rows.length}. Правильные формы:</span>${notes}</div>`;
  card.innerHTML = lead + `<div class="meta"><span class="chip">${T_RU[ex.t]}</span><span class="chip">${F_RU[ex.f]}</span></div>` +
    `<p class="prompt"><span lang="${srLang()}">${esc(disp(ex.v.inf))}</span> <span class="trn" lang="ru">— ${esc(TR[ex.v.id] || ex.v.ru.inf)}</span></p>` +
    grid + (ex.done ? '' : `<div class="pool">${poolHTML(ex, used)}</div>`) + `<div class="actions">${actions}</div>${fb}`;
}

function renderPoss(card, lead) {
  const ex = cur;
  const ans = ex.placed.length
    ? ex.placed.map(id => `<button type="button" class="tile placed" data-un="${id}" lang="${srLang()}"${ex.done ? ' disabled' : ''}>${esc(disp(ex.tiles[id].t))}</button>`).join('')
    : '<span class="placeholder">Нажимайте слова по порядку</span>';
  const right = `<span class="sent" lang="${srLang()}">${esc(ex.canon.map(disp).join(' '))}</span>`;
  const fb = !ex.done ? '' : ex.ok
    ? `<div class="fb ok"><span class="verdict" lang="${srLang()}">${esc(disp('Tačno!'))}</span>${right}</div>`
    : `<div class="fb bad"><span class="verdict" lang="${srLang()}">${esc(disp('Netačno.'))}</span><span><s lang="${srLang()}">${esc(ex.ans.map(disp).join(' '))}</s> → ${right}</span><p class="why">${whyHTML(ex.why)}</p></div>`;
  const actions = ex.done
    ? `<button type="button" class="btn primary" id="next">Дальше</button>`
    : `<button type="button" class="btn primary" id="check"${ex.placed.length ? '' : ' disabled'}>Проверить</button><button type="button" class="btn" id="clear"${ex.placed.length ? '' : ' disabled'}>Стереть</button>`;
  card.innerHTML = lead + `<div class="meta"><span class="chip">чей</span></div><p class="prompt" lang="ru">${esc(cap(ex.ru))}</p>` +
    `<div class="answer${ex.done ? (ex.ok ? ' ok' : ' bad') : ''}">${ans}</div>${ex.done ? '' : `<div class="pool">${poolHTML(ex, new Set(ex.placed))}</div>`}<div class="actions">${actions}</div>${fb}`;
}

function renderGen(card, lead) {
  const ex = cur, it = ex.it, ch = ex.chosen, G = {m:'мужской', f:'женский', n:'средний'};
  const tile = (n, g) => {
    const cls = !ex.done ? '' : n === it.n && g === it.g ? ' right' : ch.n === n && ch.g === g ? ' wrong' : '';
    return `<button type="button" class="tile gtile${cls}" data-gen="${n}.${g}" lang="${srLang()}"${ex.done ? ' disabled' : ''}>${esc(disp(PRON[n][g]))}</button>`;
  };
  const row = (n, label) => `<div class="grow"><span class="colh">${sr(label)}</span><div class="gtiles">${['m', 'f', 'n'].map(g => tile(n, g)).join('')}</div></div>`;
  let fb = '';
  if (ex.done) {
    const example = `<span class="sent" lang="${srLang()}">${esc(sentence([PRON[it.n][it.g], it.n === 'sg' ? 'je' : 'su', BITI_L[it.n][it.g], 'ovde'], false))}</span>`;
    const why = it.why || (ch.n !== it.n ? `«${it.w}» — ${it.n === 'pl' ? 'множественное' : 'единственное'} число, ${G[it.g]} род.` : `«${it.w}» — ${G[it.g]} род.`);
    fb = ex.ok
      ? `<div class="fb ok"><span class="verdict" lang="${srLang()}">${esc(disp('Tačno!'))}</span>${it.why ? `<p class="why">${whyHTML(it.why)}</p>` : ''}<span>Например: ${example}</span></div>`
      : `<div class="fb bad"><span class="verdict" lang="${srLang()}">${esc(disp('Netačno.'))}</span><p class="why">${whyHTML(why)}</p><span>Например: ${example}</span></div>`;
  }
  card.innerHTML = lead + `<div class="meta"><span class="chip">каким местоимением заменить</span></div>` +
    `<p class="prompt"><span lang="${srLang()}">${esc(disp(it.w))}</span> <span class="trn" lang="ru">— ${esc(it.ru)}</span></p>` +
    `<div class="gpick">${row('sg', 'jednina')}${row('pl', 'množina')}</div>` +
    (ex.done ? `<div class="actions"><button type="button" class="btn primary" id="next">Дальше</button></div>` : '') + fb;
}

function renderClit(card, lead) {
  const ex = cur, it = ex.it, k = it.k;
  let row = '';
  const slot = i => {
    if (!ex.done) return `<button type="button" class="slot" data-slot="${i}" aria-label="Поставить сюда"></button>`;
    return i === ex.chosen ? `<span class="ins ${ex.ok ? 'ok' : 'bad'}" lang="${srLang()}">${esc(disp(k))}</span>` : '<span class="gap"></span>';
  };
  ex.words.forEach((wd, i) => { row += slot(i) + `<span class="w" lang="${srLang()}">${esc(disp(wd))}</span>`; });
  row += slot(ex.words.length) + `<span class="w punct">${it.q ? '?' : '.'}</span>`;
  const build = s => { const t = ex.words.slice(); t[0] = t[0][0].toLowerCase() + t[0].slice(1); t.splice(s, 0, k); return sentence(t, it.q); };
  let fb = '', actions = '';
  if (ex.done) {
    actions = `<button type="button" class="btn primary" id="next">Дальше</button>`;
    const right = `<span class="sent" lang="${srLang()}">${esc(build(it.at))}</span>`;
    if (ex.ok) fb = `<div class="fb ok"><span class="verdict" lang="${srLang()}">${esc(disp('Tačno!'))}</span>${right}</div>`;
    else {
      const first = ex.words.slice(0, it.at).join(' ');
      const why = ex.chosen === 0 ? `«${k}» — энклитика: с неё фраза не начинается.`
        : ex.chosen < it.at ? `«${first}» — одно целое, энклитика встаёт после него.`
        : `Энклитика стоит на втором месте — сразу после «${first}».`;
      fb = `<div class="fb bad"><span class="verdict" lang="${srLang()}">${esc(disp('Netačno.'))}</span>${right}<p class="why">${whyHTML(why)}</p></div>`;
    }
  }
  card.innerHTML = lead + `<div class="meta"><span class="chip">куда поставить</span><span class="chip to" lang="${srLang()}">${esc(disp(k))}</span></div><p class="prompt" lang="ru">${esc(ex.ru)}</p><div class="slots">${row}</div><div class="actions">${actions}</div>${fb}`;
}

function mastery(t, f) { let s = 0; for (const g of GROUPS) { const r = S.cells[`${t}.${f}.${g}`]; s += r ? r.box / 4 : 0; } return s / GROUPS.length; }
function renderSide() {
  const L = LESSONS[S.lesson - 1];
  let h = `<table class="heat"><thead><tr><th></th>${FORMS.map(f => `<th scope="col">${F_SHORT[f]}</th>`).join('')}</tr></thead><tbody>`;
  for (const t of TENSES) {
    h += `<tr><th scope="row">${T_RU[t]}</th>`;
    for (const f of FORMS) {
      if (!L.tenses.includes(t)) { h += `<td><span class="cell locked">урок 2</span></td>`; continue; }
      const m = mastery(t, f), p = Math.round(m * 100), sel = S.focus === `${t}.${f}`;
      h += `<td><button type="button" class="cell${m > .55 ? ' dk' : ''}${sel ? ' sel' : ''}" style="--p:${p}%" data-focus="${t}.${f}" aria-pressed="${sel}" aria-label="${T_RU[t]}, ${F_RU[f]}: ${p}%">${p}</button></td>`;
    }
    h += '</tr>';
  }
  $('#heat').innerHTML = h + '</tbody></table>';

  const rows = Object.entries(S.cells)
    .filter(([k, r]) => r.wrong > 0 && L.tenses.includes(k.split('.')[0]))
    .sort((a, b) => a[1].box - b[1].box || b[1].wrong - a[1].wrong).slice(0, 4);
  $('#weak').innerHTML = rows.length
    ? rows.map(([k, r]) => { const [t, f, g] = k.split('.'); return `<li><button type="button" data-focus="${t}.${f}"><span>${T_RU[t]} · ${F_RU[f]} · ${GROUP_RU[g]}</span><span class="cnt" title="ошибок">${r.wrong}</span></button></li>`; }).join('')
    : '<li class="empty">Ошибок пока нет. Клетки, где вы ошибаетесь, появятся здесь и будут выпадать чаще.</li>';

  document.querySelectorAll('[data-gender]').forEach(b => b.setAttribute('aria-pressed', b.dataset.gender === S.gender));
  document.querySelectorAll('[data-script]').forEach(b => b.setAttribute('aria-pressed', b.dataset.script === S.script));
  $('#resetrow').innerHTML = confirmReset
    ? '<span class="confirm">Удалить весь прогресс? <button type="button" class="btn" id="reset-yes">Да, сбросить</button><button type="button" class="link" id="reset-no">Отмена</button></span>'
    : '<button type="button" class="link" id="reset">Сбросить прогресс</button>';
  $('#sheet').innerHTML = sheetHTML();
  $('#sync').textContent = syncMode === 'cloud' ? 'Прогресс сохраняется в вашем аккаунте и доступен на других устройствах.' : 'Прогресс хранится в этом браузере.';
}

function sheetHTML() {
  if (S.lesson === 1) {
    const rows = [['ja','čitam','radim','pišem'],['ti','čitaš','radiš','pišeš'],['on, ona','čita','radi','piše'],['mi','čitamo','radimo','pišemo'],['vi','čitate','radite','pišete'],['oni','čitaju','rade','pišu']];
    return `<p>Отбросьте <b>${sr('-m')}</b> у формы «${sr('ja')}» — получится основа. Форма «${sr('oni')}» запоминается отдельно.</p>
      <table class="conj"><thead><tr><th></th><th>${sr('-am')}</th><th>${sr('-im')}</th><th>${sr('-em')}</th></tr></thead><tbody>${rows.map(r => `<tr><th>${sr(r[0])}</th>${r.slice(1).map(x => `<td>${sr(x)}</td>`).join('')}</tr>`).join('')}</tbody></table>
      <p>Вопрос: ${sr('da li')} + глагол. Отрицание: ${sr('ne')} + глагол, раздельно.</p>
      <p>Местоимения: ${sr('ja, ti, on / ona / ono, mi, vi, oni / one / ona')}. В настоящем времени у 3-го лица одна форма на все роды.</p>
      <p><b>Чей</b>: ${sr('moj, tvoj, njegov, njen, naš, vaš, njihov')} меняются по роду слова: ${sr('moj stan, moja kuća, moje dete')}. И «его, её, их» тоже: ${sr('njegova kuća')} — его дом.</p>
      <p class="muted">Глаголы: ${VERBS.filter(v => v.l === 1).map(v => sr(v.inf)).join(', ')}. Готовые фразы: ${sr('kod kuće')} — дома, ${sr('u Beogradu')} — в Белграде, ${sr('kući')} — домой.</p>`;
  }
  if (S.lesson === 2) return `<p><b>Прошедшее</b>: форма на ${sr('-o / -la / -li')} + ${sr('sam, si, je, smo, ste, su')}.</p>
      <p>${sr('Radio sam.')} · ${sr('Da li si radio?')} · ${sr('Nisam radio.')}</p>
      <p>Род в прошедшем: ${sr('on je radio, ona je radila, ono je radilo')}. Во множественном: ${sr('-li')} — мужчины или смешанная группа, ${sr('-le')} — только женщины: ${sr('one su radile')}. ${sr('Dete')} — среднего рода: ${sr('dete je radilo')}.</p>
      <p><b>Будущее</b>: ${sr('radiću')} одним словом, если глагол стоит первым. После другого слова — раздельно: ${sr('On će raditi')}. Глаголы на ${sr('-ći')} всегда раздельно: ${sr('ići ću')}.</p>
      <p>${sr('Da li ćeš raditi?')} · ${sr('Neću raditi.')}</p>
      <p><b>Энклитики</b> ${sr('sam, si, je, ću, ćeš…')} стоят вторыми и никогда не начинают фразу.</p>
      <p>«Чей» во множественном: ${sr('moji prijatelji')} (м.), ${sr('moje knjige')} (ж.).</p>
      <p class="muted">Новые слова: ${sr('juče')} — вчера, ${sr('sutra')} — завтра.</p>`;
  return `<p><b>${sr('biti')}</b>: ${sr('sam, si, je, smo, ste, su')} — энклитики. ${sr('Kod kuće sam')} или ${sr('Ja sam kod kuće')}, но не «${sr('Sam kod kuće')}».</p>
      <p>Отрицание слитно: ${sr('nisam, nisi, nije, nismo, niste, nisu')}.</p>
      <p><b>${sr('imati')}</b> → ${sr('nemam, nemaš, nema…')} ${sr('Imam psa')} — у меня есть собака.</p>
      <p><b>${sr('hteti')}</b>: ${sr('hoću, hoćeš, hoće…')} → ${sr('neću')} — и «не хочу», и «не буду».</p>
      <p class="muted">Готовые фразы: ${sr('psa')} — собаку, ${sr('vremena')} — времени, ${sr('kafu')} — кофе, ${sr('pivo')} — пиво.</p>`;
}

// ---------- события ----------
let menuClosedAt = 0;
$('#settings').addEventListener('beforetoggle', e => { if (e.newState === 'closed') menuClosedAt = Date.now(); });
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  if (tooSoon(menuClosedAt) && !b.closest('#settings, .gear')) return;
  const d = b.dataset;
  if (d.focus && b.closest('.side')) {   // матрица под карточкой: на телефоне показываем, что упражнение сменилось
    toggleFocus(d.focus);
    const top = $('#card').getBoundingClientRect().top;
    if (top < 0 || top > innerHeight * 0.6) $('#card').scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start'});
    return;
  }
  if (d.lesson) return setLesson(+d.lesson);
  if (d.mode) return setMode(d.mode);
  if (d.row !== undefined) return unfillRow(+d.row);
  if (d.id !== undefined) return place(+d.id);
  if (d.un !== undefined) return unplace(+d.un);
  if (d.slot !== undefined) return chooseSlot(+d.slot);
  if (d.focus) return toggleFocus(d.focus);
  if (d.gen) return chooseGen(...d.gen.split('.'));
  if (d.gender) return setGender(d.gender);
  if (d.script) return setScript(d.script);
  switch (b.id) {
    case 'check': return check();
    case 'clear': return clearPlaced();
    case 'next': return next();
    case 'override': return override();
    case 'unfocus': return toggleFocus(null);
    case 'to-l2': return setLesson(2);
    case 'reset': confirmReset = true; return renderSide();
    case 'reset-no': confirmReset = false; return renderSide();
    case 'reset-yes': {
      // resetAt отсекает старые записи и на других устройствах — иначе слияние вернуло бы их обратно.
      S = Object.assign(DEFAULT(), settingsOf(S), {owner: S.owner, resetAt: Date.now()});
      confirmReset = false; persist(); newEx(); return renderAll();
    }
  }
});

// ---------- сохранение: браузер сразу, аккаунт и другие вкладки — слиянием ----------
const settingsOf = s => ({lesson:s.lesson, mode:s.mode, gender:s.gender, script:s.script, focus:s.focus, settingsAt:s.settingsAt});
const visible = s => [s.lesson, s.mode, s.gender, s.script, s.focus].join('|');
// Сравнение по содержимому, а не по часам: у разных устройств часы расходятся. Порядок ключей не важен.
const statsKey = s => JSON.stringify([s.cells, s.verbs, s.clit, s.gen, s.poss].map(o => Object.keys(o).sort().map(k => [k, o[k].box, o[k].seen, o[k].wrong, o[k].rs]))) + s.resetAt;
const sameState = (a, b) => statsKey(a) === statsKey(b) && visible(a) === visible(b) && a.settingsAt === b.settingsAt;
function persist(settings) {
  const now = Date.now();
  S.updatedAt = now;
  if (settings) S.settingsAt = now;
  saveLocal(); dirty = true; scheduleRemote(3000);
}
// Слияние двух копий прогресса. По каждой клетке берём запись, где больше ответов; настройки — более свежие.
// Сброс — это «эпоха» resetAt: запись, созданная в старой эпохе (rs меньше), отбрасывается, какие бы ни были часы.
// ponytail: ответы, данные параллельно в одну и ту же клетку на двух устройствах, сольются в одну запись
// (выиграет та, где их больше) — нужен CRDT со счётчиками по устройствам, если это станет заметно.
function mergeState(a, b) {
  const resetAt = Math.max(a.resetAt, b.resetAt);
  const bucket = (x, y) => {
    const out = {};
    for (const k of new Set([...Object.keys(x), ...Object.keys(y)])) {
      const r = !x[k] ? y[k] : !y[k] ? x[k] : y[k].seen > x[k].seen ? y[k] : x[k];
      if (r.rs >= resetAt) out[k] = r;
    }
    return out;
  };
  return Object.assign({}, a, settingsOf(b.settingsAt > a.settingsAt ? b : a), {
    cells: bucket(a.cells, b.cells), verbs: bucket(a.verbs, b.verbs), clit: bucket(a.clit, b.clit), gen: bucket(a.gen, b.gen), poss: bucket(a.poss, b.poss), resetAt,
    updatedAt: Math.max(a.updatedAt, b.updatedAt),
  });
}
// Принять слитое состояние. Если сменились урок, режим, род или фокус — текущее упражнение больше не годится.
function adopt(next) {
  const was = S;
  S = next;
  if ([was.lesson, was.mode, was.gender, was.focus].join('|') !== [S.lesson, S.mode, S.gender, S.focus].join('|')) { newEx(); renderAll(); }
  else if (was.script !== S.script) renderAll();
  else renderSide();
}

function scheduleRemote(ms) { if (!remoteRef) return; clearTimeout(saveTimer); saveTimer = setTimeout(() => { saveTimer = 0; flushNow(); }, ms); }
const FATAL = ['invalid_argument', 'revoked', 'not_granted', 'capability_disabled', 'capability_removed', 'quota_exceeded', 'transform_error'];
function goLocal() { remoteRef = null; syncMode = 'local'; renderSide(); }
// Одна запись за раз: прочитать документ, влить чужие ответы, записать — только если есть что добавить.
async function flushNow() {
  if (!remoteRef || !dirty || writing) return;
  const ref = remoteRef;
  writing = true; dirty = false;
  try {
    const snap = await ref.get();
    const raw = snap.exists ? snap.data() : null;
    if (raw && raw.v !== 1) return goLocal();   // документ более новой версии приложения — не перезаписываем
    const r = raw ? normalize(raw) : null;
    if (r) { adopt(mergeState(S, r)); saveLocal(); }
    if (r && sameState(S, r)) return;
    await ref.set(JSON.parse(JSON.stringify(S)));
    retry = 0;
  } catch (err) {
    dirty = true;
    if (err && FATAL.includes(err.code)) goLocal();
    else { retry = Math.min(retry + 1, 5); scheduleRemote(2000 * 2 ** retry); }   // неизвестный код = временный сбой
  } finally {
    writing = false;
    if (dirty && remoteRef && !saveTimer) scheduleRemote(3000);
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && dirty) { clearTimeout(saveTimer); saveTimer = 0; flushNow(); }
});
// Другая вкладка этого браузера сохранила прогресс — вливаем его, чтобы вкладки не затирали друг друга.
window.addEventListener('storage', e => {
  if (e.key !== LS_KEY || !e.newValue) return;
  let other; try { other = normalize(JSON.parse(e.newValue)); } catch (err) { return; }
  const merged = mergeState(S, other);
  if (sameState(merged, S)) return;
  adopt(merged);
  if (!sameState(S, other)) saveLocal();   // у нас было то, чего нет у соседки, — пусть она тоже узнает
});

function subscribe(ref) {
  ref.onSnapshot(s => {   // ответы и настройки с другого устройства, пока страница открыта
    if (!s.exists || s.metadata.hasPendingWrites) return;
    const raw = s.data();
    if (!raw || raw.v !== 1) return;
    const r = normalize(raw), merged = mergeState(S, r);
    if (!sameState(merged, S)) { adopt(merged); saveLocal(); }
    if (!sameState(S, r)) { dirty = true; scheduleRemote(3000); }   // в облаке нет наших ответов — дописать
  }, err => {
    if (err && err.code === 'unavailable') setTimeout(() => { if (remoteRef === ref) subscribe(ref); }, 5000);
    else goLocal();
  });
}

async function initRemote(attempt = 0) {
  if (!window.claude || typeof window.claude.use !== 'function') return;
  try {
    const [user, db] = await Promise.all([window.claude.use('user'), window.claude.use('db')]);
    if (!user || !db) return;
    const uid = await user.id();
    if (!uid) return;
    const ref = db.doc('data/users/' + uid + '/progress');
    const snap = await ref.get();
    const raw = snap.exists ? snap.data() : null;
    if (raw && raw.v !== 1) return;   // документ более новой версии приложения — работаем локально, его не трогаем
    const switched = !!S.owner && S.owner !== uid;
    let next = switched ? DEFAULT() : S;   // в этом браузере лежит прогресс другого аккаунта
    next = Object.assign({}, next, {owner: uid});
    if (raw) next = mergeState(next, normalize(raw));   // слияние, а не замена: касания до загрузки облака ничего не стирают
    adopt(next);
    if (switched) { newEx(); renderAll(); }   // экран прежнего аккаунта не должен остаться на месте
    saveLocal();
    remoteRef = ref; syncMode = 'cloud'; renderSide();
    dirty = !raw || !sameState(S, normalize(raw));
    if (dirty) scheduleRemote(0);
    subscribe(ref);
  } catch (err) {
    if (err && FATAL.includes(err.code)) return goLocal();
    if (attempt < 5) setTimeout(() => initRemote(attempt + 1), 2000 * 2 ** attempt);   // временный сбой при запуске — повторить
  }
}

if (location.hash === '#selftest') { const r = selfTest(); console.log('selfTest:', r.cells, 'клеток,', r.errors.length, 'ошибок'); r.errors.forEach(x => console.warn(x)); }
newEx(); renderAll(); initRemote();
})();
</script>
</html>
