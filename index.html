<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Тренажёр сербского глагола: спряжение, сборка фраз из плиток, трансформации и энклитики.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%232A45A8%22/%3E%3Ctext x=%2216%22 y=%2223%22 font-family=%22Georgia,serif%22 font-size=%2220%22 font-weight=%22700%22 fill=%22white%22 text-anchor=%22middle%22%3E%D0%A1%3C/text%3E%3C/svg%3E">
<title>Srpska matrica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@500;600&family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap">
<style>
:root{
  --paper:#F1F3F6; --panel:#FFFFFF; --ink:#172131; --muted:#5E6A7D; --line:#D6DDE6; --grid:#E6EAF0;
  --accent:#2A45A8; --accent-ink:#FFFFFF; --accent-soft:#E3E8F8;
  --ok:#23703F; --ok-soft:#E1F1E6; --bad:#B8342A; --bad-soft:#FBE6E3;
  --tile:#FFFFFF; --tile-edge:#B8C2D0; --shadow:rgba(23,33,49,.16);
  --serif:"Source Serif 4","PT Serif",Georgia,serif;
  --sans:"Source Sans 3","PT Sans",system-ui,sans-serif;
  --mono:"Source Code Pro",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F141C; --panel:#161D28; --ink:#E5E9F0; --muted:#97A3B6; --line:#2B3546; --grid:#1F2735;
    --accent:#8FA5FF; --accent-ink:#0F141C; --accent-soft:#1E2848;
    --ok:#66C48F; --ok-soft:#14301F; --bad:#F2806F; --bad-soft:#3A1D1A;
    --tile:#1C2431; --tile-edge:#3B475B; --shadow:rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F141C; --panel:#161D28; --ink:#E5E9F0; --muted:#97A3B6; --line:#2B3546; --grid:#1F2735;
  --accent:#8FA5FF; --accent-ink:#0F141C; --accent-soft:#1E2848;
  --ok:#66C48F; --ok-soft:#14301F; --bad:#F2806F; --bad-soft:#3A1D1A;
  --tile:#1C2431; --tile-edge:#3B475B; --shadow:rgba(0,0,0,.5);
  color-scheme:dark;
}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1180px;margin:0 auto;padding-inline:max(24px, env(safe-area-inset-left, 0px)) max(24px, env(safe-area-inset-right, 0px));padding-block:20px 48px}

/* Шапка: название, уроки, шестерёнка. На телефоне уроки уходят второй строкой. */
.top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"brand lessons gear";align-items:center;gap:14px 20px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.brand{grid-area:brand}
.brand .name{display:block;font:700 30px/1.05 var(--serif);letter-spacing:-.01em}
.brand .alt{display:block;margin-top:6px;font:500 13px/1.3 var(--mono);color:var(--muted)}
.lessons{grid-area:lessons;justify-self:end;display:flex;gap:8px}
.lessons button{display:grid;gap:2px;text-align:left;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer}
.lessons button[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.lessons .ln{font:600 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.lessons .lt{font-weight:600;line-height:1.2}
.gear{grid-area:gear;display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--muted);cursor:pointer}
.gear svg{width:22px;height:22px}

/* Меню настроек — нативный popover: закрывается касанием вне меню. */
.menu{box-sizing:border-box;position:fixed;inset:auto;top:calc(env(safe-area-inset-top, 0px) + 76px);right:max(16px, calc((100vw - 1180px) / 2 + 24px));margin:0;width:min(340px, calc(100vw - 32px));padding:16px 18px 18px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);box-shadow:0 14px 36px var(--shadow)}
.menu::backdrop{background:transparent}
.menu[hidden]{display:none}
.menu-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.menu-head h2{margin:0;font:600 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.x{width:44px;height:44px;border:0;border-radius:8px;background:none;color:var(--muted);font-size:22px;line-height:1;cursor:pointer}
.menu .row + .row{margin-top:14px}
.menu .sync{margin:16px 0 0;font-size:13px;color:var(--muted)}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;margin-top:22px;align-items:start}

.modes{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.modes::-webkit-scrollbar{display:none}
.modes button{flex:none;white-space:nowrap;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer}
.modes button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.focusbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-bottom:12px;font-size:14px;color:var(--muted)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:26px 30px 28px;display:flex;flex-direction:column;gap:20px;min-height:400px}
.lead{margin:0;color:var(--muted);font-size:15px}
.leadrow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.leadrow .link{flex:none;margin-top:-12px}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 12px/1 var(--mono);letter-spacing:.02em;padding:6px 8px;border-radius:6px;background:var(--grid);color:var(--muted)}
.chip.to{background:var(--accent-soft);color:var(--accent)}
.prompt{margin:0;font:600 clamp(23px, 5.6vw, 30px)/1.25 var(--serif);text-wrap:balance}
.trn{font:500 clamp(17px, 4.2vw, 20px)/1.3 var(--sans);color:var(--muted)}

.answer{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:64px;padding-block:6px 12px;border-bottom:2px solid var(--line)}
.answer.ok{border-bottom-color:var(--ok)}
.answer.bad{border-bottom-color:var(--bad)}
.placeholder{color:var(--muted);font-style:italic}
.punct{font:600 24px/1 var(--serif);color:var(--muted)}
.pool{display:flex;flex-wrap:wrap;gap:10px}
.tile{box-sizing:border-box;min-height:48px;font:600 clamp(18px, 4.6vw, 21px)/1 var(--serif);padding:12px 16px;background:var(--tile);border:1px solid var(--tile-edge);border-bottom-width:3px;border-radius:7px;cursor:pointer;transition:transform .08s,border-color .12s}
.tile:active:not(:disabled){transform:translateY(1px)}
.tile:disabled{cursor:default}
.tile.placed{background:var(--accent-soft);border-color:var(--accent)}
.tile.ghost{color:transparent;background:transparent;border-style:dashed;border-color:var(--line);cursor:default}
.answer.ok .tile.placed{background:var(--ok-soft);border-color:var(--ok)}
.answer.bad .tile.placed{background:var(--bad-soft);border-color:var(--bad)}

.actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.btn{min-height:46px;font-weight:600;padding:10px 18px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
.link{display:inline-flex;align-items:center;min-height:44px;background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:14px;text-align:left}

.fb{border-radius:10px;padding:14px 16px;display:grid;gap:6px;scroll-margin-bottom:110px}
.fb:focus{outline:none}
.vru{font:500 14px var(--sans);color:var(--muted);margin-left:6px}
.gloss{margin:-8px 0 0;color:var(--muted);font-size:15px}
.intro{display:grid;gap:10px;padding:14px 16px;border-radius:10px;border:1px solid var(--accent)}
.intro p{margin:0}
.btn.sm{min-height:40px;padding:6px 12px;font-size:14px}
.cslot.target{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
button.cslot{cursor:pointer;padding:0;background:none}
.num{background:var(--panel);color:var(--ink);padding:2px 5px;border-radius:4px}
.fb.ok{background:var(--ok-soft)}
.fb.bad{background:var(--bad-soft)}
.verdict{font:700 18px/1.2 var(--serif)}
.fb.ok .verdict{color:var(--ok)}
.fb.bad .verdict{color:var(--bad)}
.sent{font:600 19px/1.35 var(--serif)}
.fb s{color:var(--bad);text-decoration-thickness:2px}
.why{margin:0}

.paradigm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:auto repeat(3,auto);grid-auto-flow:column;gap:10px 16px}
.colh{font:600 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ccell{display:grid;gap:4px;min-width:0}
.ccell .who{font:500 12px/1.2 var(--mono);color:var(--muted)}
.ccell .tile{width:100%;text-align:left}
.cslot{display:block;width:100%;height:48px;border:1.5px dashed var(--tile-edge);border-radius:7px}
.cslot.next{border-color:var(--accent);background:var(--accent-soft)}
.ccell.ok .tile.placed{background:var(--ok-soft);border-color:var(--ok)}
.ccell.bad .tile.placed{background:var(--bad-soft);border-color:var(--bad);text-decoration:line-through;text-decoration-thickness:2px}
.cnotes{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:8px;font-size:14px}
.cnotes li{display:grid;gap:2px}
.cnotes .who{font:500 12px/1.2 var(--mono);color:var(--muted)}

.slots{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:64px}
.w{font:600 clamp(22px, 5.4vw, 26px)/1.2 var(--serif)}
.slot{display:grid;place-items:center;width:44px;height:48px;border:1.5px dashed var(--tile-edge);border-radius:6px;background:none;cursor:pointer}
.slot::before{content:"+";font:600 16px/1 var(--mono);color:var(--muted)}
.ins{font:600 clamp(22px, 5.4vw, 26px)/1.2 var(--serif);padding:2px 8px;border-radius:6px}
.ins.ok{background:var(--ok-soft);color:var(--ok)}
.ins.bad{background:var(--bad-soft);color:var(--bad)}
.gap{width:4px}

.cell.static{cursor:default}
.pbar-l{margin:0 0 8px;font-size:14px}
.pbar{height:10px;border-radius:6px;background:var(--grid);overflow:hidden}
.pbar span{display:block;height:100%;background:var(--accent)}
.weak .wrow{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px;padding:6px 8px;font-size:14px}
.program{margin:0;padding-left:22px;display:grid;gap:6px;font-size:14px;color:var(--muted)}
.program .here{color:var(--ink)}
.gpick{display:grid;gap:14px}
.grow{display:grid;gap:6px}
.gtiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.gtile{text-align:center}
.gtile.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.gtile.wrong{background:var(--bad-soft);border-color:var(--bad);text-decoration:line-through;text-decoration-thickness:2px}
.ask{display:grid;gap:10px;padding:14px 16px;border-radius:10px;background:var(--accent-soft)}
.ask p{margin:0}

.side{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.panel h2,.panel summary{margin:0 0 12px;font:600 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel summary{margin:0;cursor:pointer;padding-block:16px;margin-block:-12px}
details[open] summary{margin-bottom:12px}
.hint{margin:10px 0 0;font-size:13px;color:var(--muted)}
.heat{width:100%;border-collapse:separate;border-spacing:4px;table-layout:fixed}
.heat th{font:500 11px/1.2 var(--mono);color:var(--muted);text-align:center}
.heat th[scope="row"]{text-align:right;padding-right:4px;width:84px}
.cell{display:grid;place-items:center;width:100%;aspect-ratio:1.35;border:0;border-radius:6px;background:color-mix(in srgb,var(--accent) var(--p,0%),var(--grid));font:600 13px/1 var(--mono);font-variant-numeric:tabular-nums;cursor:pointer}

.cell.sel{outline:2px solid var(--ink);outline-offset:1px}
.cell.locked{background:repeating-linear-gradient(45deg,var(--grid) 0 4px,transparent 4px 8px);color:var(--muted);font:500 11px/1.2 var(--mono);cursor:default;text-align:center}
.weak{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.weak button{width:100%;min-height:44px;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:none;border:0;border-radius:6px;padding:6px 8px;cursor:pointer;font-size:14px}
.weak .cnt{font:600 13px var(--mono);color:var(--bad)}
.weak .empty{font-size:14px;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{min-height:44px;border:0;background:none;padding:6px 12px;font-size:14px;color:var(--muted);cursor:pointer}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.sheet{font-size:14px}
.sheet p{margin:0 0 8px}
.sheet .muted{color:var(--muted)}
.conj{border-collapse:collapse;margin:4px 0 10px;font:500 14px var(--serif)}
.conj th,.conj td{padding:3px 10px 3px 0;text-align:left}
.conj thead th{font:500 11px var(--mono);color:var(--muted)}
.conj tbody th{font:500 12px var(--mono);color:var(--muted)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}

/* Наведение — только там, где есть мышь: на телефоне подсветка «залипает» после касания. */
@media (hover: hover){
  .lessons button:hover,.gear:hover,.btn:hover:not(:disabled){border-color:var(--accent)}
  .modes button:hover{color:var(--ink)}
  .tile:hover:not(:disabled){transform:translateY(-1px);border-color:var(--accent)}
  .slot:hover{border-color:var(--accent);background:var(--accent-soft)}
  .weak button:hover{background:var(--grid)}
}

@media (max-width:920px){.layout{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .top{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand gear" "lessons lessons"}
  .lessons{justify-self:stretch;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
  .lessons button{padding:8px 10px}
}
@media (max-width:700px){
  /* Вкладки сеткой в три колонки: полоса с прокруткой прятала часть вкладок за краем. */
  .modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;border-bottom:0;overflow:visible}
  .modes button{margin:0;padding:10px 4px;border:1px solid var(--line);border-radius:8px;background:var(--panel);text-align:center;white-space:normal;font-size:14px;hyphens:auto;overflow-wrap:anywhere}
  .modes button[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .lessons .lt{font-size:13px}
  .menu{top:calc(env(safe-area-inset-top, 0px) + 64px)}
}
@media (max-width:560px){
  .app{padding-inline:max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));padding-block:14px 32px}
  .brand .name{font-size:24px}
  .brand .alt{font-size:12px}
  .lessons button{padding:6px 8px}
  .lessons .ln{font-size:11px}
  .layout{margin-top:14px;gap:18px}
  .card{padding:18px 16px 20px;gap:16px;min-height:0}
  /* Вкладки сеткой 2×2: полоса с прокруткой прятала «Энклитики» за краем экрана. */
  .actions .btn{flex:1 1 auto}
  /* Строка ответа сразу высотой в две строки плиток — ничего не прыгает, когда ответ переносится. */
  .answer{min-height:108px;align-content:flex-start}
  /* Кнопки прилипают к низу экрана: «Проверить» и «Дальше» всегда под большим пальцем. */
  .card > .actions{position:sticky;bottom:0;z-index:2;margin-inline:-16px;margin-bottom:-20px;padding:10px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    background:color-mix(in srgb, var(--panel) 94%, transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--line);border-radius:0 0 12px 12px}
  .paradigm{gap:8px 10px}
  .tile{padding:10px 12px;min-height:44px}
  .cslot{height:44px}
  .heat th[scope="row"]{width:72px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="app" id="app" lang="ru">
  <header class="top">
    <div class="brand">
      <span class="name" lang="sr-Latn">Srpska matrica</span>
      <span class="alt"><span lang="sr-Cyrl">Српска матрица</span><span class="sub"> · тренажёр сербского глагола</span></span>
    </div>
    <nav class="lessons" id="lessons" aria-label="Урок"></nav>
    <button type="button" class="gear" popovertarget="settings" aria-label="Настройки" title="Настройки">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <div id="settings" class="menu" popover>
    <div class="menu-head"><h2>Настройки</h2><button type="button" class="x" popovertarget="settings" popovertargetaction="hide" aria-label="Закрыть">×</button></div>
    <div class="row"><span>Род для «я»</span><span class="seg"><button type="button" data-gender="m">мужской</button><button type="button" data-gender="f">женский</button></span></div>
    <div class="row"><span>Письмо</span><span class="seg"><button type="button" data-script="lat">latinica</button><button type="button" data-script="cyr">ћирилица</button></span></div>
    <div class="row" id="resetrow"><button type="button" class="link" id="reset">Сбросить прогресс</button></div>
    <p class="sync" id="sync"></p>
  </div>

  <main class="layout">
    <section>
      <div class="modes" id="modes" role="tablist" aria-label="Упражнение"></div>
      <div id="focusbar"></div>
      <article class="card" id="card" role="tabpanel"></article>
      <p class="sr" id="live" aria-live="polite"></p>
    </section>
    <aside class="side">
      <section class="panel">
        <h2 id="heatTitle">Матрица</h2>
        <div id="heat"></div>
        <p class="hint" id="heatHint"></p>
      </section>
      <section class="panel">
        <h2>Слабые места</h2>
        <ol class="weak" id="weak"></ol>
      </section>
      <details class="panel" open>
        <summary>Шпаргалка урока</summary>
        <div class="sheet" id="sheet"></div>
      </details>
      <details class="panel">
        <summary>Программа курса</summary>
        <ol class="program" id="program"></ol>
      </details>
    </aside>
  </main>

  const have = new Set(canon.map(x => x.toLowerCase())), req = [], opt = [];
  const add = (list, t, why) => {
    const k = t.toLowerCase();
    if (have.has(k) || req.concat(opt).some(d => d.t.toLowerCase() === k)) return false;
    list.push({t, why}); return true;
  };
  const f = forms(v, cell), t = cell.t, m = cell.f;
  if (m === 'neg') {
    const calque = (x, right) => {
      add(req, 'ne', `Здесь отрицание пишется слитно: не «ne ${x}», а «${right}».`);
      add(req, x, `Здесь нужна отрицательная форма «${right}», а не «${x}».`);
    };
    if (t === 'past') calque(f.A, f.NA);
    else if (t === 'fut') calque(f.F, f.NF);
    else if (v.presNeg) calque(f.V, f.NV[0]);
  }
  if (t === 'fut' && m === 'aff' && !THIRD.has(cell.p) && f.FM.length === 1) { add(req, f.F, null); add(req, f.I, null); }
  if (cell.c && cell.c.da) {   // «hoću da radiš» — после «da» глагол в том же лице, что и «hoću»
    const v2 = VERBS.find(x => x.id === cell.c.da), mine2 = v2.pres[CONJ[cell.p]];
    const x = v2.pres.find(y => y !== mine2 && y !== f.V);
    add(req, x, `После «da» глагол стоит в том же лице, что и «${v.pres[CONJ[cell.p]]}»: «da ${mine2}».`);
  }
  const mine = personToken(v, cell, cell.p);
  let persons = 0;
  for (const j of shuffle([0,1,2,4,5,6])) {
    const x = personToken(v, cell, j);
    if (x === mine) continue;
    const who = P.slice(0, 7).filter((_, q) => personToken(v, cell, q) === x).join(' / ');
    if (add(opt, x, `«${x}» — это форма для «${who}».`) && ++persons === 2) break;
  }
  if (t === 'past' && !genderFree && !ambiguousG(v, cell)) {
    const L = v.part, g = cell.g;
    if (cell.p === 7) add(opt, L[0], `«${L[0]}» — мужской род, а «dete» — среднего, хотя «ребёнок» мужского.`);
    else if (cell.p === 8) add(opt, L[3], `«${L[3]}» — мужской род, а «žene» — женского.`);
    else if (g >= 3) add(opt, L[0], `«${L[0]}» — единственное число, а здесь множественное.`);
    else add(opt, L[1 - g], `«${L[1 - g]}» — ${g === 0 ? 'женский' : 'мужской'} род.`);
  }
  if (t !== 'pres') add(opt, f.V, `«${f.V}» — это настоящее время.`);
  else if (lesson >= TENSE_L.past) add(opt, v.part[cell.g], `«${v.part[cell.g]}» — это прошедшее время.`);
  if (m === 'q' && cell.li) add(opt, 'da', '«da li» — одно целое. С «li» после глагола «da» не нужно.');
  if (m === 'neg') add(opt, 'da li', '«da li» делает вопрос, а здесь отрицание.');
  else add(opt, 'ne', m === 'q' ? '«ne» добавляет отрицание, а нужен просто вопрос.' : '«ne» — это отрицание.');
  const max = canon.length >= 4 ? 3 : 4;
  return req.concat(shuffle(opt).slice(0, Math.max(0, max - req.length)));
}

// Порядок слов в сербском свободный, но с жёсткими правилами. null — порядок верный.
function orderError(low, v, cell) {
  const f = forms(v, cell), lc = x => x.toLowerCase();
  if (low.indexOf('da li') > 0) return '«da li» ставится в начало вопроса.';
  const ci = low.findIndex((x, i) => CLITICS.has(x) && !(i === 0 && x === 'je' && low[1] === 'li'));   // «Je li…?» — устойчивое начало вопроса
  if (ci === 0) return `«${low[0]}» — энклитика: с неё фраза не начинается, её место второе.`;
  if (ci > 1) return `Энклитика «${low[ci]}» стоит после первого слова или первого сочетания («da li», «kod kuće»), а не дальше.`;
  if (f.FM.length === 1) {   // у глаголов на -ći будущее всегда раздельное
    if (low.indexOf(lc(f.FM[0])) > 0) return `«${f.FM[0]}» одним словом бывает только в начале фразы. После другого слова — раздельно: «${f.F} ${f.I}».`;
    if (low[0] === lc(f.I) && FUT.includes(low[1])) return `Когда глагол стоит первым, будущее пишется одним словом: «${f.FM[0]}».`;
  }
  const n = low.indexOf('ne');
  if (n !== -1 && low[n + 1] !== lc(f.V)) return '«ne» ставится прямо перед глаголом.';
  const di = low.indexOf('da');
  if (di !== -1 && cell.c && cell.c.da) {   // «Hoću da radim»: «da» — сразу перед вторым глаголом и после формы «hteti»
    const v2 = compTokens(cell)[1];
    if (low[di + 1] !== lc(v2)) return `После «da» сразу идёт второй глагол: «da ${v2}».`;
    const main = low.findIndex(x => v.pres.includes(x) || (v.presNeg || []).includes(x) || v.part.includes(x));
    if (main === -1 || main > di) return `«da ${v2}» идёт после «${v.pres[CONJ[cell.p]]}»: сначала «хочу», потом что именно.`;
  }
  const neg = low.findIndex(x => NAUX.includes(x) || NFUT.includes(x));
  const nonfin = low.findIndex(x => x === lc(v.inf) || v.part.includes(x));
  if (neg !== -1 && nonfin !== -1 && neg > nonfin) return `«${low[neg]}» стоит перед глаголом.`;
  return null;
}

// Чем набор слов ответа отличается от набора base: чего не хватает и что лишнее.
function wordDiff(base, ans) {
  const rest = base.slice(), extra = [];
  for (const x of ans) { const i = rest.findIndex(y => y.toLowerCase() === x.toLowerCase()); if (i >= 0) rest.splice(i, 1); else extra.push(x); }
  return {missing: rest, extra, score: rest.length + extra.length};
}
const sameWords = (ex, ans) => ex.bases.some(b => wordDiff(b, ans).score === 0);
function isCorrect(ex, ans) { return sameWords(ex, ans) && !orderError(ans.map(x => x.toLowerCase()), ex.v, ex.cell); }

// Почему ответ неверен. Сообщения с «…» — сербские слова, интерфейс покажет их в выбранном письме.
function diagnose(ex, ans) {
  const low = ans.map(x => x.toLowerCase());
  if (sameWords(ex, ans)) { const e = orderError(low, ex.v, ex.cell); return e ? {ok:false, why:e} : {ok:true}; }
  const q = xs => xs.map(x => '«' + x + '»').join(', ');
  const can = wordDiff(ex.canon, ans);
  if (can.missing.length === 0) return {ok:false, why:`Лишние слова: ${q(can.extra)}.`};   // «nisam ne radio» → лишнее «ne»
  for (const d of ex.distract) if (d.why && low.includes(d.t.toLowerCase())) return {ok:false, why:d.why};
  const c = ex.bases.map(b => wordDiff(b, ans)).sort((a, b) => a.score - b.score)[0];
  if (c.missing.length && c.extra.length) return {ok:false, why:`Не хватает: ${q(c.missing)}. Лишнее: ${q(c.extra)}.`};
  if (c.missing.length) return {ok:false, why:`Не хватает: ${q(c.missing)}.`};
  return {ok:false, why:`Лишние слова: ${q(c.extra)}.`};
}

const CYR = {a:'а',b:'б',c:'ц',č:'ч',ć:'ћ',d:'д',đ:'ђ',e:'е',f:'ф',g:'г',h:'х',i:'и',j:'ј',k:'к',l:'л',m:'м',n:'н',o:'о',p:'п',r:'р',s:'с',š:'ш',t:'т',u:'у',v:'в',z:'з',ž:'ж',dž:'џ',lj:'љ',nj:'њ'};
// ponytail: dž/lj/nj всегда диграфы — в словаре приложения нет слов вроде «nadživeti».
function toCyr(s) {
  return s.replace(/dž|lj|nj|[a-zčćđšž]/giu, m => { const r = CYR[m.toLowerCase()]; return !r ? m : m[0] === m[0].toLowerCase() ? r : r.toUpperCase(); });
}

// Самопроверка движка: откройте страницу с #selftest и смотрите консоль.
function selfTest() {
  const errors = []; let n = 0;
  const validG = (p, g) => p <= 1 ? g < 2 : p === 4 || p === 5 ? g >= 3 : g === PG[p];
  for (const v of VERBS) for (const t of TENSES) for (const f of FORMS) for (let p = 0; p < 9; p++) for (const c of v.comps) for (const g of [0,1,2,3,4]) {
    if ((t === 'fut' && v.noFut) || !validG(p, g) || (NOUN.has(p) && v.id === 'hteti')) continue;
    const cell = {t, f, p, g, c}, id = `${v.id} ${t}.${f} ${P[p]} g${g} ${c ? c.sr : '-'}`;
    const ex = {v, cell, canon: canonicalFor(v, cell), bases: basesFor(v, cell, false)}, ru = ruFor(v, cell);
    n++;
    if (!isCorrect(ex, ex.canon)) errors.push(id + ': основной вариант не принят');
    for (const a of variantsFor(v, cell)) if (!isCorrect(ex, a)) errors.push(id + ': не принят верный вариант ' + a.join(' '));
    for (const d of distractorsFor(v, cell, ex.canon, 3, false)) if (ex.canon.includes(d.t)) errors.push(id + ': лишняя плитка совпадает с ответом: ' + d.t);
    if (/undefined|null|\s{2}/.test(ru + ' ' + ex.canon.join(' '))) errors.push(id + ': битый текст: ' + ru + ' / ' + ex.canon.join(' '));
  }
  for (const it of CLIT) if (!CLITICS.has(it.k) || it.at < 1 || it.at > it.w.length || (it.alt && it.alt >= it.at)) errors.push(it.id + ': неверный пример энклитики');

  // Регрессии из ревью: свободный порядок слов и честные объяснения ошибок. Слова разделены «|».
  const V = id => VERBS.find(v => v.id === id), OV = comp('ovde', 'здесь'), KU = comp('kući', 'домой'), KNJ = comp('knjigu', 'книгу');
  const mk = (id, t, f, p, g, c) => { const v = V(id), cell = {t, f, p, g, c}; return {v, cell, canon: canonicalFor(v, cell), bases: basesFor(v, cell, false), distract: []}; };
  const orders = [
    [true, 'živeti', 'pres', 'aff', 2, 0, OV, 'on|ovde|živi'],
    [true, 'živeti', 'past', 'aff', 3, 1, OV, 'ona|je|ovde|živela'],
    [true, 'živeti', 'pres', 'q', 1, 0, OV, 'da li|ovde|živiš'],
    [true, 'raditi', 'pres', 'q', 2, 0, KOD, 'da li|on|kod kuće|radi'],
    [true, 'raditi', 'fut', 'aff', 0, 0, KOD, 'ja|ću|kod kuće|raditi'],
    [true, 'raditi', 'fut', 'aff', 0, 0, KOD, 'kod kuće|ću|raditi'],
    [true, 'biti', 'past', 'aff', 0, 0, KOD, 'kod kuće|sam|bio'],
    [false, 'biti', 'pres', 'aff', 0, 0, KOD, 'sam|kod kuće'],
    [false, 'raditi', 'fut', 'aff', 0, 0, null, 'raditi|ću'],
    [false, 'raditi', 'fut', 'aff', 0, 0, KOD, 'kod kuće|radiću'],
    [false, 'raditi', 'past', 'aff', 2, 0, null, 'on|radio|je'],
    [false, 'raditi', 'fut', 'aff', 2, 0, null, 'on|radiće'],
    [false, 'raditi', 'pres', 'q', 2, 0, null, 'on|da li|radi'],
    [false, 'raditi', 'past', 'neg', 0, 0, null, 'radio|nisam'],
    [true, 'čitati', 'past', 'aff', 7, 2, KNJ, 'dete|je|čitalo|knjigu'],
    [true, 'čitati', 'past', 'aff', 7, 2, KNJ, 'knjigu|je|dete|čitalo'],
    [false, 'čitati', 'past', 'aff', 7, 2, KNJ, 'dete|je|čitao|knjigu'],
    [false, 'čitati', 'past', 'aff', 7, 2, KNJ, 'čitalo|je|knjigu'],
    [true, 'raditi', 'past', 'aff', 8, 4, KOD, 'žene|su|radile|kod kuće'],
    [false, 'raditi', 'past', 'aff', 8, 4, KOD, 'žene|su|radili|kod kuće'],
    [true, 'raditi', 'past', 'aff', 4, 3, KOD, 'radile|smo|kod kuće'],
  ];
  for (const [want, ...o] of orders) if (isCorrect(mk(...o.slice(0, 6)), o[6].split('|')) !== want) errors.push(`регрессия: «${o[6]}» должно быть ${want ? 'верно' : 'неверно'}`);
  const why = (o, s) => diagnose(mk(...o), s.split('|')).why || '';
  if (/одним словом/.test(why(['ići', 'fut', 'q', 0, 0, KU], 'ići|ću|kući'))) errors.push('регрессия: «ići ću» в вопросе объясняется слитным написанием');
  if (/«on»/.test(why(['raditi', 'pres', 'q', 2, 0, null], 'radi'))) errors.push('регрессия: необязательное «on» названо недостающим');
  if (!/Лишн/.test(why(['raditi', 'fut', 'aff', 0, 0, KOD], 'radiću|ću|raditi|kod kuće'))) errors.push('регрессия: лишние слова не названы лишними');
  if (!/Лишн.*«ne»/.test(why(['raditi', 'past', 'neg', 0, 0, null], 'nisam|ne|radio'))) errors.push('регрессия: «nisam ne radio» — лишнее «ne»');
  if (ruFor(V('biti'), {t:'pres', f:'neg', p:0, g:0, c:KOD}) !== 'Меня нет дома.') errors.push('регрессия: «Меня нет дома»');
  if (ruFor(V('čitati'), {t:'past', f:'aff', p:7, g:2, c:KNJ}) !== 'Ребёнок читал книгу.') errors.push('регрессия: «Ребёнок читал книгу»');
  if (!/Не хватает: «dete»/.test(why(['čitati', 'past', 'aff', 7, 2, KNJ], 'čitalo|je|knjigu'))) errors.push('регрессия: без «dete» фраза неполная');
  const seenW = new Set();
  for (const it of GEN) { if (!PRON[it.n] || !PRON[it.n][it.g] || seenW.has(it.w)) errors.push('«Род»: неверный пример ' + it.w); seenW.add(it.w); }
  for (const o of OWNERS) {
    if (POSS[o].sr.length !== 6) errors.push('«Чей»: у ' + o + ' не шесть форм');
    for (const noun of NOUNS) for (const n of ['sg', 'pl']) {
      if (!noun[n]) continue;
      const tk = possTask(o, noun, n), id = `«Чей» ${o} ${noun[n]}`;
      if (!tk.canon[0] || /undefined/.test(tk.ru + tk.canon.join(' '))) errors.push(id + ': битый текст');
      if (tk.distract.length < 3) errors.push(id + ': меньше трёх лишних плиток');
      for (const d of tk.distract) if (tk.canon.includes(d.t) || !d.why) errors.push(id + ': плохая лишняя плитка ' + d.t);
      if (!diagnosePoss(tk, tk.canon).ok) errors.push(id + ': основной вариант не принят');
    }
  }
  // Уроки: что где открыто
  if (V('biti').l !== 1 || V('raditi').l !== 3 || V('hteti').l !== 4) errors.push('уроки: biti — 1, обычные глаголы — 3, hteti — 4');
  if (tensesOf(1).join() !== 'pres' || tensesOf(6).includes('fut') || !tensesOf(7).includes('fut')) errors.push('уроки: времена по урокам');
  for (const L of LESSONS) if (!L.soon && !L.tabs.length) errors.push(`урок ${L.n}: нет вкладок`);
  // Пример энклитики — не раньше урока, где открыты его время и слова.
  for (const it of CLIT) {
    const past = it.w.some(x => VERBS.some(v => v.part.includes(x.replace(/\{([^|}]*)\|[^}]*\}/, '$1').toLowerCase())));
    const need = Math.max(FUT.includes(it.k) ? TENSE_L.fut : past ? TENSE_L.past : 1, it.w.some(x => /^(imati|imao|imala|hteli|hteo)$/.test(x)) ? 4 : 1,
      it.w.some(x => /^(moja|moji|moj|njegov|naša|tvoji|tvoja|tvoj|njihova|naši|dete|žene)$/i.test(x)) ? NOUN_L : 1);
    if (it.l < need) errors.push(`уроки: пример ${it.id} должен быть не раньше урока ${need}`);
    if (LESSONS[it.l - 1].soon) errors.push(`уроки: пример ${it.id} — в неготовом уроке ${it.l}`);
  }
  // «Чей»: лишние плитки — только из открытого в уроке
  for (const L of [2, 7]) for (const o of OWNERS) for (const noun of NOUNS) for (const n of ['sg', 'pl']) {
    if (!noun[n] || !nounOpen(n, noun.g, L)) continue;
    for (let rep = 0; rep < 4; rep++) for (const d of possTask(o, noun, n, L).distract)
      if (!nounOpen(d.n, d.g, L)) errors.push(`«Чей» урок ${L}: ${o} ${noun[n]} — плитка «${d.t}» из неоткрытого`);
  }
  { const d = possTask('ja', NOUNS.find(x => x.sg === 'stan'), 'pl', 2).distract.find(x => x.t === 'moje');
    if (d && /так было бы по-русски/.test(d.why)) errors.push('регрессия: «мои квартиры» не «по-русски»'); }
  { const d = possTask('ja', NOUNS.find(x => x.sg === 'pismo'), 'sg', 2).distract.find(x => x.t === 'moja');
    if (d && !/женского рода/.test(d.why)) errors.push('регрессия: «moja» при «моё письмо» — женский род ед. ч.'); }
  // Вопросы с «li» и одной интонацией
  const liCases = [
    [true, 'hteti', 'pres', 'q', 1, 0, V('hteti').comps[0], 'hoćeš|li|kafu'],
    [true, 'biti', 'pres', 'q', 1, 0, KOD, 'jesi|li|kod kuće'],
    [true, 'raditi', 'past', 'q', 1, 0, null, 'jesi|li|radio'],
    [true, 'raditi', 'past', 'q', 2, 0, null, 'je|li|on|radio'],
    [true, 'raditi', 'fut', 'q', 1, 0, null, 'hoćeš|li|raditi'],
    [true, 'raditi', 'pres', 'q', 1, 0, KOD, 'radiš|li|kod kuće'],
    [true, 'raditi', 'pres', 'q', 1, 0, KOD, 'radiš|kod kuće'],
    [true, 'raditi', 'pres', 'q', 2, 0, null, 'on|radi'],
    [true, 'raditi', 'past', 'q', 1, 0, null, 'radio|si'],
    [false, 'raditi', 'pres', 'q', 1, 0, KOD, 'li|radiš|kod kuće'],
    [false, 'hteti', 'pres', 'q', 1, 0, V('hteti').comps[0], 'hoćeš|kafu|li'],
    [false, 'raditi', 'past', 'q', 1, 0, null, 'si|radio'],
  ];
  for (const [want, ...o] of liCases) if (isCorrect(mk(...o.slice(0, 6)), o[6].split('|')) !== want) errors.push(`регрессия «li»: «${o[6]}» должно быть ${want ? 'верно' : 'неверно'}`);
  for (const v of VERBS) for (const t of TENSES) { if (t === 'fut' && v.noFut) continue;
    for (const p of [0, 1, 2, 4, 6]) { const cell = {t, f:'q', p, g: PG[p] == null ? 0 : PG[p], c: v.comps[0] || null, li:true};
      const ex = {v, cell, canon: canonicalFor(v, cell), bases: basesFor(v, cell, false)};
      if (!isCorrect(ex, ex.canon)) errors.push(`«li»: ${v.id} ${t} ${P[p]} — основной вариант «${ex.canon.join(' ')}» не принят`); } }
  // «mi (ж)» в таблице: объяснение про «smo» называет форму этой строки
  for (let rep = 0; rep < 40; rep++) { const tb = conjTable(V('raditi'), 'past', 'aff', 0, 6), d = tb.distract.find(x => / smo$/.test(x.t));
    if (d && !d.why.includes(tb.rows[3].form)) errors.push('регрессия: «smo» — форма строки mi'); }
  // «Энклитики»: правило «всегда после первого слова» не должно работать
  if (CLIT.filter(c => c.at === 1).length / CLIT.length >= .6) errors.push('«Энклитики»: слишком много ответов «после первого слова»');
  // «hoću da» + настоящее время
  const HT = V('hteti'), DA = HT.comps.find(c => c.da === 'raditi'), DI = HT.comps.find(c => c.da === 'ići');
  const daCases = [
    [true, 'pres', 'aff', 0, 0, DA, 'hoću|da|radim'],
    [true, 'pres', 'aff', 0, 0, DA, 'hoću|raditi'],
    [true, 'pres', 'q', 1, 0, DI, 'da li|hoćeš|da|ideš'],
    [true, 'past', 'neg', 0, 0, DA, 'nisam|hteo|da|radim'],
    [true, 'pres', 'aff', 6, 3, DA, 'oni|hoće|da|rade'],
    [false, 'pres', 'aff', 0, 0, DA, 'hoću|da|raditi'],
    [false, 'pres', 'aff', 0, 0, DA, 'da|radim|hoću'],
    [false, 'pres', 'aff', 0, 0, DA, 'hoću|radim|da'],
    [false, 'pres', 'aff', 0, 0, DA, 'hoću|da|radiš'],
  ];
  for (const [want, t, f, p, g, c, str] of daCases) { const ex = mk('hteti', t, f, p, g, c); if (isCorrect(ex, str.split('|')) !== want) errors.push(`регрессия «hoću da»: «${str}» должно быть ${want ? 'верно' : 'неверно'}`); }
  if (ruFor(HT, {t:'pres', f:'aff', p:0, g:0, c:DA}) !== 'Я хочу работать.') errors.push('регрессия: «Я хочу работать»');

  for (const v of VERBS) for (const f of ['aff', 'neg']) { if (f === 'neg' && !v.presNeg) continue;

  const ttOk = (t, id) => { for (const g of ['m', 'f']) { const e = expandTask(t, g), toks = new Set([e.canon].concat(e.alts).flat().map(x => x.toLowerCase()));

  for (const [k] of NUM_KEYS) for (let rep = 0; rep < 30; rep++) ttOk(numTask(k), 'Числа ' + k);
  for (const k of QTY_KEYS) for (let rep = 0; rep < 20; rep++) ttOk(qtyTask(k), 'Количество ' + k);

}
