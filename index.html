<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Тренажёр сербского для русскоязычных: глаголы, род и «чей», падежи и фразы — ответы из плиток.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%232A45A8%22/%3E%3Ctext x=%2216%22 y=%2223%22 font-family=%22Georgia,serif%22 font-size=%2220%22 font-weight=%22700%22 fill=%22white%22 text-anchor=%22middle%22%3E%D0%A1%3C/text%3E%3C/svg%3E">
<title>Srpska matrica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@500;600&family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap">
<style>
:root{
  --paper:#F1F3F6; --panel:#FFFFFF; --ink:#172131; --muted:#5E6A7D; --line:#D6DDE6; --grid:#E6EAF0;
  --accent:#2A45A8; --accent-ink:#FFFFFF; --accent-soft:#E3E8F8;
  --ok:#23703F; --ok-soft:#E1F1E6; --bad:#B8342A; --bad-soft:#FBE6E3;
  --tile:#FFFFFF; --tile-edge:#B8C2D0; --shadow:rgba(23,33,49,.16);
  --serif:"Source Serif 4","PT Serif",Georgia,serif;
  --sans:"Source Sans 3","PT Sans",system-ui,sans-serif;
  --mono:"Source Code Pro",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F141C; --panel:#161D28; --ink:#E5E9F0; --muted:#97A3B6; --line:#2B3546; --grid:#1F2735;
    --accent:#8FA5FF; --accent-ink:#0F141C; --accent-soft:#1E2848;
    --ok:#66C48F; --ok-soft:#14301F; --bad:#F2806F; --bad-soft:#3A1D1A;
    --tile:#1C2431; --tile-edge:#3B475B; --shadow:rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F141C; --panel:#161D28; --ink:#E5E9F0; --muted:#97A3B6; --line:#2B3546; --grid:#1F2735;
  --accent:#8FA5FF; --accent-ink:#0F141C; --accent-soft:#1E2848;
  --ok:#66C48F; --ok-soft:#14301F; --bad:#F2806F; --bad-soft:#3A1D1A;
  --tile:#1C2431; --tile-edge:#3B475B; --shadow:rgba(0,0,0,.5);
  color-scheme:dark;
}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1180px;margin:0 auto;padding-inline:max(24px, env(safe-area-inset-left, 0px)) max(24px, env(safe-area-inset-right, 0px));padding-block:20px 48px}

/* Шапка: название, уроки, шестерёнка. На телефоне уроки уходят второй строкой. */
.top{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand gear" "lessons lessons";align-items:center;gap:14px 20px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.brand{grid-area:brand}
.brand .name{display:block;font:700 30px/1.05 var(--serif);letter-spacing:-.01em}
.brand .alt{display:block;margin-top:6px;font:500 13px/1.3 var(--mono);color:var(--muted)}
.lessons{grid-area:lessons;display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:thin;padding-bottom:4px}
.lessons button{flex:0 0 auto;width:168px;scroll-snap-align:start;display:grid;align-content:start;gap:2px;text-align:left;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer}
.lessons button:disabled{opacity:.5;cursor:default}
.lessons button[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.lessons .ln{font:600 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.lessons .lt{font-weight:600;line-height:1.2}
.gear{grid-area:gear;display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--muted);cursor:pointer}
.gear svg{width:22px;height:22px}

/* Меню настроек — нативный popover: закрывается касанием вне меню. */
.menu{box-sizing:border-box;position:fixed;inset:auto;top:calc(env(safe-area-inset-top, 0px) + 76px);right:max(16px, calc((100vw - 1180px) / 2 + 24px));margin:0;width:min(340px, calc(100vw - 32px));padding:16px 18px 18px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);box-shadow:0 14px 36px var(--shadow)}
.menu::backdrop{background:transparent}
.menu[hidden]{display:none}
.menu-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.menu-head h2{margin:0;font:600 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.x{width:44px;height:44px;border:0;border-radius:8px;background:none;color:var(--muted);font-size:22px;line-height:1;cursor:pointer}
.menu .row + .row{margin-top:14px}
.menu .sync{margin:16px 0 0;font-size:13px;color:var(--muted)}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;margin-top:22px;align-items:start}

.modes{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.modes::-webkit-scrollbar{display:none}
.modes button{flex:none;white-space:nowrap;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer}
.modes button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.focusbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-bottom:12px;font-size:14px;color:var(--muted)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:26px 30px 28px;display:flex;flex-direction:column;gap:20px;min-height:400px}
.lead{margin:0;color:var(--muted);font-size:15px}
.leadrow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.leadrow .link{flex:none;margin-top:-12px}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 12px/1 var(--mono);letter-spacing:.02em;padding:6px 8px;border-radius:6px;background:var(--grid);color:var(--muted)}
.chip.to{background:var(--accent-soft);color:var(--accent)}
.prompt{margin:0;font:600 clamp(23px, 5.6vw, 30px)/1.25 var(--serif);text-wrap:balance}
.trn{font:500 clamp(17px, 4.2vw, 20px)/1.3 var(--sans);color:var(--muted)}

.answer{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:64px;padding-block:6px 12px;border-bottom:2px solid var(--line)}
.answer.ok{border-bottom-color:var(--ok)}
.answer.bad{border-bottom-color:var(--bad)}
.placeholder{color:var(--muted);font-style:italic}
.punct{font:600 24px/1 var(--serif);color:var(--muted)}
.pool{display:flex;flex-wrap:wrap;gap:10px}
.tile{box-sizing:border-box;min-height:48px;font:600 clamp(18px, 4.6vw, 21px)/1 var(--serif);padding:12px 16px;background:var(--tile);border:1px solid var(--tile-edge);border-bottom-width:3px;border-radius:7px;cursor:pointer;transition:transform .08s,border-color .12s}
.tile:active:not(:disabled){transform:translateY(1px)}
.tile:disabled{cursor:default}
.tile.placed{background:var(--accent-soft);border-color:var(--accent)}
.tile.ghost{color:transparent;background:transparent;border-style:dashed;border-color:var(--line);cursor:default}
.answer.ok .tile.placed{background:var(--ok-soft);border-color:var(--ok)}
.answer.bad .tile.placed{background:var(--bad-soft);border-color:var(--bad)}

.actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.btn{min-height:46px;font-weight:600;padding:10px 18px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
.link{display:inline-flex;align-items:center;min-height:44px;background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:14px;text-align:left}

.fb{border-radius:10px;padding:14px 16px;display:grid;gap:6px;scroll-margin-bottom:110px}
.fb:focus{outline:none}
.vru{font:500 14px var(--sans);color:var(--muted);margin-left:6px}
.gloss{margin:-8px 0 0;color:var(--muted);font-size:15px}
.intro{display:grid;gap:10px;padding:14px 16px;border-radius:10px;border:1px solid var(--accent)}
.intro p{margin:0}
.btn.sm{min-height:40px;padding:6px 12px;font-size:14px}
.cslot.target{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
button.cslot{cursor:pointer;padding:0;background:none}
.num{background:var(--panel);color:var(--ink);padding:2px 5px;border-radius:4px}
.fb.ok{background:var(--ok-soft)}
.fb.bad{background:var(--bad-soft)}
.verdict{font:700 18px/1.2 var(--serif)}
.fb.ok .verdict{color:var(--ok)}
.fb.bad .verdict{color:var(--bad)}
.sent{font:600 19px/1.35 var(--serif)}
.fb s{color:var(--bad);text-decoration-thickness:2px}
.why{margin:0}
.said{margin:0;display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}
.said .prompt{margin:0}
.fb .also{color:var(--muted)}

.paradigm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:auto repeat(3,auto);grid-auto-flow:column;gap:10px 16px}
.colh{font:600 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ccell{display:grid;gap:4px;min-width:0}
.ccell .who{font:500 12px/1.2 var(--mono);color:var(--muted)}
.ccell .tile{width:100%;text-align:left}
.cslot{display:block;width:100%;height:48px;border:1.5px dashed var(--tile-edge);border-radius:7px}
.cslot.next{border-color:var(--accent);background:var(--accent-soft)}
.ccell.ok .tile.placed{background:var(--ok-soft);border-color:var(--ok)}
.ccell.bad .tile.placed{background:var(--bad-soft);border-color:var(--bad);text-decoration:line-through;text-decoration-thickness:2px}
.cnotes{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:8px;font-size:14px}
.cnotes li{display:grid;gap:2px}
.cnotes .who{font:500 12px/1.2 var(--mono);color:var(--muted)}

.slots{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:64px}
.w{font:600 clamp(22px, 5.4vw, 26px)/1.2 var(--serif)}
.slot{display:grid;place-items:center;width:44px;height:48px;border:1.5px dashed var(--tile-edge);border-radius:6px;background:none;cursor:pointer}
.slot::before{content:"+";font:600 16px/1 var(--mono);color:var(--muted)}
.ins{font:600 clamp(22px, 5.4vw, 26px)/1.2 var(--serif);padding:2px 8px;border-radius:6px}
.ins.ok{background:var(--ok-soft);color:var(--ok)}
.ins.bad{background:var(--bad-soft);color:var(--bad)}
.gap{width:4px}

.cell.static{cursor:default}
.pbar-l{margin:0 0 8px;font-size:14px}
.pbar{height:10px;border-radius:6px;background:var(--grid);overflow:hidden}
.pbar span{display:block;height:100%;background:var(--accent)}
.weak .wrow{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px;padding:6px 8px;font-size:14px}
.program{margin:0;padding-left:22px;display:grid;gap:6px;font-size:14px;color:var(--muted)}
.program .here{color:var(--ink)}
.gpick{display:grid;gap:14px}
.grow{display:grid;gap:6px}
.gtiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.gtile{text-align:center}
.gtile.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.gtile.wrong{background:var(--bad-soft);border-color:var(--bad);text-decoration:line-through;text-decoration-thickness:2px}
.ask{display:grid;gap:10px;padding:14px 16px;border-radius:10px;background:var(--accent-soft)}
.ask p{margin:0}

.side{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.panel h2,.panel summary{margin:0 0 12px;font:600 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel summary{margin:0;cursor:pointer;padding-block:16px;margin-block:-12px}
details[open] summary{margin-bottom:12px}
.hint{margin:10px 0 0;font-size:13px;color:var(--muted)}
.heat{width:100%;border-collapse:separate;border-spacing:4px;table-layout:fixed}
.heat th{font:500 11px/1.2 var(--mono);color:var(--muted);text-align:center}
.heat th[scope="row"]{text-align:right;padding-right:4px;width:84px}
.cell{display:grid;place-items:center;width:100%;aspect-ratio:1.35;border:0;border-radius:6px;background:color-mix(in srgb,var(--accent) var(--p,0%),var(--grid));font:600 13px/1 var(--mono);font-variant-numeric:tabular-nums;cursor:pointer}

.cell.sel{outline:2px solid var(--ink);outline-offset:1px}
.cell.locked{background:repeating-linear-gradient(45deg,var(--grid) 0 4px,transparent 4px 8px);color:var(--muted);font:500 11px/1.2 var(--mono);cursor:default;text-align:center}
.weak{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.weak button{width:100%;min-height:44px;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:none;border:0;border-radius:6px;padding:6px 8px;cursor:pointer;font-size:14px}
.weak .cnt{font:600 13px var(--mono);color:var(--bad)}
.weak .empty{font-size:14px;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{min-height:44px;border:0;background:none;padding:6px 12px;font-size:14px;color:var(--muted);cursor:pointer}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.sheet{font-size:14px}
.sheet p{margin:0 0 8px}
.sheet .muted{color:var(--muted)}
.conj{border-collapse:collapse;margin:4px 0 10px;font:500 14px var(--serif)}
.conj th,.conj td{padding:3px 10px 3px 0;text-align:left}
.conj thead th{font:500 11px var(--mono);color:var(--muted)}
.conj tbody th{font:500 12px var(--mono);color:var(--muted)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}

/* Наведение — только там, где есть мышь: на телефоне подсветка «залипает» после касания. */
@media (hover: hover){
  .lessons button:hover,.gear:hover,.btn:hover:not(:disabled){border-color:var(--accent)}
  .modes button:hover{color:var(--ink)}
  .tile:hover:not(:disabled){transform:translateY(-1px);border-color:var(--accent)}
  .slot:hover{border-color:var(--accent);background:var(--accent-soft)}
  .weak button:hover{background:var(--grid)}
}

@media (max-width:920px){.layout{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .lessons button{width:150px;padding:8px 10px}
}
@media (max-width:700px){
  /* Вкладки сеткой в три колонки: полоса с прокруткой прятала часть вкладок за краем. */
  .modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;border-bottom:0;overflow:visible}
  .modes button{margin:0;padding:10px 4px;border:1px solid var(--line);border-radius:8px;background:var(--panel);text-align:center;white-space:normal;font-size:14px;hyphens:auto;overflow-wrap:anywhere}
  .modes button[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .lessons .lt{font-size:13px}
  .menu{top:calc(env(safe-area-inset-top, 0px) + 64px)}
}
@media (max-width:560px){
  .app{padding-inline:max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));padding-block:14px 32px}
  .brand .name{font-size:24px}
  .brand .alt{font-size:12px}
  .lessons button{padding:6px 8px}
  .lessons .ln{font-size:11px}
  .layout{margin-top:14px;gap:18px}
  .card{padding:18px 16px 20px;gap:16px;min-height:0}
  /* Вкладки сеткой 2×2: полоса с прокруткой прятала «Энклитики» за краем экрана. */
  .actions .btn{flex:1 1 auto}
  /* Строка ответа сразу высотой в две строки плиток — ничего не прыгает, когда ответ переносится. */
  .answer{min-height:108px;align-content:flex-start}
  /* Кнопки прилипают к низу экрана: «Проверить» и «Дальше» всегда под большим пальцем. */
  .card > .actions{position:sticky;bottom:0;z-index:2;margin-inline:-16px;margin-bottom:-20px;padding:10px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    background:color-mix(in srgb, var(--panel) 94%, transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--line);border-radius:0 0 12px 12px}
  .paradigm{gap:8px 10px}
  .tile{padding:10px 12px;min-height:44px}
  .cslot{height:44px}
  .heat th[scope="row"]{width:72px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="app" id="app" lang="ru">
  <header class="top">
    <div class="brand">
      <span class="name" lang="sr-Latn">Srpska matrica</span>
      <span class="alt"><span lang="sr-Cyrl">Српска матрица</span><span class="sub"> · тренажёр сербского</span></span>
    </div>
    <nav class="lessons" id="lessons" aria-label="Урок"></nav>
    <button type="button" class="gear" popovertarget="settings" aria-label="Настройки" title="Настройки">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <div id="settings" class="menu" popover>
    <div class="menu-head"><h2>Настройки</h2><button type="button" class="x" popovertarget="settings" popovertargetaction="hide" aria-label="Закрыть">×</button></div>
    <div class="row"><span>Род для «я»</span><span class="seg"><button type="button" data-gender="m">мужской</button><button type="button" data-gender="f">женский</button></span></div>
    <div class="row"><span>Письмо</span><span class="seg"><button type="button" data-script="lat">latinica</button><button type="button" data-script="cyr">ћирилица</button></span></div>
    <div class="row" id="resetrow"><button type="button" class="link" id="reset">Сбросить прогресс</button></div>
    <p class="sync" id="sync"></p>
  </div>

  <main class="layout">
    <section>
      <div class="modes" id="modes" role="tablist" aria-label="Упражнение"></div>
      <div id="focusbar"></div>
      <article class="card" id="card" role="tabpanel"></article>
      <p class="sr" id="live" aria-live="polite"></p>
    </section>
    <aside class="side">
      <section class="panel">
        <h2 id="heatTitle">Матрица</h2>
        <div id="heat"></div>
        <p class="hint" id="heatHint"></p>
      </section>
      <section class="panel">
        <h2>Слабые места</h2>
        <ol class="weak" id="weak"></ol>
      </section>
      <details class="panel" open>
        <summary>Шпаргалка урока</summary>
        <div class="sheet" id="sheet"></div>
      </details>

  const ruNoun = noun.ru[n === 'pl' ? 1 : 0];
  const ruP = typeof O.ru === 'string' ? O.ru : O.ru[n === 'pl' ? 3 : GI[noun.ruG]];
  const canon = [right, word], req = [], opt = [], NUM = {sg:'единственного', pl:'множественного'};
  const add = (list, t, why, rn, rg) => {
    if (!nounOpen(rn, rg, lesson) || canon.includes(t) || req.concat(opt).some(d => d.t === t)) return;
    list.push({t, why, n: rn, g: rg});
  };
  const fixed = typeof O.ru === 'string';   // «его, её, их» по-русски не меняются
  if (fixed) add(req, O.sr[0], `По-русски ${OWNER_RU[owner]} не меняется, а по-сербски согласуется со словом: «${right} ${word}».`, 'sg', 'm');
  if (noun.ruG !== g) {   // согласовали по русскому роду: «моя собака» → «moja pas», «его фамилия» → «njegova prezime»
    const x = O.sr[possIdx(n, noun.ruG)];
    add(req, x, n === 'pl'
      ? `«${x}» — форма ${G_GEN[noun.ruG]} рода, а «${word}» — ${G_GEN[g]}: «${right} ${word}».`
      : fixed ? `«${x}» — это по русскому роду: «${noun.ru[0]}» ${G_GEN[noun.ruG]} рода. А «${noun.sg}» — ${G_GEN[g]}, поэтому «${right}».`
      : `«${x}» — так было бы по-русски: «${noun.ru[0]}» ${G_GEN[noun.ruG]} рода. А «${noun.sg}» — ${G_GEN[g]}, поэтому «${right}».`, n, noun.ruG);
  }
  const mix = OWNER_MIX[owner];
  add(opt, POSS[mix].sr[i], `«${POSS[mix].sr[i]}» — это ${OWNER_RU[mix]}, а здесь ${OWNER_RU[owner]}.`, n, g);
  const sgFirst = n === 'sg' ? ['sg', 'pl'] : ['pl', 'sg'];
  for (const nn of sgFirst) for (const h of ['m', 'f', 'n']) {
    if (nn === n && h === g) continue;
    const x = O.sr[possIdx(nn, h)];
    add(opt, x, nn === n ? `«${x}» — ${G_GEN[h]} рода, а «${noun.sg}» — ${G_GEN[g]}.` : `«${x}» — форма ${NUM[nn]} числа, а «${word}» — ${NUM[n]}.`, nn, h);
  }
  const other = n === 'pl' ? 'sg' : 'pl';
  if (noun[other]) add(opt, noun[other], `«${noun[other]}» — ${other === 'pl' ? 'множественное' : 'единственное'} число, а здесь «${ruNoun}».`, other, g);
  return {canon, ru: `${ruP} ${ruNoun}`, distract: req.concat(shuffle(opt).slice(0, Math.max(0, 4 - req.length)))};
}
function diagnosePoss(ex, ans) {
  const low = ans.map(x => x.toLowerCase()), can = ex.canon.map(x => x.toLowerCase());
  if (low.join(' ') === can.join(' ')) return {ok:true};
  for (const d of ex.distract) if (low.includes(d.t.toLowerCase())) return {ok:false, why:d.why};
  if (low.length === 2 && low[0] === can[1] && low[1] === can[0]) return {ok:false, why:`Притяжательное ставится перед словом: «${ex.canon.join(' ')}».`};
  const miss = ex.canon.filter(x => !low.includes(x.toLowerCase()));
  return {ok:false, why: miss.length ? `Не хватает: ${miss.map(x => '«' + x + '»').join(', ')}.` : 'Лишние слова.'};
}

  morati: [['morem', '«morati» спрягается на «-am»: «moram».'], ['moru', '«oni» от «morati» — «moraju».']],
  kupovati: [['kupovam', '«kupovati» спрягается с «-uj-»: «kupujem».'], ['kupuvaju', '«oni» от «kupovati» — «kupuju».']],
  dolaziti: [['dolazu', '«oni» у глаголов на «-im» оканчивается на «-e»: «dolaze».'], ['dolaziju', '«oni» у глаголов на «-im» оканчивается на «-e»: «dolaze».']],
  gledati: [['gledu', '«oni» у глаголов на «-am» оканчивается на «-aju»: «gledaju».'], ['gledaje', '«oni» у глаголов на «-am» оканчивается на «-aju»: «gledaju».']],
  uzimati: [['uzimu', '«oni» от «uzimati» — «uzimaju».'], ['uzmem', '«uzmem» — совершенный вид («возьму» после «da»). «Беру» — «uzimam».']],
  videti: [['videm', '«videti» спрягается на «-im»: «vidim».'], ['videju', '«oni» от «videti» — «vide».']],
  'čekati': [['čeku', '«oni» у глаголов на «-am» оканчивается на «-aju»: «čekaju».'], ['čekaje', '«oni» у глаголов на «-am» оканчивается на «-aju»: «čekaju».']],
  pitati: [['pitu', '«oni» у глаголов на «-am» оканчивается на «-aju»: «pitaju».'], ['pitaje', '«oni» у глаголов на «-am» оканчивается на «-aju»: «pitaju».']],
  davati: [['davam', '«davati» в настоящем — «dajem, daješ…».'], ['davaju', '«oni» от «davati» — «daju».']],
  kazati: [['kazam', '«z» переходит в «ž»: «kažem».'], ['kazu', '«oni» от «kazati» — «kažu».']],

// Ошибки в отрицании у глаголов со слитной формой.
const NEG_ERR = {
  biti: [['nijesam', '«nijesam» — иекавская форма. По-сербски (экавски) — «nisam».']],
  imati: [['neimam', 'Отрицание от «imati» — «nemam», без «i».']],
  hteti: [['nehoću', 'Отрицание от «hteti» — отдельная форма «neću».']],

// Строки ja, ti, 3-е ед., mi, vi, 3-е мн. В прошедшем род виден, поэтому 3-е лицо меняется: on / ona / ono и oni / one,
// а у mi и vi иногда женский род. Средний род мн. ч. («ona su») редок — только в разделе «Род».
function conjRows(t, userG) {
  const s3 = t === 'past' ? pick([2, 3, 9]) : 2, p3 = t === 'past' ? pick([6, 6, 10]) : 6;
  return [0, 1, s3, 4, 5, p3].map(p => ({p, g: (p === 4 || p === 5) && t === 'past' && Math.random() < .3 ? 4 : gFor(p, userG)}));
}
function conjTable(v, t, f, userG, lesson) {
  const rows = conjRows(t, userG).map(({p, g}) => {
    const fo = forms(v, {t, f, p, g});
    const form = t === 'pres' ? (f === 'neg' ? fo.NV.join(' ') : fo.V)
      : t === 'past' ? (f === 'neg' ? `${fo.NA} ${fo.L}` : `${fo.L} ${fo.A}`)
      : (f === 'neg' ? `${fo.NF} ${fo.I}` : fo.FM.join(' '));
    return {p, g, form};
  });
  const have = new Set(rows.map(r => r.form.toLowerCase())), out = [];
  // row — строка, для которой придумана ошибка; объяснение показывается, только если плитку положили туда.
  const add = (x, why, row = 0) => { const k = x.toLowerCase(); if (!have.has(k) && !out.some(d => d.t.toLowerCase() === k)) out.push({t:x, why, row}); };
  const ja = rows[0], fo = forms(v, {t, f, p:0, g:ja.g}), other = v.part[1 - ja.g], otherG = ja.g ? 'мужской' : 'женский';
  if (t === 'pres' && f === 'aff') { for (const [x, why] of PRES_ERR[v.id] || []) add(x, why, /«oni»/.test(why) ? 5 : 0); add(`ne ${fo.V}`, v.presNeg ? `Такой формы нет: отрицание пишется слитно — «${fo.NV[0]}». А здесь нужно утверждение.` : `«ne ${fo.V}» — это отрицание.`); }
  if (t === 'pres' && f === 'neg') { add(`ne ${fo.V}`, `Отрицание пишется слитно: не «ne ${fo.V}», а «${fo.NV[0]}».`); for (const [x, why] of NEG_ERR[v.id] || []) add(x, why); }
  if (t === 'past' && f === 'aff') {
    add(`${fo.A} ${fo.L}`, `«${fo.A}» — энклитика: с неё фраза не начинается. Правильно: «${fo.L} ${fo.A}».`);
    add(`${other} ${fo.A}`, `«${other}» — ${otherG} род.`);
    add(`${v.part[0]} smo`, `С «smo» нужна форма множественного числа: «${rows[3].form}».`, 3);
  }
  if (t === 'past') {   // ошибки рода в 3-м лице
    const s3 = rows[2], p3 = rows[5], G = ['мужского', 'женского', 'среднего'];
    const third = (L, sing) => f === 'neg' ? `${sing ? 'nije' : 'nisu'} ${L}` : `${L} ${sing ? 'je' : 'su'}`;
    const a3 = s3.g === 0 ? 1 : 0;
    add(third(v.part[a3], true), `«${v.part[a3]}» — ${a3 ? 'женский' : 'мужской'} род, а «${P[s3.p]}» — ${G[s3.g]} рода.`, 2);
    add(third(v.part[p3.g === 3 ? 4 : 3], false), p3.g === 3 ? `«${v.part[4]}» — женский род, а «oni» — мужчины или смешанная группа.` : `«${v.part[3]}» — мужской род, а «one» — женский.`, 5);
  }
  if (t === 'past' && f === 'neg') { add(`ne ${fo.A} ${fo.L}`, `Отрицание пишется слитно: «${fo.NA}», а не «ne ${fo.A}».`); add(`${fo.NA} ${other}`, `«${other}» — ${otherG} род.`); }
  if (t === 'fut' && f === 'aff') {
    if (fo.FM.length === 1) {
      add(`${v.inf} ${fo.F}`, `Когда глагол стоит первым, будущее пишется одним словом: «${fo.FM[0]}».`);
      if (!v.inf.endsWith('eti')) add(`${v.inf.slice(0, -1)} ${fo.F}`, `«${v.inf.slice(0, -1)} ${fo.F}» — так пишут по-хорватски. По-сербски — «${fo.FM[0]}».`);
    } else add(`${v.inf}${fo.F}`, `У глаголов на «-ći» будущее пишется раздельно: «${fo.FM.join(' ')}».`);
  }
  if (t === 'fut' && f === 'neg') { add(`ne ${fo.F} ${fo.I}`, `Отрицание пишется слитно: «${fo.NF}», а не «ne ${fo.F}».`); add(`${fo.NF} ${fo.L}`, `После «${fo.NF}» нужен инфинитив: «${fo.NF} ${fo.I}».`); }
  if (t !== 'pres' && !v.pf) add(fo.V, `«${fo.V}» — это настоящее время.`); else if (t === 'pres' && lesson >= TENSE_L.past) add(`${fo.L} ${fo.A}`, `«${fo.L} ${fo.A}» — это прошедшее время.`);
  const pv = v.pair && lesson >= TENSE_L.past && VERBS.find(x => x.id === v.pair);
  if (pv && t === 'past' && f === 'aff') add(`${pv.part[ja.g]} ${fo.A}`, `«${pv.part[ja.g]}» — это «${pv.ru.past[RU_PAST[ja.g]]}». «${v.ru.past[RU_PAST[ja.g]]}» — «${fo.L}».`);
  if (v.pf && t === 'fut' && f === 'aff') add(fo.V, `«${fo.V}» одно не значит «${v.ru.fut[0]}»: будущее — «${fo.FM.join(' ')}».`);
  if (pv && pv.pf && t === 'pres' && f === 'aff') add(pv.pres[0], `«${pv.pres[0]}» — совершенный вид: одно, без «da», не употребляется. «${v.ru.pres[0]}» — «${fo.V}».`);
  return {rows, distract: shuffle(out).slice(0, 3)};
}

// Род причастия по лицу. «ti» получает случайный род — русская фраза его показывает; «mi», «vi», «oni» — мужской
// (так переводят, когда пол группы неизвестен).
const PG = [null, null, 0, 1, 3, 3, 3, 2, 4, 2, 4];
function gFor(p, userG) { return p === 0 ? userG : p === 1 ? rnd(2) : PG[p]; }
// «У тебя была собака?» не показывает род — принимаем оба.
function ambiguousG(v, cell) { return cell.p === 1 && cell.t === 'past' && v.ruSpecial === 'imati'; }

function forms(v, cell) {
  const i = cell.p, k = CONJ[i], V = v.pres[k];
  return {
    P: P[i], V, NV: v.presNeg ? [v.presNeg[k]] : ['ne', V],
    A: AUX[i], NA: NAUX[i], F: FUT[i], NF: NFUT[i], L: v.part[cell.g], I: v.inf,
    FM: v.inf.endsWith('ći') ? [v.inf, FUT[i]] : [(v.futStem || v.inf.slice(0, -2)) + FUT[i]],   // radiću, ješću, но ići ću
  };
}

// Дополнение как список плиток: «kod kuće» — одна плитка; «da radim» — две, и глагол после «da» — в лице подлежащего.
function compTokens(cell) {
  const c = cell.c;
  if (!c) return [];
  if (c.cl) return c.tail ? [c.tail] : [];   // само местоимение ставит placeObj
  return c.da ? ['da', VERBS.find(x => x.id === c.da).pres[CONJ[cell.p]]] : c.byG ? [c.byG[cell.g]] : [c.sr];
}

// Два порядка: без местоимения и с ним. Энклитика всегда на втором месте.
function cores(v, cell) {
  const f = forms(v, cell), p = f.P, m = cell.f, k = CONJ[cell.p];
  if (m === 'q' && cell.li) {   // вопрос с «li» вместо «da li»
    const head = cell.t === 'past' ? JES[k] : cell.t === 'fut' ? HOC[k] : v.presClitic ? JES[k] : f.V;
    const tail = cell.t === 'past' ? [f.L] : cell.t === 'fut' ? [f.I] : [];
    return {noP:[head, 'li', ...tail], withP:[head, 'li', p, ...tail]};
  }
  if (cell.t === 'pres') {
    if (m === 'aff') return {noP:[f.V], withP:[p, f.V]};
    if (m === 'q') return {noP:['da li', f.V], withP: v.presClitic ? ['da li', f.V, p] : ['da li', p, f.V]};
    return {noP:f.NV, withP:[p, ...f.NV]};
  }
  if (cell.t === 'past') {
    if (m === 'aff') return {noP:[f.L, f.A], withP:[p, f.A, f.L]};
    if (m === 'q') return {noP:['da li', f.A, f.L], withP:['da li', f.A, p, f.L]};
    return {noP:[f.NA, f.L], withP:[p, f.NA, f.L]};
  }
  if (m === 'aff') return {noP:f.FM, withP:[p, f.F, f.I]};
  if (m === 'q') return {noP:['da li', f.F, f.I], withP:['da li', f.F, p, f.I]};
  return {noP:[f.NF, f.I], withP:[p, f.NF, f.I]};
}

// Типичные верные порядки — для самопроверки (проверка ответа идёт по правилам, см. orderError).
function variantsFor(v, cell) {
  const {noP, withP} = cores(v, cell), C = compTokens(cell), out = [];
  if (NOUN.has(cell.p)) return [placeObj([...withP, ...C], cell)];
  const add = t => { if (!cliticFirst(t)) out.push(placeObj(t, cell)); };
  if (!C.length) { add(noP); add(withP); }
  else {
    add([...noP, ...C]); add([...withP, ...C]);
    if (cell.f !== 'q' && !cell.c.da) add([...C, ...withP.slice(1)]);   // Kod kuće sam bio. Srpski ne govorim.
  }
  return out;
}

// Другие верные варианты, которые должны собираться из плиток и показываться в разборе:
// вопрос с «da li» и с «li» («Da li su oni…?» / «Jesu li oni…?»); с местоимением («Kod kuće si» / «Ti si kod kuće»).
function altCanons(v, cell) {
  const main = canonicalFor(v, cell), out = [];
  const add = a => { if (!cliticFirst(a) && !eqT(a, main) && !out.some(x => eqT(x, a))) out.push(a); };
  if (cell.f === 'q') add(canonicalFor(v, Object.assign({}, cell, {li: !cell.li})));
  else if (!NOUN.has(cell.p)) add(placeObj([...cores(v, cell).withP, ...compTokens(cell)], cell));
  return out;
}
// Плитки задания: верный ответ, недостающие плитки других верных вариантов, лишние. Лишняя, совпавшая с плиткой
// верного варианта, выбрасывается — она часть правильного ответа.
function tilesFor(canon, alts, distract) {
  const out = canon.slice(), low = () => out.map(x => x.toLowerCase());
  for (const a of alts) { const have = low(); for (const x of a) { const i = have.indexOf(x.toLowerCase()); if (i >= 0) have.splice(i, 1); else out.push(x); } }
  const ok = new Set(low());
  return {tiles: out.concat(distract.filter(d => !ok.has(d.t.toLowerCase())).map(d => d.t)), distract: distract.filter(d => !ok.has(d.t.toLowerCase()))};
}
// Основной вариант: «я/ты/мы/вы» без местоимения, «он/она/они» — с ним.
function canonicalFor(v, cell) {
  const {noP, withP} = cores(v, cell), C = compTokens(cell);
  let t = [...(THIRD.has(cell.p) ? withP : noP), ...C];
  if (cliticFirst(t)) t = [...C, ...withP.slice(1)];   // sam kod kuće → Kod kuće sam
  return placeObj(t, cell);
}

// Наборы слов верного ответа (местоимение необязательно). Порядок внутри набора свободный — его проверяет orderError.
function basesFor(v, cell, genderFree) {
  const gs = (genderFree || ambiguousG(v, cell)) && cell.g < 2 ? [0, 1]
    : (cell.p === 4 || cell.p === 5) && cell.g >= 3 ? [3, 4]   // «мы/вы работали»: русский не показывает род группы
    : [cell.g];

  // «Hoću raditi» (инфинитив) — тоже правильно, хотя в Сербии чаще «hoću da radim»; основным вариантом остаётся «da».
  const Cinf = cell.c && cell.c.da ? [VERBS.find(x => x.id === cell.c.da).inf] : null;

  return out.filter(b => { const k = b.map(x => x.toLowerCase()).sort().join('|'); if (seen.has(k)) return false; seen.add(k); return true; });

function ruFor(v, cell) {
  const i = cell.p, k = CONJ[i], t = cell.t, m = cell.f, co = cell.c;
  let s;
  if (v.ruSpecial === 'imati') {
    const u = 'у ' + RU_GEN[i], was = co.g === 'f' ? 'была' : co.g === 'n' ? 'было' : 'был';
    if (t === 'pres') s = m === 'neg' ? `${u} нет ${co.gen}` : `${u} есть ${co.ru}`;
    else if (t === 'past') s = m === 'neg' ? `${u} не было ${co.gen}` : `${u} ${was} ${co.ru}`;
    else s = m === 'neg' ? `${u} не будет ${co.gen}` : `${u} будет ${co.ru}`;
  } else if (v.ruSpecial === 'morati') {   // «Я должен работать», «Мне не нужно…», «Мне пришлось…», «Мне придётся…»
    const pl = [4, 5, 6, 8, 10].includes(i), g = pl ? 3 : cell.g, must = pl ? 'должны' : g === 1 ? 'должна' : 'должен';
    const cr = m === 'neg' && co.gen ? co.gen : co.ru;   // «мне не нужно покупать», а не «купить»
    s = t === 'pres' ? (m === 'neg' ? `${RU_DAT[i]} не нужно ${cr}` : `${RU_P[i]} ${must} ${cr}`)
      : `${RU_DAT[i]} ${m === 'neg' ? 'не ' : ''}${t === 'past' ? 'пришлось' : 'придётся'} ${cr}`;
  } else if (v.id === 'biti' && t === 'pres' && m === 'neg') {
    const cru = co.ruByG ? co.ruByG[cell.g] : co.ru;
    s = co.noNet ? `${RU_P[i]} не ${cru}` : `${RU_NET[i]} нет ${cru}`;   // «Меня нет дома», но «Я не из России»
  } else {
    let verb;
    if (t === 'pres') verb = v.ru.pres ? v.ru.pres[k] : '';
    else if (t === 'past') verb = (m === 'neg' && v.ru.pastNeg ? v.ru.pastNeg : v.ru.past)[RU_PAST[cell.g]];   // «не ходил», а не «не шёл»
    else verb = v.ru.fut ? v.ru.fut[k] : RU_BUD[i] + ' ' + v.ru.inf;
    if (m === 'neg') verb = ('не ' + verb).trim();
    s = [RU_P[i], verb, co ? (m === 'neg' && co.gen ? co.gen : co.ruByG ? co.ruByG[cell.g] : co.ru) : ''].filter(Boolean).join(' ');   // не хотел пива
  }

// Слово, которое меняется по лицам в этой клетке.
function personToken(v, cell, j) {
  const f = forms(v, Object.assign({}, cell, {p:j})), m = cell.f;
  if (cell.t === 'pres') return m === 'neg' ? f.NV[f.NV.length - 1] : f.V;
  if (m === 'q' && cell.li) return cell.t === 'past' || (cell.t === 'pres' && v.presClitic) ? JES[CONJ[j]] : cell.t === 'fut' ? HOC[CONJ[j]] : f.V;
  if (cell.t === 'past') return m === 'neg' ? f.NA : f.A;
  if (m === 'aff') return THIRD.has(cell.p) ? f.F : f.FM[f.FM.length - 1];
  return m === 'neg' ? f.NF : f.F;
}

// Лишние плитки = типичные ошибки русскоязычных. why — что объяснить, если её выбрали.
function distractorsFor(v, cell, canon, lesson, genderFree) {
  const have = new Set(canon.map(x => x.toLowerCase())), req = [], opt = [];
  const add = (list, t, why) => {
    const k = t.toLowerCase();
    if (have.has(k) || req.concat(opt).some(d => d.t.toLowerCase() === k)) return false;
    list.push({t, why}); return true;
  };
  const f = forms(v, cell), t = cell.t, m = cell.f;
  if (m === 'neg') {
    const calque = (x, right) => {
      add(req, 'ne', `Здесь отрицание пишется слитно: не «ne ${x}», а «${right}».`);
      add(req, x, `Здесь нужна отрицательная форма «${right}», а не «${x}».`);
    };
    if (t === 'past') calque(f.A, f.NA);
    else if (t === 'fut') calque(f.F, f.NF);
    else if (v.presNeg) calque(f.V, f.NV[0]);
  }
  if (t === 'fut' && m === 'aff' && !THIRD.has(cell.p) && f.FM.length === 1) { add(req, f.F, null); add(req, f.I, null); }
  if (cell.c && cell.c.da) {   // «hoću da radiš» — после «da» глагол в том же лице, что и «hoću»
    const v2 = VERBS.find(x => x.id === cell.c.da), mine2 = v2.pres[CONJ[cell.p]];
    const x = v2.pres.find(y => y !== mine2 && y !== f.V);
    add(req, x, `«${v.pres[CONJ[cell.p]]} da ${x}» — это «…, чтобы кто-то другой…». О себе — то же лицо: «da ${mine2}».`);
  }
  const mine = personToken(v, cell, cell.p);
  let persons = 0;
  for (const j of shuffle([0,1,2,4,5,6])) {
    const x = personToken(v, cell, j);
    if (x === mine) continue;
    const who = P.slice(0, 7).filter((_, q) => personToken(v, cell, q) === x).join(' / ');
    if (add(opt, x, `«${x}» — это форма для «${who}» (${[...new Set(P.slice(0, 7).filter((_, q) => personToken(v, cell, q) === x).map(q => RU_P[q]))].join(' / ')}).`) && ++persons === 2) break;
  }
  if (t === 'past' && !genderFree && !ambiguousG(v, cell)) {
    const L = v.part, g = cell.g;
    if (cell.p === 7) add(opt, L[0], `«${L[0]}» — мужской род, а «dete» — среднего, хотя «ребёнок» мужского.`);
    else if (cell.p === 8) add(opt, L[3], `«${L[3]}» — мужской род, а «žene» — женского.`);
    else if (g >= 3) add(opt, L[0], `«${L[0]}» — единственное число, а здесь множественное.`);
    else add(opt, L[1 - g], `«${L[1 - g]}» — ${g === 0 ? 'женский' : 'мужской'} род.`);
  }
  if (t !== 'pres' && !v.pf) add(opt, f.V, `«${f.V}» — это настоящее время.`);   // у совершенного вида настоящего одного нет
  else if (t === 'pres' && lesson >= TENSE_L.past) add(opt, v.part[cell.g], `«${v.part[cell.g]}» — это прошедшее время.`);
  if (cell.c && cell.c.gx && lesson >= 8) cell.c.gx.forEach(([x, why], i) => add(i ? opt : req, x, why));   // «iz Moskvi» — с урока падежей
  if (cell.c && cell.c.byG && cell.p !== 4 && cell.p !== 5) { const og = [1, 0, null, 4, 3][cell.g], x = cell.c.byG[og];
    if (x) add(req, x, `«${x}» — ${og === 1 || og === 4 ? 'о женщинах' : 'о мужчинах'}${og < 2 ? '' : ' (мн. ч.)'}. Здесь — «${cell.c.byG[cell.g]}».`.replace('о женщинах. Здесь', 'о женщине. Здесь').replace('о мужчинах. Здесь', 'о мужчине. Здесь')); }
  if (cell.c && cell.c.cl) { const c = cell.c, other = c.obj === 'acc' ? 'dat' : 'acc', x = OBJ[other][c.op], shown = c.cl === 'je' && canon.includes('ju') ? 'ju' : c.cl;
    if (!P.includes(x) && x !== 'je') add(req, x, `«${x}» — «${OBJ_RU[other][c.op]}» (${other === 'dat' ? 'кому?' : 'кого?'}). Здесь «${OBJ_RU[c.obj][c.op]}» — «${shown}».`);
    if (c.cl === 'je' && !canon.includes('ju')) add(opt, 'ju', '«ju» ставится только перед «je» (есть): «video ju je». Здесь — «je».');
    for (const q of shuffle([0, 1, 2, 3, 4, 5, 6].filter(q => q !== c.op && !OBJ_BAN(cell.p).includes(q))).slice(0, 2)) {
      const y = OBJ[c.obj][q]; if (!P.includes(y) && y !== 'je') { add(opt, y, `«${y}» — это «${OBJ_RU[c.obj][q]}».`); break; } } }
  const pv = v.pair && lesson >= TENSE_L.past && VERBS.find(x => x.id === v.pair), ruPast = x => x.ru.past[RU_PAST[cell.g]];
  if (pv && t === 'past' && m === 'aff' && !genderFree) add(opt, pv.part[cell.g], `«${pv.part[cell.g]}» — это «${ruPast(pv)}». «${ruPast(v)}» — «${f.L}».`);
  if (pv && t === 'pres' && pv.pf && pv.pres[CONJ[cell.p]] !== 'da') add(opt, pv.pres[CONJ[cell.p]], `«${pv.pres[CONJ[cell.p]]}» — совершенный вид: одно, без «da», не употребляется. «${v.ru.pres[CONJ[cell.p]]}» — «${f.V}».`);
  if (v.pf && t === 'fut' && m === 'aff') add(opt, v.pres[CONJ[cell.p]], `«${v.pres[CONJ[cell.p]]}» одно не значит «${v.ru.fut[CONJ[cell.p]]}»: будущее — «${f.FM.join(' ')}».`);
  if (v.ijek && t === 'past' && cell.g < 2 && v.ijek[cell.g] && lesson >= TENSE_L.past) add(opt, v.ijek[cell.g], `«${v.ijek[cell.g]}» — иекавская форма. По-сербски (экавски) — «${v.part[cell.g]}».`);
  if (m === 'q' && cell.li) add(opt, 'da', '«da li» — одно целое. С «li» после глагола «da» не нужно.');
  if (m === 'neg') add(opt, 'da li', '«da li» делает вопрос, а здесь отрицание.');
  else add(opt, 'ne', m === 'q' ? '«ne» добавляет отрицание, а нужен просто вопрос.' : '«ne» — это отрицание.');
  const max = canon.length >= 4 ? 3 : 4;
  return req.concat(shuffle(opt).slice(0, Math.max(0, max - req.length)));
}

// Порядок слов в сербском свободный, но с жёсткими правилами. null — порядок верный.
function orderError(low, v, cell) {
  const f = forms(v, cell), lc = x => x.toLowerCase();
  if (low.indexOf('da li') > 0) return '«da li» ставится в начало вопроса.';
  const oc = cell.c && cell.c.cl ? cell.c : null;
  if (oc) {   // группа энклитик: li → вспомогательные (кроме je) → местоимение → je
    const head = (x, i) => i === 0 && x === 'je' && low[1] === 'li';   // «Je li…?» — не энклитика
    const obj = ['ju', oc.cl].find(x => low.some((y, i) => y === x && !head(y, i))) || oc.cl, oi = low.findIndex((x, i) => x === obj && !head(x, i));
    if (oi === 0) return `«${obj}» — краткая форма: с неё фраза не начинается. Выделить в начале можно полной: «${oc.full}».`;
    if (obj === 'je' && /(^| )je je( |$)/.test(low.join(' '))) return '«je» (её) рядом с «je» (есть) становится «ju»: «ju je».';
    const afterDa = oi > 0 && low[oi - 1] === 'da';   // «On će da ga vidi» — местоимение после «da»
    if (oi > 0 && !afterDa) {
      const start = low[0] === 'ne' ? 2 : 1, grp = [], isCl = (x, i) => (CLITICS.has(x) || x === obj) && !head(x, i);
      for (let j = start; j < low.length && isCl(low[j], j); j++) grp.push(low[j]);
      const rank = x => x === 'li' ? 0 : x === obj ? 2 : x === 'je' ? 3 : 1, all = low.filter(isCl);
      if (!grp.includes(obj) || all.length > grp.length)
        return `Энклитики стоят вместе, одной группой сразу после «${low.slice(0, start).join(' ')}»: «${all.slice().sort((a, b) => rank(a) - rank(b)).join(' ')}».`;
      for (let q = 1; q < grp.length; q++) if (rank(grp[q]) < rank(grp[q - 1]))
        return grp[q - 1] === 'je' ? `«je» стоит в конце группы энклитик: «${obj} je».` : `В группе энклитик местоимение идёт после «${grp[q]}»: «${grp[q]} ${obj}».`;
    }
    const di = low.indexOf('da');   // «ću da + настоящее»: «da» — сразу после «ću» (или «hoćeš li»)
    if (di > 0 && !cell.c.da && !['li', ...FUT, ...NFUT].includes(low[di - 1])) return '«da» идёт сразу после «ću»: «ću da vidim».';
  }
  const objT = cell.c && cell.c.cl ? [cell.c.cl, 'ju'] : [];   // краткое местоимение — тоже в группе энклитик
  const ci = low.findIndex((x, i) => (CLITICS.has(x) || objT.includes(x)) && !(i === 0 && x === 'je' && low[1] === 'li'));   // «Je li…?» — устойчивое начало вопроса
  if (ci === 0) return `«${low[0]}» — энклитика: с неё фраза не начинается, её место второе.`;
  if (ci > (low[0] === 'ne' ? 2 : 1)) return `Энклитика «${low[ci]}» стоит после первого слова или первого сочетания («da li», «kod kuće», «ne» + глагол), а не дальше.`;
  if (f.FM.length === 1) {   // у глаголов на -ći будущее всегда раздельное
    if (low.indexOf(lc(f.FM[0])) > 0) return `«${f.FM[0]}» одним словом бывает только в начале фразы. После другого слова — раздельно: «${f.F} ${f.I}».`;
    if (low[0] === lc(f.I) && FUT.includes(low[1])) return `Когда глагол стоит первым, будущее пишется одним словом: «${f.FM[0]}».`;
  }
  const n = low.indexOf('ne');
  if (n !== -1 && low[n + 1] !== lc(f.V)) return '«ne» ставится прямо перед глаголом.';
  const di = low.indexOf('da');
  if (di !== -1 && cell.c && cell.c.da) {   // «Hoću da radim»: «da» — сразу перед вторым глаголом и после формы «hteti»
    const v2 = compTokens(cell)[1];
    if (low[di + 1] !== lc(v2)) return `После «da» сразу идёт второй глагол: «da ${v2}».`;
    const main = low.findIndex(x => v.pres.includes(x) || (v.presNeg || []).includes(x) || v.part.includes(x) || x === lc(v.inf) || x === lc(f.FM[0]));   // «moći ću da radim», «moraću da radim»
    if (main === -1 || main > di) return `«da ${v2}» идёт после «${v.pres[CONJ[cell.p]]}»: сначала главный глагол, потом что именно.`;
  }
  const neg = low.findIndex(x => NAUX.includes(x) || NFUT.includes(x));
  const nonfin = low.findIndex(x => x === lc(v.inf) || v.part.includes(x));
  if (neg !== -1 && nonfin !== -1 && neg > nonfin) return `«${low[neg]}» стоит перед глаголом.`;
  return null;
}

// Чем набор слов ответа отличается от набора base: чего не хватает и что лишнее.
function wordDiff(base, ans) {
  const rest = base.slice(), extra = [];
  for (const x of ans) { const i = rest.findIndex(y => y.toLowerCase() === x.toLowerCase()); if (i >= 0) rest.splice(i, 1); else extra.push(x); }
  return {missing: rest, extra, score: rest.length + extra.length};
}
const sameWords = (ex, ans) => ex.bases.some(b => wordDiff(b, ans).score === 0);
function isCorrect(ex, ans) { return sameWords(ex, ans) && !orderError(ans.map(x => x.toLowerCase()), ex.v, ex.cell); }

// Почему ответ неверен. Сообщения с «…» — сербские слова, интерфейс покажет их в выбранном письме.
function diagnose(ex, ans) {
  const low = ans.map(x => x.toLowerCase());
  if (sameWords(ex, ans)) { const e = orderError(low, ex.v, ex.cell); return e ? {ok:false, why:e} : {ok:true}; }
  const q = xs => xs.map(x => '«' + x + '»').join(', ');
  const can = wordDiff(ex.canon, ans);
  if (can.missing.length === 0) return {ok:false, why:`Лишние слова: ${q(can.extra)}.`};   // «nisam ne radio» → лишнее «ne»
  for (const d of ex.distract) if (d.why && low.includes(d.t.toLowerCase())) return {ok:false, why:d.why};
  const c = ex.bases.map(b => wordDiff(b, ans)).sort((a, b) => a.score - b.score)[0];
  if (c.missing.length && c.extra.length) return {ok:false, why:`Не хватает: ${q(c.missing)}. Лишнее: ${q(c.extra)}.`};
  if (c.missing.length === 1 && ex.cell.t === 'past' && AUX.includes(c.missing[0].toLowerCase()))
    return {ok:false, why:`По-русски в прошедшем вспомогательного глагола нет, а по-сербски в обычной речи «${c.missing[0]}» обязателен: «${ex.canon.join(' ')}».`};
  if (c.missing.length) return {ok:false, why:`Не хватает: ${q(c.missing)}.`};
  return {ok:false, why:`Лишние слова: ${q(c.extra)}.`};
}

const CYR = {a:'а',b:'б',c:'ц',č:'ч',ć:'ћ',d:'д',đ:'ђ',e:'е',f:'ф',g:'г',h:'х',i:'и',j:'ј',k:'к',l:'л',m:'м',n:'н',o:'о',p:'п',r:'р',s:'с',š:'ш',t:'т',u:'у',v:'в',z:'з',ž:'ж',dž:'џ',lj:'љ',nj:'њ'};
// ponytail: dž/lj/nj всегда диграфы — в словаре приложения нет слов вроде «nadživeti».
function toCyr(s) {
  return s.replace(/dž|lj|nj|[a-zčćđšž]/giu, m => { const r = CYR[m.toLowerCase()]; return !r ? m : m[0] === m[0].toLowerCase() ? r : r.toUpperCase(); });
}

// Самопроверка движка: откройте страницу с #selftest и смотрите консоль.
function selfTest() {
  const errors = []; let n = 0;
  const validG = (p, g) => p <= 1 ? g < 2 : p === 4 || p === 5 ? g >= 3 : g === PG[p];
  const compOk = (c, t) => !c || ((!c.t || c.t === t) && !(c.presOnly && t !== 'pres') && !(c.noFut && t === 'fut') && !(c.noPast && t === 'past'));
  const compsX = v => v.comps.flatMap(c => c && c.obj ? [0, 1, 2, 3, 4, 5, 6].map(op => objComp(c, op)) : [c]);   // местоимение — во всех лицах
  { const BI = VERBS.find(v => v.id === 'biti'), RUS = BI.comps.find(c => c && c.sr === 'Rus');
    if (ruFor(BI, {t:'pres', f:'aff', p:0, g:1, c:RUS}) !== 'Я русская.' || canonicalFor(BI, {t:'pres', f:'aff', p:4, g:3, c:RUS}).join(' ') !== 'Rusi smo') errors.push('регрессия: национальность по роду'); }
  for (const v of VERBS) for (const t of vTenses(v)) for (const f of FORMS) for (let p = 0; p < 9; p++) for (const c of compsX(v)) for (const g of [0,1,2,3,4]) for (const li of f === 'q' ? [false, true] : [false]) {
    if (!validG(p, g) || (NOUN.has(p) && v.id === 'hteti') || !compOk(c, t) || (c && c.byG && !c.byG[g]) || (c && c.cl && OBJ_BAN(p).includes(c.op))) continue;
    const cell = {t, f, p, g, c, li}, id = `${v.id} ${t}.${f}${li ? '+li' : ''} ${P[p]} g${g} ${c ? c.sr : '-'}`;
    const ex = {v, cell, canon: canonicalFor(v, cell), bases: basesFor(v, cell, false)}, ru = ruFor(v, cell);
    n++;
    if (!isCorrect(ex, ex.canon)) errors.push(id + ': основной вариант не принят');
    for (const a of variantsFor(v, cell)) if (!isCorrect(ex, a)) errors.push(id + ': не принят верный вариант ' + a.join(' '));
    for (const d of distractorsFor(v, cell, ex.canon, 9, false)) if (ex.canon.includes(d.t)) errors.push(id + ': лишняя плитка совпадает с ответом: ' + d.t);
    if (/undefined|null|\s{2}/.test(ru + ' ' + ex.canon.join(' '))) errors.push(id + ': битый текст: ' + ru + ' / ' + ex.canon.join(' '));
  }
  const CLIT_OK = new Set([...CLITICS, ...OBJ.acc, ...OBJ.dat, 'se']);
  for (const it of CLIT) if (!CLIT_OK.has(it.k) || it.at < 1 || it.at > it.w.length || (it.alt && it.alt >= it.at)) errors.push(it.id + ': неверный пример энклитики');

  // Регрессии из ревью: свободный порядок слов и честные объяснения ошибок. Слова разделены «|».
  const V = id => VERBS.find(v => v.id === id), OV = comp('ovde', 'здесь'), KU = comp('kući', 'домой'), KNJ = comp('knjigu', 'книгу');
  const mk = (id, t, f, p, g, c) => { const v = V(id), cell = {t, f, p, g, c}; return {v, cell, canon: canonicalFor(v, cell), bases: basesFor(v, cell, false), distract: []}; };
  const orders = [
    [true, 'živeti', 'pres', 'aff', 2, 0, OV, 'on|ovde|živi'],
    [true, 'živeti', 'past', 'aff', 3, 1, OV, 'ona|je|ovde|živela'],
    [true, 'živeti', 'pres', 'q', 1, 0, OV, 'da li|ovde|živiš'],
    [true, 'raditi', 'pres', 'q', 2, 0, KOD, 'da li|on|kod kuće|radi'],
    [true, 'raditi', 'fut', 'aff', 0, 0, KOD, 'ja|ću|kod kuće|raditi'],
    [true, 'raditi', 'fut', 'aff', 0, 0, KOD, 'kod kuće|ću|raditi'],
    [true, 'biti', 'past', 'aff', 0, 0, KOD, 'kod kuće|sam|bio'],
    [false, 'biti', 'pres', 'aff', 0, 0, KOD, 'sam|kod kuće'],
    [false, 'raditi', 'fut', 'aff', 0, 0, null, 'raditi|ću'],
    [false, 'raditi', 'fut', 'aff', 0, 0, KOD, 'kod kuće|radiću'],
    [false, 'raditi', 'past', 'aff', 2, 0, null, 'on|radio|je'],
    [false, 'raditi', 'fut', 'aff', 2, 0, null, 'on|radiće'],
    [false, 'raditi', 'pres', 'q', 2, 0, null, 'on|da li|radi'],
    [false, 'raditi', 'past', 'neg', 0, 0, null, 'radio|nisam'],
    [true, 'čitati', 'past', 'aff', 7, 2, KNJ, 'dete|je|čitalo|knjigu'],
    [true, 'čitati', 'past', 'aff', 7, 2, KNJ, 'knjigu|je|dete|čitalo'],
    [false, 'čitati', 'past', 'aff', 7, 2, KNJ, 'dete|je|čitao|knjigu'],
    [false, 'čitati', 'past', 'aff', 7, 2, KNJ, 'čitalo|je|knjigu'],
    [true, 'raditi', 'past', 'aff', 8, 4, KOD, 'žene|su|radile|kod kuće'],
    [false, 'raditi', 'past', 'aff', 8, 4, KOD, 'žene|su|radili|kod kuće'],
    [true, 'raditi', 'past', 'aff', 4, 3, KOD, 'radile|smo|kod kuće'],
  ];
  for (const [want, ...o] of orders) if (isCorrect(mk(...o.slice(0, 6)), o[6].split('|')) !== want) errors.push(`регрессия: «${o[6]}» должно быть ${want ? 'верно' : 'неверно'}`);
  const why = (o, s) => diagnose(mk(...o), s.split('|')).why || '';
  if (/одним словом/.test(why(['ići', 'fut', 'q', 0, 0, KU], 'ići|ću|kući'))) errors.push('регрессия: «ići ću» в вопросе объясняется слитным написанием');
  if (/«on»/.test(why(['raditi', 'pres', 'q', 2, 0, null], 'radi'))) errors.push('регрессия: необязательное «on» названо недостающим');
  if (!/Лишн/.test(why(['raditi', 'fut', 'aff', 0, 0, KOD], 'radiću|ću|raditi|kod kuće'))) errors.push('регрессия: лишние слова не названы лишними');
  if (!/Лишн.*«ne»/.test(why(['raditi', 'past', 'neg', 0, 0, null], 'nisam|ne|radio'))) errors.push('регрессия: «nisam ne radio» — лишнее «ne»');
  if (ruFor(V('biti'), {t:'pres', f:'neg', p:0, g:0, c:KOD}) !== 'Меня нет дома.') errors.push('регрессия: «Меня нет дома»');
  if (ruFor(V('čitati'), {t:'past', f:'aff', p:7, g:2, c:KNJ}) !== 'Ребёнок читал книгу.') errors.push('регрессия: «Ребёнок читал книгу»');
  if (!/Не хватает: «dete»/.test(why(['čitati', 'past', 'aff', 7, 2, KNJ], 'čitalo|je|knjigu'))) errors.push('регрессия: без «dete» фраза неполная');
  if (new Set(['sg', 'pl'].flatMap(n => ['m', 'f', 'n'].map(g => genAns(n, g)))).size !== 6) errors.push('«Род»: ответы совпадают');
  // Урок 2: объяснения не называют прошедшее время и падежи, которых ещё не было.
  for (const it of GEN) if (/\b(bio|bila|bilo|bili|bile|posla)\b|родительн|дательн|местн|творительн/.test(it.why || '')) errors.push(`«Род» ${it.w}: объяснение называет неоткрытое`);
  const seenW = new Set();
  for (const it of GEN) { if (!PRON[it.n] || !PRON[it.n][it.g] || seenW.has(it.w)) errors.push('«Род»: неверный пример ' + it.w); seenW.add(it.w); }
  for (const o of OWNERS) {
    if (POSS[o].sr.length !== 6) errors.push('«Чей»: у ' + o + ' не шесть форм');
    for (const noun of NOUNS) for (const n of ['sg', 'pl']) {
      if (!noun[n]) continue;
      const tk = possTask(o, noun, n), id = `«Чей» ${o} ${noun[n]}`;
      if (!tk.canon[0] || /undefined/.test(tk.ru + tk.canon.join(' '))) errors.push(id + ': битый текст');
      if (tk.distract.length < 3) errors.push(id + ': меньше трёх лишних плиток');
      for (const d of tk.distract) if (tk.canon.includes(d.t) || !d.why) errors.push(id + ': плохая лишняя плитка ' + d.t);
      if (!diagnosePoss(tk, tk.canon).ok) errors.push(id + ': основной вариант не принят');
    }
  }
  // Уроки: что где открыто
  if (V('biti').l !== 1 || V('raditi').l !== 1 || V('hteti').l !== 3) errors.push('уроки: biti и обычные глаголы — 1, hteti — 3');
  if (tensesOf(1).join() !== 'pres' || tensesOf(5).includes('fut') || !tensesOf(6).includes('fut')) errors.push('уроки: времена по урокам');
  for (const L of LESSONS) if (!L.soon && !L.tabs.length) errors.push(`урок ${L.n}: нет вкладок`);
  // Пример энклитики — не раньше урока, где открыты его время и слова.

  const nextHint = nxt && r >= .75 && parts.every(x => x.v >= .5)
    ? `<div class="focusbar"><span>Урок ${S.lesson} закреплён на ${Math.round(r * 100)}% — можно переходить дальше.</span><button type="button" class="link" data-lesson="${nxt.n}">К уроку ${nxt.n}</button></div>`
    : weakest && r > 0 && weakest.mode !== S.mode ? `<div class="focusbar"><span>Слабее всего в этом уроке: ${weakest.name} — ${Math.round(weakest.v * 100)}%.</span><button type="button" class="link" data-mode="${weakest.mode}">Потренировать</button></div>` : '';
  const pend = pendingFocus
    ? `<div class="focusbar"><span>Тренировка одной клетки работает в «Сборке» и «Трансформациях».</span><button type="button" class="link" id="gofocus">Перейти в «Сборку»</button><button type="button" class="link" id="nofocus">Отмена</button></div>` : '';
  $('#focusbar').innerHTML = nextHint + pend + (S.focus && ['build', 'transform', 'conj'].includes(S.mode)
    ? `<div class="focusbar"><span class="chip to">Только: ${T_RU[t]} · ${F_RU[f]}${g ? ' · ' + GROUP_RU[g] : ''}</span><button type="button" class="link" id="unfocus">Вся матрица</button></div>` : '');
}

function renderCard() {
  const card = $('#card'), kind = cur ? cur.kind : S.mode, mode = MODES.find(m => m.id === kind);
  const fresh = !S.introSeen && Object.values(S.st).every(b => !Object.keys(b).length);
  const intro = fresh
    ? `<div class="intro"><p><b>Тренажёр сербского для русскоязычных.</b> Собирайте ответы из плиток — приложение объяснит каждую ошибку и чаще будет давать то, что пока не получается.</p><p>Начните с урока 1. Правило к уроку — в шпаргалке.</p><div class="actions"><button type="button" class="btn sm primary" id="intro-ok">Понятно</button><button type="button" class="btn sm" id="rule">Открыть правило</button></div></div>` : '';
  const ask = S.gender === null && needsGender(cur)
    ? `<div class="ask"><p>Сербский различает род (${sr(cur.kind === 'phr' ? 'Rus / Ruskinja' : 'radio / radila')}). О себе вы говорите в роде:</p><div class="actions"><button type="button" class="btn sm" data-gender="m">мужском</button><button type="button" class="btn sm" data-gender="f">женском</button></div></div>`
    : '';
  const lead = intro + ask + `<div class="leadrow"><p class="lead">${isRev() ? `Повторение · ${mode.name}. ` : ''}${mode.lead}</p><button type="button" class="link" id="rule">Правило</button></div>`;
  if (kind === 'clitic') return renderClit(card, lead);
  if (kind === 'conj') return renderConj(card, lead);

  renderTiles(card, lead);
}

const poolHTML = (ex, used) => `<div class="pool" role="group" aria-label="Слова">` + ex.tiles.map(tl => used.has(tl.id)
  ? `<span class="tile ghost" aria-hidden="true">${esc(disp(tl.t))}</span>`

// «Так тоже можно: …» — другие верные варианты ответа.
const alsoHTML = (list, q) => list.length ? `<span class="also">Так тоже можно: ${list.slice(0, 2).map(a => `<span class="sent" lang="${srLang()}">${esc(sentence(a, q))}</span>`).join(' · ')}</span>` : '';
const HINT = '<span class="placeholder">Нажимайте слова по порядку. Слово в ответе убирается нажатием.</span>';
const verdict = (ok, text) => `<span class="verdict"><span lang="${srLang()}">${esc(disp(text || (ok ? 'Tačno!' : 'Netačno.')))}</span><span class="vru">${ok ? 'верно' : 'неверно'}</span></span>`;
const placedBtn = (attr, id, text) => `<button type="button" class="tile placed" ${attr}="${id}" lang="${srLang()}" aria-label="Убрать «${esc(disp(text))}»"${cur.done ? ' disabled' : ''}>${esc(disp(text))}</button>`;

function renderTiles(card, lead) {
  const ex = cur, q = ex.cell.f === 'q';
  // Род «я» из настроек показываем там, где задание само его не выдаёт.
  const hidden = ex.cell.p <= 1 && ex.cell.t === 'past' &&
    ((ex.kind !== 'transform' && ex.v.ruSpecial === 'imati') || (ex.kind === 'transform' && ex.src.t !== 'past'));
  const gchip = hidden ? `<span class="chip to">${ex.cell.p ? 'ты' : 'я'} — ${ex.cell.g ? 'женский' : 'мужской'} род</span>` : '';
  let head;
  if (ex.kind !== 'transform') {   // «Сборка» и «Местоимения»
    head = `<div class="meta"><span class="chip">${T_RU[ex.cell.t]}</span><span class="chip">${F_RU[ex.cell.f]}</span>${gchip}</div><p class="prompt" lang="ru">${esc(ruFor(ex.v, ex.cell))}</p>`;
  } else {
    const to = [];
    if (ex.src.t !== ex.cell.t) to.push(T_RU[ex.cell.t]);
    if (ex.src.f !== ex.cell.f) to.push(F_RU[ex.cell.f]);
    head = `<div class="meta"><span class="chip">измените на</span>${to.map(x => `<span class="chip to">→ ${x}</span>`).join('')}${gchip}</div><p class="prompt" lang="${srLang()}">${esc(sentence(canonicalFor(ex.v, ex.src), ex.src.f === 'q'))}</p><p class="gloss" lang="ru">${esc(ruFor(ex.v, ex.src))}</p>`;
  }
  const ansTiles = ex.placed.length
    ? ex.placed.map((id, i) => placedBtn('data-un', id, i === 0 ? cap(ex.tiles[id].t) : ex.tiles[id].t)).join('') + (ex.done ? `<span class="punct">${q ? '?' : '.'}</span>` : '')
    : HINT;
  let actions, fb = '';
  if (!ex.done) actions = `<button type="button" class="btn primary" id="check"${ex.placed.length ? '' : ' disabled'}>Проверить</button><button type="button" class="btn" id="clear"${ex.placed.length ? '' : ' disabled'}>Стереть</button>`;
  else {
    actions = `<button type="button" class="btn primary" id="next">Дальше</button>`;
    const canon = `<span class="sent" lang="${srLang()}">${esc(sentence(ex.canon, q))}</span>`;
    if (ex.ok) {
      const same = eqT(ex.ans, ex.canon);
      // Равноправные варианты («Da li su…?» / «Jesu li…?», «Kod kuće si» / «Ti si kod kuće») — «так тоже можно».
      const isAlt = ex.alts.some(a => eqT(a, ex.ans)), others = same || isAlt ? [ex.canon, ...ex.alts].filter(a => !eqT(a, ex.ans)) : ex.alts;

    } else {
      fb = `<div class="fb bad" tabindex="-1">${verdict(false)}<span><s lang="${srLang()}">${esc(sentence(ex.ans, q))}</s> → ${canon}</span>${alsoHTML(ex.alts, q)}<p class="why">${whyHTML(ex.why)}</p>${sameWords(ex, ex.ans) ? '<span><button type="button" class="link" id="override">Мой порядок слов тоже верный — засчитать</button></span>' : ''}</div>`;
    }
  }
  card.innerHTML = lead + head +
    `<div class="answer${ex.done ? (ex.ok ? ' ok' : ' bad') : ''}" role="group" aria-label="Ваш ответ">${ansTiles}</div>${ex.done ? '' : poolHTML(ex, new Set(ex.placed))}${fb}<div class="actions">${actions}</div>`;
}

function renderConj(card, lead) {
  const ex = cur, next = ex.target != null ? ex.target : ex.fill.indexOf(null), used = new Set(ex.fill.filter(x => x !== null));
  const who = r => {
    if (ex.t !== 'past') return esc(disp(r.p === 2 ? 'on, ona, ono' : r.p === 6 ? (S.lesson >= NOUN_L ? 'oni, one, ona' : 'oni') : P[r.p]));
    const mark = r.p <= 1 ? (r.g ? ' (ж)' : ' (м)') : (r.p === 4 || r.p === 5) && r.g === 4 ? ' (ж)' : '';
    return esc(disp(P[r.p])) + mark;
  };
  // Парадигма как в сербских грамматиках: jednina слева (ja, ti, on), množina справа (mi, vi, oni).
  const cell = (r, i) => {
    const id = ex.fill[i], res = ex.done ? ex.res[i] : null;

      : placedBtn('data-row', i, ex.tiles[id].t);
    return `<div class="ccell${res ? (res.ok ? ' ok' : ' bad') : ''}"><span class="who" lang="${srLang()}">${who(r)}</span>${slot}</div>`;
  };
  const cells = ex.rows.map(cell);
  const grid = `<div class="paradigm"><span class="colh">${sr('jednina')} · ед. ч.</span>${cells.slice(0, 3).join('')}<span class="colh">${sr('množina')} · мн. ч.</span>${cells.slice(3).join('')}</div>`;
  const notes = ex.done && !ex.ok ? `<ul class="cnotes">${ex.rows.map((r, i) => ex.res[i].ok ? '' :
    `<li><span class="who" lang="${srLang()}">${who(r)}</span> <span class="sent" lang="${srLang()}">${esc(disp(r.form))}</span>${ex.res[i].why ? `<span>${whyHTML(ex.res[i].why)}</span>` : ''}</li>`).join('')}</ul>` : '';
  const actions = ex.done
    ? `<button type="button" class="btn primary" id="next">Дальше</button>`
    : `<button type="button" class="btn primary" id="check"${next < 0 ? '' : ' disabled'}>Проверить</button><button type="button" class="btn" id="clear"${used.size ? '' : ' disabled'}>Стереть</button>`;
  const right = ex.done ? ex.res.filter(x => x.ok).length : 0;
  const fb = !ex.done ? '' : ex.ok
    ? `<div class="fb ok" tabindex="-1">${verdict(true)}<span>Все шесть форм верны.</span></div>`
    : `<div class="fb bad" tabindex="-1">${verdict(false)}<span>Верно ${right} из ${ex.rows.length}. Правильные формы:</span>${notes}</div>`;
  card.innerHTML = lead + `<div class="meta"><span class="chip">${T_RU[ex.t]}</span><span class="chip">${F_RU[ex.f]}</span></div>` +
    `<p class="prompt"><span lang="${srLang()}">${esc(disp(ex.v.inf))}</span> <span class="trn" lang="ru">— ${esc(TR[ex.v.id] || (ex.v.ru && ex.v.ru.inf) || '')}</span></p>` +
    grid + (ex.done ? '' : poolHTML(ex, used)) + fb + `<div class="actions">${actions}</div>`;
}

// «Чей», «Фразы», «Падежи»: собрать ответ из плиток. frame — фраза с «___», ответ встаёт на его место.
const TT_CHIP = {poss:'чей', phr:'фраза', case:'падеж'};
// Что сделать — коротко, по виду задания: реплика, пропуск, значение слова, число…
function howOf(ex) {
  const k = (ex.key || '').split('.')[0];
  if (ex.kind === 'poss') return 'чей + слово';
  if (ex.kind === 'case') return 'поставьте слово в нужную форму';
  if (k === 'ff' || k === 'vid') return 'выберите значение';
  if (k === 'pl') return 'выберите множественное число';
  if (k === 'num') return 'соберите число словами';
  if (k === 'qty' || k === 'qtyc' || k === 'cnt') return 'число + слово в нужной форме';
  if (ex.frame) return 'вставьте пропущенное';
  if (ex.sr) return 'ответьте по-сербски';
  return 'скажите по-сербски';
}
// «Так тоже можно»: другой верный вариант — alt, если ответили основным, или основной, если ответили alt.
const alsoTT = (ex, show) => { if (ex.overridden || !ex.alts.length) return ''; const L = a => a.join('|').toLowerCase();
  const list = [ex.canon, ...ex.alts].filter(a => !ex.ok || L(a) !== L(ex.ans)).filter(a => ex.ok || L(a) !== L(ex.canon));
  return list.length ? `<span class="also">Так тоже можно: ${list.slice(0, 2).map(a => `<span class="sent" lang="${srLang()}">${show(a)}</span>`).join(' · ')}</span>` : ''; };
function renderTT(card, lead) {
  const ex = cur, lowFirst = ex.kind !== 'poss';   // во «Фразах» и «Падежах» регистр задан в данных
  const inFrame = toks => ex.frame ? ex.frame.replace('___', toks.join(' ')) : toks.join(' ');
  const ans = ex.placed.length
    ? ex.placed.map((id, i) => placedBtn('data-un', id, i === 0 && !lowFirst ? cap(ex.tiles[id].t) : ex.tiles[id].t)).join('')
    : HINT;
  const show = toks => esc(disp(ex.kind === 'poss' ? cap(toks.join(' ')) : inFrame(toks)));
  const right = `<span class="sent" lang="${srLang()}">${show(ex.canon)}</span>`;
  const fb = !ex.done ? '' : ex.ok
    ? `<div class="fb ok" tabindex="-1">${verdict(true)}${ex.overridden ? `<span>Засчитано. Основной вариант: ${right}</span>` : right}${alsoTT(ex, show)}</div>`
    : `<div class="fb bad" tabindex="-1">${verdict(false)}<span><s lang="${srLang()}">${show(ex.ans)}</s> → ${right}</span>${alsoTT(ex, show)}${ex.why ? `<p class="why">${whyHTML(ex.why)}</p>` : ''}${ttOwn(ex) ? '<span><button type="button" class="link" id="override">Мой ответ тоже верный — засчитать</button></span>' : ''}</div>`;
  const actions = ex.done
    ? `<button type="button" class="btn primary" id="next">Дальше</button>`
    : `<button type="button" class="btn primary" id="check"${ex.placed.length ? '' : ' disabled'}>Проверить</button><button type="button" class="btn" id="clear"${ex.placed.length ? '' : ' disabled'}>Стереть</button>`;
  // Реплика собеседника отдельно от смысла ответа: «Вам говорят: …» — «Ответьте: да».
  const stim = ex.sr ? `<p class="said"><span class="trn">Вам говорят:</span> <span class="prompt" lang="${srLang()}">${esc(disp(ex.sr))}</span></p><p class="prompt trn" lang="ru">Ответьте: ${whyHTML(ex.ru.replace(/^—\s*/, ''))}</p>` +
      (ex.frame ? `<p class="frame" lang="${srLang()}">${esc(disp(ex.frame))}</p>` : '')
    : `<p class="prompt" lang="ru">${ex.kind === 'poss' ? esc(cap(ex.ru)) : whyHTML(ex.ru)}</p>` +
    (ex.frame ? `<p class="frame" lang="${srLang()}">${esc(disp(ex.frame))}</p>` : '');
  card.innerHTML = lead + `<div class="meta"><span class="chip to">${howOf(ex)}</span></div>${stim}` +
    `<div class="answer${ex.done ? (ex.ok ? ' ok' : ' bad') : ''}" role="group" aria-label="Ваш ответ">${ans}</div>${ex.done ? '' : poolHTML(ex, new Set(ex.placed))}${fb}<div class="actions">${actions}</div>`;
}

function renderGen(card, lead) {
  const ex = cur, it = ex.it, ch = ex.chosen, G = {m:'мужской', f:'женский', n:'средний'};
  const tile = (n, g) => {
    const cls = !ex.done ? '' : n === it.n && g === it.g ? ' right' : ch.n === n && ch.g === g ? ' wrong' : '';

  };
  const row = (n, label) => `<div class="grow"><span class="colh">${sr(label)} · ${n === 'sg' ? 'ед. ч.' : 'мн. ч.'}</span><div class="gtiles">${['m', 'f', 'n'].map(g => tile(n, g)).join('')}</div></div>`;
  let fb = '';
  if (ex.done) {
    const pair = `<span class="sent" lang="${srLang()}">${esc(sentence([it.w, it.n === 'sg' ? 'je' : 'su', 'ovde'], false))} → ${esc(sentence([genAns(it.n, it.g), 'ovde'], false))}</span>`;
    const numWrong = ch.n !== it.n;

  }
  card.innerHTML = lead + `<div class="meta"><span class="chip">чем заменить слово</span></div>` +
    `<p class="prompt"><span lang="${srLang()}">${esc(disp(it.w))}</span> <span class="trn" lang="ru">— ${esc(it.ru)}</span></p>` +
    `<div class="gpick">${row('sg', 'jednina')}${row('pl', 'množina')}</div>` +
    fb + (ex.done ? `<div class="actions"><button type="button" class="btn primary" id="next">Дальше</button></div>` : '');
}

function renderClit(card, lead) {
  const ex = cur, it = ex.it, k = it.k;
  let row = '';
  const slot = i => {
    if (!ex.done) return `<button type="button" class="slot" data-slot="${i}" aria-label="Поставить «${esc(disp(k))}» ${i === 0 ? 'в начало' : `после «${esc(disp(ex.words[i - 1]))}»`}"></button>`;
    return i === ex.chosen ? `<span class="ins ${ex.ok ? 'ok' : 'bad'}" lang="${srLang()}">${esc(disp(k))}</span>` : '<span class="gap"></span>';
  };
  ex.words.forEach((wd, i) => { row += slot(i) + `<span class="w" lang="${srLang()}">${esc(disp(wd))}</span>`; });
  row += slot(ex.words.length) + `<span class="w punct">${it.q ? '?' : '.'}</span>`;
  const build = s => { const t = ex.words.slice(); t[0] = t[0][0].toLowerCase() + t[0].slice(1); t.splice(s, 0, k); return sentence(t, it.q); };
  let fb = '', actions = '';
  if (ex.done) {
    actions = `<button type="button" class="btn primary" id="next">Дальше</button>`;
    const right = `<span class="sent" lang="${srLang()}">${esc(build(it.at))}</span>`;
    // «Moja je sestra…» — разрыв группы допустим, но звучит книжно; основной вариант — после всей группы.
    const alt = ex.chosen === it.alt ? `<p class="why">${whyHTML(`Так тоже можно — это книжнее. В разговоре чаще после всей группы: «${ex.words.slice(0, it.at).join(' ')}».`)}</p>` : '';
    if (ex.ok) fb = `<div class="fb ok" tabindex="-1">${verdict(true)}${right}${alt}</div>`;
    else {
      const first = ex.words.slice(0, it.at).join(' ');
      const btw = ex.chosen < it.at ? ex.words.slice(ex.chosen, it.at) : ex.words.slice(it.at, ex.chosen), grp = btw.every(x => CLITICS.has(x.toLowerCase()) || x.toLowerCase() === 'se');   // ошибка внутри группы энклитик
      const why = ex.chosen === 0 ? `«${k}» — энклитика: с неё фраза не начинается.`
        : grp && ex.chosen < it.at ? `В группе энклитик сначала «${btw.join(' ')}», потом «${k}»: «${[...btw, k].join(' ')}».`
        : grp ? `В группе энклитик «${k}» идёт перед «${btw.join(' ')}»: «${[k, ...btw].join(' ')}».`
        : ex.chosen < it.at ? `«${first}» — одно целое, энклитика встаёт после него.`
        : `Энклитика стоит на втором месте — сразу после «${first}».`;
      fb = `<div class="fb bad" tabindex="-1">${verdict(false)}${right}<p class="why">${whyHTML(why)}</p></div>`;
    }
  }
  card.innerHTML = lead + `<div class="meta"><span class="chip">куда поставить</span><span class="chip to" lang="${srLang()}">${esc(disp(k))}</span></div><p class="prompt" lang="ru">${esc(ex.ru)}</p><div class="slots">${row}</div>${fb}${actions ? `<div class="actions">${actions}</div>` : ''}`;
}

// Закреплённость клетки матрицы — по всем группам глаголов, открытым к этому уроку.
function mastery(t, f) {
  const Ls = [...new Set(VERBS.filter(v => v.l <= S.lesson && vTenses(v).includes(t)).map(v => cellL(t, v)))].filter(l => l <= S.lesson);
  let s = 0; for (const g of GROUPS) for (const l of Ls) { const r = B('cells')[`${t}.${f}.${g}#${l}`]; s += r ? r.box / 4 : 0; }
  return Ls.length ? s / GROUPS.length / Ls.length : 0;

const heatCell = (m, extra, label) => { const p = Math.round(m * 100); return `<button type="button" class="cell${extra}" style="--p:${p}%" aria-label="${label}: ${p}%"><span class="num">${p}%</span></button>`; };
function renderSide() {
  renderLessons();   // проценты уроков меняются с каждым ответом
  const mode = isRev() && cur ? cur.kind : S.mode, box = r => r ? r.box / 4 : 0;
  let title = 'Матрица', hint = 'Процент — насколько клетка закреплена в этом уроке. Нажмите на клетку, чтобы тренировать только её.', h = '', weak = [];
  if (mode === 'rod' || mode === 'poss') {
    title = mode === 'rod' ? 'Род: закреплённость' : 'Чей: закреплённость';
    hint = 'По числу и роду слова, только в этом уроке.';

const settingsOf = s => ({lesson:s.lesson, mode:s.mode, gender:s.gender, script:s.script, focus:s.focus, introSeen:s.introSeen, settingsAt:s.settingsAt});
const visible = s => [s.lesson, s.mode, s.gender, s.script, s.focus].join('|');

// Слияние двух копий прогресса. По каждой клетке берём запись, где больше ответов; настройки — более свежие.
// Сброс — это «эпоха» resetAt: запись, созданная в старой эпохе (rs меньше), отбрасывается, какие бы ни были часы.
// ponytail: ответы, данные параллельно в одну и ту же клетку на двух устройствах, сольются в одну запись
// (выиграет та, где их больше) — нужен CRDT со счётчиками по устройствам, если это станет заметно.
function mergeState(a, b) {

function adopt(next) {

function scheduleRemote(ms) { if (!remoteRef) return; clearTimeout(saveTimer); saveTimer = setTimeout(() => { saveTimer = 0; flushNow(); }, ms); }

    if (attempt < 5) setTimeout(() => initRemote(attempt + 1), 2000 * 2 ** attempt);   // временный сбой при запуске — повторить
  }
}

if (location.hash === '#selftest') { const r = selfTest(); console.log('selfTest:', r.cells, 'клеток,', r.errors.length, 'ошибок'); r.errors.forEach(x => console.warn(x)); }
// Перенос из v1 этого браузера — один раз.
try { if (!localStorage.getItem(V1_DONE)) { const v1 = loadLocal(LS_V1); if (v1) { S = fixMode(importV1(S, v1)); saveLocal(); } localStorage.setItem(V1_DONE, '1'); } } catch (e) {}
showEx(); renderAll(); initRemote();
})();
</script>
